<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งค่าต้นทุน/ค่าแรง · SSB</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--bg:#eef1f4;--card:#fff;--card2:#f6f8fa;--line:#e2e6ea;--line2:#cfd5db;--txt:#1a2530;--txt2:#6b7785;--primary:#1f8a52;--danger:#c8352f;--radius:8px}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#182028;--card2:#1f2830;--line:#2a343d;--line2:#3a4650;--txt:#e6ebf0;--txt2:#8a97a3;--primary:#2ea567;--danger:#e5645d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;line-height:1.5;padding:16px 12px 90px}
  .wrap{max-width:820px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;padding:2px 2px 14px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  h1{font-size:17px;margin:0;font-weight:700}.sub{font-size:12px;color:var(--txt2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
  .ch{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:7px}
  .note{font-size:11.5px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
  label{font-size:11.5px;color:var(--txt2);display:block}
  input{width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--card2);color:var(--txt);font:inherit;font-size:14px}
  input[readonly]{opacity:.6}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:center}
  th{font-size:11px;color:var(--txt2)}
  td:first-child,th:first-child{text-align:left}
  td input{width:64px;margin:0;text-align:center;padding:5px}
  .tag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--txt2)}
  .save{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px;display:flex;gap:10px;justify-content:center;z-index:10}
  .btn{padding:11px 24px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt2);font-weight:400}
  .formula{background:var(--card2);border-left:3px solid var(--primary);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--txt2);line-height:1.8;font-family:"IBM Plex Mono",monospace}
  .msg{text-align:center;color:var(--txt2);padding:30px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:50;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}
  details.help{margin-top:5px;font-size:12px;color:var(--txt2)}
  details.help summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:12px;list-style:none;display:inline-block;padding:2px 0}
  details.help summary::-webkit-details-marker{display:none}
  details.help summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
  details.help[open] summary{margin-bottom:4px}
  details.help>div{background:var(--card2);border-left:3px solid var(--primary);border-radius:6px;padding:8px 11px;line-height:1.7}
  details.help ul{margin:4px 0;padding-left:18px}
  details.help b{color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button onclick="goBack()" style="border:1px solid var(--line2);background:var(--card);color:var(--txt);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer">←</button>
    <div class="logo">⚙️</div>
    <div><h1>ตั้งค่าต้นทุน / ค่าแรง</h1><div class="sub">แก้แล้วบันทึกกลับฐานข้อมูล — มีผลกับเที่ยว<b>ที่คิดใหม่</b>เท่านั้น</div></div>
  </div>
  <div id="tplbar"></div>
  <div id="body"><div class="msg">กำลังเข้าสู่ระบบ…</div></div>
</div>
<style>
#tplbar{margin:14px 0 2px}
.tplwrap{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:13px 15px}
.tplhead{font-size:14px;font-weight:800;color:var(--txt);margin-bottom:10px}
.tplsub{font-size:11.5px;font-weight:400;color:var(--txt2);margin-left:6px}
.tplnote{font-size:12px;color:var(--txt2);line-height:1.6}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.tchip{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--card)}
.tchip.on{border-color:var(--primary)}
.tchipname{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--txt);background:none;border:0;padding:7px 13px;cursor:pointer}
.tchip.on .tchipname{color:var(--primary);cursor:default}
.tchipbadge{font-size:10px;font-weight:700;color:#fff;background:var(--primary);padding:2px 9px;border-radius:999px;margin-right:5px}
.tchipx{font-family:inherit;font-size:12px;color:var(--txt2);background:none;border:0;padding:6px 10px 6px 3px;cursor:pointer}
.tchipx:hover{color:var(--danger)}
.tacts{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{font-family:inherit;font-size:12px;font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer}
.tbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn:hover{filter:brightness(.97)}
</style>

<div class="save" id="saveBar" style="display:none">
  <button class="btn ghost" onclick="location.reload()">ยกเลิก</button>
  <button class="btn" id="saveBtn">💾 บันทึกเข้าฐาน</button>
</div>
<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw2DXaTVoX5cgUZjQrGlpx7tQ1-gwcYYB85eY8MElo2oaqBIxCsjVfL7yMiM8uuUw9YxA/exec';
const LIFF_ID='2010274217-Ot7vGhri';
let MY_UID='', DATA=null;
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
function goBack(){ if(history.length>1){history.back();} else {location.href='https://sadayu07ktc-droid.github.io/SSB-SMART-SUPPLY-DASHBOARD/';} }

// ป้ายชื่อ param กลาง
const PLBL={run_rate_per_hr:'เลทค่าวิ่ง (บ./ชม.)',load_rate_per_hr:'ค่าขึ้น-ลง (บ./ชม.)',fuel_rate_wage:'เลทน้ำมันคิดค่าแรง (บ./ล.)',heavy_pct:'ถ่วงหนัก (%)',light_pct:'ถ่วงเบา (%)',bonus_pct:'โบนัส % ค่าเที่ยว',tarp_fee:'ค่าคลุมผ้าใบ (บ.)',hooklift_fee:'ค่ายกกระบะ ฮุคลิฟท์ (บ./ครั้ง)',hooklift_liters:'ฮุคลิฟท์ +น้ำมัน (ลิตร/ครั้ง · เทปาล์ม)',give_per_hr:'ให้เพิ่มตามเวลาวิ่ง (บ./ชม.ไป-กลับ)',wait_rate_per_hr:'ค่ารอลงของ (บ./ชม. · × ชม.รอต่อปลายทาง)',overnight_fee:'ค่ารอขึ้นของข้ามคืน (บ./คืน · เลิกใช้)'};
// R.5: ฮุคลิฟท์ = hooklift_fee (บ./ครั้ง · แปลงเป็นลิตรเมื่อเปิด "จ่ายผ่านลิตร") — hooklift_liters (V.2) เลิกใช้ ไม่มีโค้ดอ่านแล้ว
PLBL.hooklift_fee='ค่าฮุคลิฟท์ (บ./ครั้ง)';
PLBL.hardship_fee='Hardship ค่าความยาก (บ./เที่ยว)';
const PORDER=['run_rate_per_hr','load_rate_per_hr','fuel_rate_wage','heavy_pct','light_pct','bonus_pct','tarp_fee','hooklift_fee','hardship_fee','give_per_hr','wait_rate_per_hr'];

// นิยาม toggle: [key, ป้าย, [[ค่า,ป้ายตัวเลือก],...], คำอธิบาย]
const TOGDEF=[
  ['weight_on','ถ่วงหนัก/เบา',[[1,'เปิด'],[0,'ปิด']],'ปิด = ทุกขาคิดเต็ม 100% ไม่แบ่ง 70/30'],
  ['time_mode','วิธีคิดเวลาวิ่ง',[[2,'ไล่ระดับ'],[0,'ขั้นบันได'],[1,'เหมาช่วงเดียว']],'ไล่ระดับ = ใช้ตาราง "ความเร็วไล่ระดับ" (สูตรปัจจุบัน) · ขั้นบันได/เหมาช่วงเดียว = ใช้ความเร็วในตาราง "ช่วงระยะ"'],
  ['speed_mode','ความเร็วที่ใช้',[[0,'เลทตามช่วง'],[1,'GPS จริง (ยังไม่รองรับ)']],'⚠️ ระบบคิดค่าแรงยังไม่รองรับ "GPS จริง" — ตอนนี้ใช้ความเร็วจากตารางเสมอ ไม่ว่าเลือกอะไร'],
  ['dist_source','ระยะที่ใช้คิด',[[0,'จริง'],[1,'ค่ากลาง']],'ค่ากลาง = ใช้ระยะจากหน้า 📍 ค่ากลาง (ผูกรหัสสวน) · ออเดอร์ที่หาค่ากลางไม่เจอ ใช้ระยะจริง'],
  ['fuel_bench','เกณฑ์น้ำมัน',[[3,'ตามระยะหนักเบา'],[4,'หนักเบา-เรทช่วง'],[5,'หนักเบา-เกลี่ยในช่วง'],[2,'ค่าเดียว'],[0,'หนัก-เบา'],[1,'ตามช่วงระยะ']],'ใช้ กม./ล. แบบไหนคิดลิตรตามเกณฑ์ · สูตร R.11 ใช้ "ตามระยะหนักเบา" (ตาราง⑬)'],
  ['fuel_adj_on','เพิ่ม/หักน้ำมัน',[[1,'เปิด'],[0,'ปิด']],'ปิด = ไม่คิดเพิ่ม/หักน้ำมันเลย'],
  ['tarp_on','ค่าคลุมผ้าใบ',[[1,'เปิด'],[0,'ปิด']],'เปิดแล้วยังดูต่อประเภทงาน (ตารางล่าง) ว่าคิดไหม'],
  ['bonus_on','โบนัส',[[1,'เปิด'],[0,'ปิด']],'ปิด = ไม่คิดโบนัส %'],
  ['bonus_base','ฐานคิดโบนัส',[[0,'หลังน้ำมัน'],[1,'ก่อน (ค่าวิ่ง+ขึ้นลง)']],'ก่อน = คิด % จากค่าวิ่ง+ขึ้นลงเท่านั้น'],
  // R.5 — ระบบคิดค่าแรงใช้อยู่ (เดิมหน้านี้ไม่มีให้ตั้ง)
  ['load_on','ค่าขึ้น-ลง',[[1,'เปิด'],[0,'ปิด']],'เลทค่าขึ้น-ลง × (นาทีขึ้น+ลง ตามประเภทงาน) ÷ 60'],
  ['hooklift_on','ค่าฮุคลิฟท์',[[1,'เปิด'],[0,'ปิด']],'คิดเฉพาะประเภทงานที่ติ๊ก "ฮุคลิฟท์" ในตารางล่าง'],
  ['hardship_on','Hardship ค่าความยาก',[[1,'เปิด'],[0,'ปิด']],'คิดเฉพาะประเภทงานที่ติ๊ก "Hardship" ในตารางล่าง'],
  ['give_on','ให้เพิ่มตามเวลาวิ่ง',[[1,'เปิด'],[0,'ปิด']],'ให้เพิ่ม บ./ชม. × ชั่วโมงวิ่งทั้งเที่ยว · ทุกงาน'],
  ['wait_on','ค่ารอลงของ',[[1,'เปิด'],[0,'ปิด']],'ชม.รอตาม DP Type ของสถานี × เลทค่ารอลงของ'],
  ['via_liters','จ่ายฮุคลิฟท์ + ให้เพิ่ม',[[1,'แปลงเป็นลิตรน้ำมัน'],[0,'จ่ายเป็นบาท']],'แปลงเป็นลิตร = บาท ÷ เลทน้ำมันคิดค่าแรง แล้วบวกเข้าลิตรตามเกณฑ์ (ไปอยู่ในยอดเพิ่ม/หักน้ำมัน) · จ่ายเป็นบาท = บวกตรงเข้าค่าแรง']
];
let TOG={};
// ⓘ คำอธิบายวิธีคิดแต่ละแบบ (กดเปิดใต้สวิตช์ — ใช้ได้ทั้งมือถือ/คอม) · ตัวอย่างคิดจากค่าที่ตั้งอยู่ตอนนี้
const HELP={
  time_mode:()=>'<b>แปลงระยะเป็นชั่วโมงวิ่ง</b> (ตัวอย่างระยะไป-กลับ 50 กม.)<ul>'
    +'<li><b>ไล่ระดับ</b> — หาความเร็วจากตาราง "ความเร็วไล่ระดับ" ตามระยะรวม ไล่เส้นตรงระหว่างจุด · 50 กม. อยู่ระหว่าง 40→38 กับ 60→42 = 40 กม./ชม. → 50 ÷ 40 = <b>1.25 ชม.</b></li>'
    +'<li><b>ขั้นบันได</b> — หั่นระยะตาม "ตารางช่วงระยะ" แต่ละท่อนใช้ความเร็วช่วงตัวเอง (เหมือนขั้นภาษี) · 25÷30 + 15÷38 + 10÷42 = <b>1.47 ชม.</b></li>'
    +'<li><b>เหมาช่วงเดียว</b> — ทั้งระยะใช้ความเร็วของช่วงที่ระยะรวมตกอยู่ · 50 กม. ตกช่วง 40–60 (42) → 50 ÷ 42 = <b>1.19 ชม.</b></li></ul>'
    +'จากนั้น ค่าวิ่ง = เลทค่าวิ่ง × ชม. (แบ่งให้แต่ละขา) × 2 × %หนัก/เบา',
  speed_mode:()=>'<b>ต่างจาก "วิธีคิดเวลาวิ่ง" ยังไง</b><ul>'
    +'<li><b>วิธีคิดเวลาวิ่ง</b> = สูตรแปลงระยะเป็นชั่วโมง (ไล่ระดับ / ขั้นบันได / เหมาช่วง)</li>'
    +'<li><b>ความเร็วที่ใช้</b> = เอาความเร็วมาจากไหน: <b>เลทตามช่วง</b> = จากตาราง · <b>GPS จริง</b> = ตั้งใจให้ใช้เวลาวิ่งจริงจาก GPS แทนการคำนวณ</li></ul>'
    +'⚠️ "GPS จริง" <b>ยังไม่ได้ทำในระบบคิดค่าแรง</b> — เลือกแล้วไม่มีผล ระบบใช้ตารางเสมอ',
  dist_source:()=>'<ul><li><b>จริง</b> — ระยะจากเลขไมล์ที่คนขับกรอกแต่ละจุด</li>'
    +'<li><b>ค่ากลาง</b> — ระยะเที่ยวเดียวจากหน้า 📍 ค่ากลาง × 2 (ไป-กลับ) แล้วแบ่งขาหนัก/เบาตามสัดส่วนเลขไมล์จริง · หาค่ากลางไม่เจอ = ใช้ระยะจริง · ตัวอย่าง ลานคลองหาด ค่ากลาง 136.25 → คิด <b>272.5 กม.</b> (วิ่งจริง 273)</li></ul>',
  fuel_bench:()=>{const z=zoneOf('พ่วง'),f=fwOf('พ่วง'),r2=v=>(Math.round(v*10)/10).toLocaleString('th-TH'),D=180;
    // คิดตัวอย่างจากขอบช่วง/กม./ล. ที่ตั้งอยู่จริง (สูตรเดียวกับระบบ: ส่วนในช่วง = min(ระยะ, ถึง) − ตั้งแต่)
    const parts=z.map(x=>({p:Math.min(D,+x.to_km)-(+x.from_km),k:+x.kmpl_heavy})).filter(x=>x.p>0&&x.k>0);
    const zh=parts.reduce((a,x)=>a+x.p/x.k,0), hit=z.find(x=>D<=+x.to_km)||z[z.length-1]||{}, rh=hit.kmpl_heavy?D/hit.kmpl_heavy:0;
    const hitLbl=(+hit.to_km>=9999)?(hit.from_km+' ขึ้นไป'):(hit.from_km+'–'+hit.to_km);
    return '<b>ลิตรตามเกณฑ์</b> (ตัวอย่าง รถพ่วง วิ่งหนัก '+D+' กม. · เบา '+D+' กม.) → ใช้เทียบกับลิตรที่เติมจริง = เพิ่ม/หักน้ำมัน<ul>'
    +'<li><b>ตามระยะหนักเบา</b> (R.11 ตาราง⑬) — แยกระยะหนัก/เบา แล้วกระจายแต่ละก้อนลงช่วงแบบขั้นบันได แต่ละส่วน ÷ กม./ล. ของช่วงนั้น · หนัก '+D+' = '+(parts.map(x=>r2(x.p)+'÷'+x.k).join(' + ')||'—')+' = <b>'+r2(zh)+' ล.</b> (เบาคิดแบบเดียวกัน)</li>'
    +'<li><b>หนักเบา-เรทช่วง</b> (ตาราง⑬ · ตาม Excel R.11) — ระยะหนักทั้งก้อนตกช่วงไหน ใช้ กม./ล. ช่วงนั้นทั้งก้อน · หนัก '+D+' ตกช่วง '+hitLbl+' → '+D+'÷'+(hit.kmpl_heavy||0)+' = <b>'+r2(rh)+' ล.</b> · ⚠️ มีจุดกระโดดที่ขอบช่วง (เกินขอบ 1 กม. ลิตรลดฮวบ)</li>'
    +(()=>{const hi=z.findIndex(x=>D<=+x.to_km),i=hi<0?z.length-1:hi;if(!z.length)return '';
      const last=(i===z.length-1&&+z[i].to_km>=9999);
      if(i===0||last)return '<li><b>หนักเบา-เกลี่ยในช่วง</b> (ตาราง⑬) — กม./ล. ไล่เส้นตรงจากเรทช่วงก่อน (ที่ขอบบนช่วงก่อน) ขึ้นไปเต็มเรทช่วงนี้ที่เพดาน · ช่วงแรกใช้เรทคงที่ · ช่วงสุดท้ายเกลี่ยจนเต็มเรทที่ '+pvN('fuel_zone_blend_to',600)+' กม.</li>';
      const p=z[i-1],c=z[i],a=+p.to_km,t=Math.max(0,Math.min(1,(D-a)/((+c.to_km-a)||1))),k=(+p.kmpl_heavy)+t*((+c.kmpl_heavy)-(+p.kmpl_heavy));
      return '<li><b>หนักเบา-เกลี่ยในช่วง</b> (ตาราง⑬) — กม./ล. ไล่เส้นตรงจากเรทช่วงก่อน (ที่ขอบบนช่วงก่อน) ขึ้นไปเต็มเรทช่วงนี้ที่เพดาน ไม่มีจุดกระโดด · หนัก '+D+' อยู่ '+r2(D-a)+' จาก '+r2(+c.to_km-a)+' กม. ของช่วง ('+Math.round(t*100)+'%) → '+p.kmpl_heavy+' + '+Math.round(t*100)+'% × ('+c.kmpl_heavy+' − '+p.kmpl_heavy+') = '+k.toFixed(2)+' กม./ล. → '+D+'÷'+k.toFixed(2)+' = <b>'+r2(D/k)+' ล.</b> · ช่วงแรกใช้เรทคงที่ · ช่วงสุดท้าย (ไม่จำกัด) เกลี่ยจนเต็มเรทที่ '+pvN('fuel_zone_blend_to',600)+' กม. แล้วคงที่</li>';})()
    +'<li><b>ค่าเดียว</b> — ระยะรวม ÷ กม./ล.ค่าเดียวของประเภทรถ · 360÷'+(f.kmpl_single||0)+' = <b>'+r2(360/(f.kmpl_single||1))+' ล.</b></li>'
    +'<li><b>หนัก-เบา</b> — ระยะหนัก ÷ กม./ล.หนัก + ระยะเบา ÷ กม./ล.เบา (ค่าเดียวทุกระยะ) · 180÷'+(f.kmpl_heavy||0)+' + 180÷'+(f.kmpl_light||0)+' = <b>'+r2(180/(f.kmpl_heavy||1)+180/(f.kmpl_light||1))+' ล.</b></li>'
    +'<li><b>ตามช่วงระยะ</b> — ระยะรวมหั่นตาม "ตารางช่วงระยะ" แต่ละท่อน ÷ กม./ล. ช่วงนั้น (ไม่แยกหนัก/เบา)</li></ul>';},
  weight_on:()=>'<b>เปิด</b> — ขาที่รถหนัก (มีของ) ได้ '+pvN('heavy_pct',70)+'% ขาเบาได้ '+pvN('light_pct',30)+'% ของ (เลทค่าวิ่ง × ชม. × 2) · ปกติไปเบา-กลับหนัก รวมได้ 100% · <b>ปิด</b> — ทุกขาได้เต็ม',
  via_liters:()=>'ตัวอย่างค่าฮุคลิฟท์ '+pvN('hooklift_fee',100)+' บ. · เลทน้ำมัน '+pvN('fuel_rate_wage',25)+' บ./ล.<ul>'
    +'<li><b>แปลงเป็นลิตรน้ำมัน</b> — '+pvN('hooklift_fee',100)+' ÷ '+pvN('fuel_rate_wage',25)+' = <b>'+(pvN('hooklift_fee',100)/(pvN('fuel_rate_wage',25)||1)).toFixed(1)+' ลิตร</b> บวกเข้าลิตรตามเกณฑ์ (คนขับได้เป็นส่วนเพิ่ม/หักน้ำมัน)</li>'
    +'<li><b>จ่ายเป็นบาท</b> — บวก '+pvN('hooklift_fee',100)+' บ. ตรงเข้าค่าแรง</li></ul>'
};
function pvN(k,d){const i=document.querySelector('[data-p="'+k+'"]');const v=i?parseFloat(i.value):NaN;return !isNaN(v)?v:(DATA&&DATA.params[k]?+DATA.params[k].value:d);}
function zoneOf(t){return ((DATA&&DATA.fuelZones)||[]).filter(z=>z.vehicle_type===t).sort((a,b)=>a.seq-b.seq);}
function fwOf(t){return ((DATA&&DATA.fuelWeight)||[]).find(f=>f.model===t)||{};}
// ประเภทรถ (แทนรุ่น 360/240) → คอลัมน์ กม./ล. ในตารางช่วงระยะ rate_speed_tier (model R5)
const VTYPES=[['พ่วง','kmpl_trailer'],['เดี่ยว','kmpl_single'],['6ล้อ','kmpl_6wheel'],['4ล้อ','kmpl_4wheel']];
const TIER_MODEL='R5';
// drag-drop: ก้อนไหนอยู่ในฐานถ่วง 70/30
const WBITEMS=[['load','ค่าขึ้น-ลง'],['tarp','ค่าผ้าใบ'],['fuel','±น้ำมัน'],['hooklift','ค่ายกกระบะ'],['overnight','ค่าค้างคืน']];
let WB={load:0,tarp:0,fuel:0,hooklift:0,overnight:0}, DRAGKEY=null;

    <div class="wbzone" data-zone="0"><div class="wbh" style="color:var(--txt2)">⚪ บวกตรงๆ (ไม่ถ่วง)</div>${chips(false)}</div>

async function load(){
  if(!DATA)$('body').innerHTML='<div class="msg">กำลังโหลดตั้งค่า…</div>';
  let d;
  try{ d=await gasTry(GAS_URL+'?action=getWageSettings&userId='+encodeURIComponent(MY_UID),null,3); }
  catch(e){
    // GAS ตอบหน้า error HTML/ไม่ตอบ ครบ 3 รอบ → บอกให้ชัด + ปุ่มลองใหม่ (เดิมค้าง "กำลังเข้าสู่ระบบ…" เงียบ)
    if(!DATA)$('body').innerHTML='<div class="msg" style="color:var(--danger)">โหลดตั้งค่าไม่สำเร็จ ('+String(e&&e.message||e)+')<br><button class="tbtn primary" style="margin-top:12px" onclick="load()">↻ ลองใหม่</button></div>';
    else toast('❌ โหลดตั้งค่าใหม่ไม่สำเร็จ — ค่าบนจอยังเป็นชุดเดิม');
    return;
  }
  if(d.denied){$('body').innerHTML='<div class="msg" style="color:var(--danger)">ไม่มีสิทธิ์ (เฉพาะแอดมิน)</div>';return;}
  if(!d.ok){$('body').innerHTML='<div class="msg">'+(d.error||'ผิดพลาด')+'</div>';return;}
  DATA=d;
  TOG=Object.assign({weight_on:1,time_mode:0,speed_mode:0,dist_source:0,fuel_bench:0,fuel_adj_on:1,tarp_on:1,bonus_on:1,bonus_base:0}, d.toggles||{});
  // toggle R.5 ที่ getWageSettings ยังไม่ส่งใน toggles → อ่านจาก cost_params ตรง (ค่าเริ่มต้นเท่าที่ระบบคิดค่าแรงใช้)
  const TDEF={load_on:1,hooklift_on:1,hardship_on:1,give_on:1,wait_on:1,via_liters:1};
  Object.keys(TDEF).forEach(k=>{ TOG[k]=(d.params[k]&&d.params[k].value!=null)?Number(d.params[k].value):TDEF[k]; });
  WBITEMS.forEach(it=>WB[it[0]]=(d.toggles&&Number(d.toggles['wb_'+it[0]]))?1:0);
  try{ render(); }catch(e){ $('body').innerHTML='<div class="msg" style="color:var(--danger)">แสดงหน้าตั้งค่าไม่ได้: '+String(e&&e.message||e)+'</div>'; return; }
  $('saveBar').style.display='flex';
  if(!DPW.loaded)loadDp();
}

// สรุปเกณฑ์ที่ใช้ตอนนี้ (อ่านจาก TOG + params) — chip สี: เขียว=เปิด แดง=ปิด น้ำเงิน=โหมด เทา=ไม่คิด
function summaryHtml(){
  const T=TOG, pv=(k,dd)=>DATA.params[k]?DATA.params[k].value:dd, on=n=>Number(T[n])!==0;
  const chip=(val,tone)=>{const bg=tone==='off'?'var(--danger)':tone==='on'?'var(--primary)':tone==='none'?'#8a97a3':'#3b6fb0';
    return `<span style="font-size:12px;font-weight:600;color:#fff;background:${bg};padding:2px 10px;border-radius:999px;white-space:nowrap">${val}</span>`;};
  const row=(label,val,tone)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><span style="font-size:12.5px;color:var(--txt2)">${label}</span>${chip(val,tone)}</div>`;
  let r='';
  r+=row('ถ่วงหนัก/เบา', on('weight_on')?`เปิด · หนัก ${pv('heavy_pct',70)}% / เบา ${pv('light_pct',30)}%`:'ปิด · ทุกขาเต็ม 100%', on('weight_on')?'on':'off');
  r+=row('วิธีคิดเวลาวิ่ง', ({0:'ขั้นบันไดตามระยะ',1:'เหมาช่วงเดียว',2:'ไล่ระดับ (ตารางความเร็วไล่ระดับ)'})[Number(T.time_mode)]||'ขั้นบันไดตามระยะ', 'mode');
  r+=row('ระยะที่ใช้คิด', Number(T.dist_source)===1?'ค่ากลาง':'ระยะจริง (เลขไมล์)', 'mode');
  r+=row('เกณฑ์น้ำมัน', ({0:'ตามหนัก-เบา',1:'ตามช่วงระยะ',2:'ค่าเดียวต่อประเภทรถ',3:'ตามระยะหนักเบา (ตาราง⑬)',4:'หนักเบา-เรทช่วง (ตาราง⑬)',5:'หนักเบา-เกลี่ยในช่วง (ตาราง⑬)'})[Number(T.fuel_bench)]||'ตามหนัก-เบา', 'mode');
  r+=row('เพิ่ม/หักน้ำมัน', on('fuel_adj_on')?`เปิด · เลท ${pv('fuel_rate_wage',28)} บ./ล.`:'ปิด (ไม่คิดน้ำมัน)', on('fuel_adj_on')?'on':'off');
  r+=row('ค่าคลุมผ้าใบ', on('tarp_on')?`เปิด · ${pv('tarp_fee',100)} บ. (เฉพาะงานที่ติ๊ก)`:'ปิด', on('tarp_on')?'on':'off');
  r+=row('โบนัส', on('bonus_on')?`เปิด · ${pv('bonus_pct',10)}% · ฐาน${Number(T.bonus_base)===1?'ค่าวิ่ง+ขึ้นลง':'หลังน้ำมัน'}`:'ปิด', on('bonus_on')?'on':'off');
  const hf=pv('hooklift_fee',0), hs=pv('hardship_fee',0), gp=pv('give_per_hr',0), wr=pv('wait_rate_per_hr',0), via=on('via_liters');
  const jobsWith=f=>(DATA.jobTypes||[]).filter(j=>j[f]===true||j[f]==='t'||j[f]==='true').map(j=>j.job_type).join('/')||'ยังไม่ติ๊กงานไหน';
  r+=row('ค่าขึ้น-ลง', on('load_on')?`เปิด · ${pv('load_rate_per_hr',100)} บ./ชม. × นาทีตามประเภทงาน`:'ปิด', on('load_on')?'on':'off');
  r+=row('ค่าฮุคลิฟท์', !on('hooklift_on')?'ปิด':(hf>0?`${hf} บ./ครั้ง · ${jobsWith('hooklift')} · ${via?'แปลงเป็นลิตรน้ำมัน':'จ่ายเป็นบาท'}`:'ไม่คิด (0)'), !on('hooklift_on')?'off':(hf>0?'on':'none'));
  r+=row('Hardship ค่าความยาก', !on('hardship_on')?'ปิด':(hs>0?`${hs} บ./เที่ยว · ${jobsWith('hardship')}`:'ไม่คิด (0)'), !on('hardship_on')?'off':(hs>0?'on':'none'));
  r+=row('ให้เพิ่มตามเวลาวิ่ง', !on('give_on')?'ปิด':(gp>0?`${(+gp).toFixed(2)} บ./ชม.วิ่ง · ทุกงาน · ${via?'แปลงเป็นลิตรน้ำมัน':'จ่ายเป็นบาท'}`:'ไม่คิด (0)'), !on('give_on')?'off':(gp>0?'on':'none'));
  r+=row('ค่ารอลงของ', !on('wait_on')?'ปิด':(wr>0?`${wr} บ./ชม. × ชม.รอตาม DP Type`:'ไม่คิด (0)'), !on('wait_on')?'off':(wr>0?'on':'none'));
  return `<div class="card"><div class="ch">📋 สรุปเกณฑ์ที่ใช้คิดตอนนี้</div><div class="note">อัปเดตสดตามสวิตช์ด้านล่าง — คือเกณฑ์ที่<b>ระบบจ่ายจริง</b>ใช้คิดค่าแรงเที่ยวใหม่</div>${r}</div>`;
}

function render(){
  const d=DATA;
  let h='';

  // สูตรอธิบาย
  h+='<div class="card"><div class="ch">🧮 คิดค่าแรงยังไง</div><div class="formula">'
    +'ค่าวิ่งแต่ละขา = เลทค่าวิ่ง × ชม.วิ่งของขา × 2 × %หนัก/เบา  (ชม.วิ่งจากระยะ ÷ ความเร็วตามวิธีคิดเวลาวิ่ง)<br>'
    +'+ ค่าขึ้น-ลง + ค่าคลุมผ้าใบ + Hardship + ค่ารอลงของ (ตามประเภทงาน / DP Type)<br>'
    +'+ ค่าฮุคลิฟท์ + ให้เพิ่มตามเวลาวิ่ง (ถ้า "แปลงเป็นลิตรน้ำมัน" → ÷ เลทน้ำมัน ไปรวมในลิตรตามเกณฑ์)<br>'
    +'± น้ำมันคนขับ = (ลิตรตามเกณฑ์ − เติมจริง) × เลทน้ำมัน<br>'
    +'+ โบนัส % → <b>ค่าแรงสุทธิ</b> (ล็อก+snapshot ตอนจบงาน)'
    +'</div></div>';

  // 📋 สรุปเกณฑ์ที่ใช้ตอนนี้ (อัปเดตสดตามสวิตช์ด้านล่าง)
  h+=summaryHtml();

  // param กลาง
  h+='<div class="card"><div class="ch">💵 ค่าตั้งกลาง (cost_params)</div><div class="grid">';
  PORDER.forEach(k=>{ const val=d.params[k]?d.params[k].value:0; h+=`<label>${PLBL[k]||k}<input type="number" step="any" data-p="${k}" value="${val}"${k==='wait_rate_per_hr'?' oninput="renderDp()"':''}></label>`; });
  h+='</div></div>';

  // ⏱️ เวลารอลงของ ตาม DP Type — บันทึกแยกด้วยปุ่มในการ์ด (ไม่ผูกกับปุ่มบันทึกล่าง)
  h+='<div id="dpCard"></div>';

  // ⑥ สวิตช์วิธีคิด (toggle) — คุมทั้งสูตรจริง + เครื่องคิดเลข
  h+='<style>.seg{display:inline-flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line2);background:transparent;color:var(--txt2);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}.seg button.on.off{background:var(--danger);border-color:var(--danger)}</style>';
  h+='<div class="card"><div class="ch">🔀 สวิตช์วิธีคิด (มีผลกับเที่ยวที่คิดใหม่)</div>';
  h+='<div class="note">ค่าเหล่านี้คุมทั้ง<b>ระบบจ่ายจริง</b>และ<b>เครื่องคิดเลข</b> — เปลี่ยนที่นี่ที่เดียว</div>';
  TOGDEF.forEach(t=>{
    const [key,label,opts,desc]=t;
    const cur=TOG[key];
    h+=`<div style="margin-bottom:11px"><div style="font-size:12.5px;font-weight:600;margin-bottom:4px">${label}</div><div class="seg">`;
    opts.forEach(o=>{ const off=(o[1]==='ปิด'), na=(key==='speed_mode'&&o[0]===1&&Number(cur)!==1);   // GPS จริง: ยังไม่มีในระบบคิดค่าแรง
      h+=`<button type="button" ${na?'disabled title="ยังไม่รองรับ" style="opacity:.45;cursor:not-allowed"':`data-tog="${key}" data-val="${o[0]}"`} class="${Number(cur)===o[0]?'on':''} ${off?'off':''}">${o[1]}</button>`; });
    h+=`</div><div class="note" style="margin:3px 0 0">${desc}</div>`;
    if(HELP[key])h+=`<details class="help"><summary>ⓘ วิธีคิดแต่ละแบบ</summary><div>${HELP[key]()}</div></details>`;
    h+='</div>';
  });
  h+='</div>';

  // 🏋️ drag-drop ฐานถ่วง
  h+=wbCard();

  // ── ความเร็ว + เกณฑ์น้ำมัน ตามประเภทรถ (พ่วง/เดี่ยว/6ล้อ/4ล้อ) — เลิกรุ่น 360/240 (ระบบคิดค่าแรงไม่ได้ใช้แล้ว)
  const tm=Number(TOG.time_mode), fb=Number(TOG.fuel_bench);
  const nv=v=>(v==null?'':v);
  const delB=fn=>`<button type="button" onclick="${fn}" title="ลบ" style="border:0;background:transparent;color:var(--danger);font-size:15px;cursor:pointer;padding:2px 6px">✕</button>`;
  const addB=(fn,t)=>`<button type="button" onclick="${fn}" style="margin-top:6px;border:1px dashed var(--line2);background:transparent;color:var(--primary);font:inherit;font-size:12.5px;font-weight:600;border-radius:9px;padding:6px 14px;cursor:pointer">${t}</button>`;
  const useTag=on=>`<span class="tag" style="${on?'background:var(--primary);color:#fff':''}">${on?'ใช้อยู่':'ไม่ได้ใช้ตอนนี้'}</span>`;

  // ① ความเร็วไล่ระดับ (rate_speed_interp)
  const ip=(d.speedInterp||[]).slice().sort((a,b)=>a.seq-b.seq);
  h+=`<div class="card"><div class="ch">🏁 ความเร็วไล่ระดับ ${useTag(tm===2)}</div><div class="note">ใช้คิดชั่วโมงวิ่งเมื่อ "วิธีคิดเวลาวิ่ง = ไล่ระดับ" · ระยะรวมไป-กลับอยู่ระหว่างจุดไหน ความเร็วไล่ตามเส้นตรงระหว่างจุดนั้น · ต่ำกว่าจุดแรก / เกินจุดสุดท้าย = ใช้ความเร็วของจุดนั้นคงที่ · ใช้ร่วมทุกประเภทรถ</div>`;
  h+='<table><thead><tr><th>ระยะรวม (กม.)</th><th>ความเร็วเฉลี่ย (กม./ชม.)</th><th></th></tr></thead><tbody>';
  ip.forEach((p,i)=>{ h+=`<tr><td><input type="number" step="any" data-si="${i}|dist_km" value="${nv(p.dist_km)}"></td><td><input type="number" step="any" data-si="${i}|avg_speed" value="${nv(p.avg_speed)}"></td><td>${delB('delInterp('+i+')')}</td></tr>`; });
  h+='</tbody></table>'+addB('addInterp()','➕ เพิ่มจุด')+'</div>';

  // ② เกณฑ์น้ำมันตามประเภทรถ (rate_fuel_weight)
  const fwBy={}; (d.fuelWeight||[]).forEach(f=>fwBy[f.model]=f);
  const fbCols={0:['kmpl_heavy','kmpl_light'],2:['kmpl_single']}[fb]||[];
  const th=(k,t)=>`<th${fbCols.includes(k)?' style="color:var(--primary)"':''}>${t}${fbCols.includes(k)?' ✓':''}</th>`;
  h+=`<div class="card"><div class="ch">🚚 เกณฑ์น้ำมันตามประเภทรถ (กม./ล.)</div><div class="note">ใช้คิดลิตรตามเกณฑ์ · คอลัมน์ ✓ = ที่ใช้อยู่ตามสวิตช์ "เกณฑ์น้ำมัน" · "ตามระยะหนักเบา" / "หนักเบา-เรทช่วง" ใช้ตาราง⑬ ด้านล่าง · "ตามช่วงระยะ" ใช้ตารางช่วงระยะ · <b>0 = ยังไม่ได้ตั้ง</b> (รถประเภทนั้นคิดน้ำมันไม่ได้)</div>`;
  h+='<table><thead><tr><th>ประเภทรถ</th>'+th('kmpl_heavy','รถหนัก')+th('kmpl_light','รถเบา')+th('kmpl_single','ค่าเดียว')+'</tr></thead><tbody>';
  VTYPES.forEach(([t])=>{ const f=fwBy[t]||{}; h+=`<tr><td>${t}</td>`+['kmpl_heavy','kmpl_light','kmpl_single'].map(k=>`<td><input type="number" step="0.05" data-fw="${t}|${k}" value="${nv(f[k])}"${!(parseFloat(f[k])>0)?' style="border-color:var(--danger)"':''}></td>`).join('')+'</tr>'; });
  h+='</tbody></table></div>';

  // ②b R.11 ตาราง⑬ — เกณฑ์น้ำมันหนัก/เบา แยก 4 ช่วงระยะ (rate_fuel_zone · fuel_bench 3/4)
  const zAll=(d.fuelZones||[]), zUse=(fb===3||fb===4||fb===5);
  const zSeqs=[...new Set(zAll.map(z=>z.seq))].sort((a,b)=>a-b);
  // หัวคอลัมน์ = ขอบช่วง (ใช้ร่วมทุกประเภทรถ) · แก้ "ถึง กม." → ช่วงถัดไปเริ่มที่ +1 อัตโนมัติ (แบบ Excel 0-150 / 151-200) · ช่วงสุดท้าย = ขึ้นไป
  const zB=s=>zAll.find(x=>x.seq===s)||{};
  const zHead=(s,i)=>{const z=zB(s);return i<zSeqs.length-1
    ?`<th style="white-space:nowrap">ตั้งแต่ ${nv(z.from_km)}<br>ถึง <input type="number" step="1" min="1" data-zb="${s}" value="${nv(z.to_km)}" onchange="setZoneTo(${s},this.value)" aria-label="ช่วงที่ ${i+1} ถึง กม." style="width:70px"> กม.</th>`
    :`<th style="white-space:nowrap">${nv(z.from_km)} กม. ขึ้นไป<br><span style="font-weight:400" title="ใช้เฉพาะเกณฑ์น้ำมัน = หนักเบา-เกลี่ยในช่วง">เกลี่ยเต็มเรทที่ <input type="number" step="1" data-p="fuel_zone_blend_to" value="${nv(d.params.fuel_zone_blend_to?d.params.fuel_zone_blend_to.value:600)}" aria-label="ช่วงสุดท้าย เกลี่ยเต็มเรทที่ กม." style="width:70px"> กม.</span></th>`;};
  h+=`<div class="card"><div class="ch">📐 เกณฑ์น้ำมันหนัก/เบา แยกช่วงระยะ (ตาราง⑬) ${useTag(zUse)}</div><div class="note">ใช้เมื่อเกณฑ์น้ำมัน = <b>ตามระยะหนักเบา</b> · <b>หนักเบา-เรทช่วง</b> · <b>หนักเบา-เกลี่ยในช่วง</b> · ช่วงระยะนับจากระยะหนัก (หรือเบา) รวมของเที่ยว · ค่าเริ่มต้นตาม Excel R.11<br>แก้ขอบช่วงที่หัวตาราง ("ถึง กม.") — ใช้ร่วมทุกประเภทรถ ช่วงถัดไปเริ่มที่ +1 ให้เอง · ช่วงสุดท้ายไม่จำกัด<br>"เกลี่ยเต็มเรทที่ ... กม." ใช้เฉพาะแบบ <b>หนักเบา-เกลี่ยในช่วง</b> — ช่วงสุดท้ายไล่จากเรทช่วงก่อนจนเต็มเรทที่ระยะนี้ แล้วคงที่ (กันลิตรลดฮวบตอนข้ามเข้าช่วงสุดท้าย)</div>`;
  h+='<div style="overflow-x:auto"><table><thead><tr><th>ประเภทรถ</th><th></th>'+zSeqs.map(zHead).join('')+'</tr></thead><tbody>';
  VTYPES.forEach(([t])=>{
    [['kmpl_heavy','หนัก'],['kmpl_light','เบา']].forEach(([k,lbl],ri)=>{
      h+='<tr>'+(ri===0?`<td rowspan="2">${t}</td>`:'')+`<td>${lbl}</td>`
        +zSeqs.map(s=>{const z=zAll.find(x=>x.vehicle_type===t&&x.seq===s);return z?`<td><input type="number" step="0.01" data-fz="${t}|${s}|${k}" value="${nv(z[k])}"${!(parseFloat(z[k])>0)?' style="border-color:var(--danger)"':''}></td>`:'<td>—</td>';}).join('')+'</tr>';
    });
  });
  h+='</tbody></table></div></div>';

  // ③ ช่วงระยะ (rate_speed_tier model R5) — ความเร็ว (ขั้นบันได/เหมาช่วง) + กม./ล.ตามช่วง ต่อประเภทรถ
  const tiers=(d.speedTier||[]).filter(t=>t.model===TIER_MODEL).sort((a,b)=>a.seq-b.seq);
  h+=`<div class="card"><div class="ch">📏 ตารางช่วงระยะ</div><div class="note">ความเร็ว ${tm===2?'<b>ไม่ได้ใช้ตอนนี้</b> (ใช้ความเร็วไล่ระดับ)':'<b>ใช้อยู่</b>'} · กม./ล. ตามช่วง ${fb===1?'<b>ใช้อยู่</b>':'<b>ไม่ได้ใช้ตอนนี้</b>'} (ใช้เมื่อเกณฑ์น้ำมัน = ตามช่วงระยะ) · ช่วงสุดท้ายเว้นว่าง = ไม่จำกัด</div>`;
  h+='<div style="overflow-x:auto"><table><thead><tr><th>ช่วงถึง (กม.)</th><th>ความเร็ว</th>'+VTYPES.map(([t])=>`<th>กม./ล. ${t}</th>`).join('')+'<th></th></tr></thead><tbody>';
  tiers.forEach(t=>{
    const mx=(t.max_km!=null&&+t.max_km>=999999)?'':nv(t.max_km);
    h+=`<tr><td><input type="number" data-st="${TIER_MODEL}|${t.seq}|max_km" value="${mx}" placeholder="∞"></td><td><input type="number" data-st="${TIER_MODEL}|${t.seq}|speed_kmph" value="${nv(t.speed_kmph)}"></td>`
      +VTYPES.map(([,col])=>`<td><input type="number" step="0.05" data-st="${TIER_MODEL}|${t.seq}|${col}" value="${nv(t[col])}"></td>`).join('')
      +`<td>${delB(`delTier('${TIER_MODEL}',${t.seq})`)}</td></tr>`;
  });
  h+='</tbody></table></div>'+addB(`addTier('${TIER_MODEL}')`,'➕ เพิ่มช่วง')+'</div>';

  // เวลาขึ้น-ลง + รายการบวกต่อประเภทงาน (ผ้าใบ/ฮุคลิฟท์/ค้างคืน)
  const jbool=v=>(v===true||v==='t'||v==='true');
  h+='<div class="card"><div class="ch">⏱️ เวลาขึ้น-ลง + รายการบวก ต่อประเภทงาน</div><div class="note">ขึ้น/ลง = นาที · ติ๊ก = งานนี้คิดรายการนั้นไหม (ต้องเปิดสวิตช์และตั้งจำนวนเงินด้านบนด้วย) · ค่าฮุคลิฟท์ = '+(d.params.hooklift_fee?d.params.hooklift_fee.value:0)+' บ./ครั้ง · Hardship = '+(d.params.hardship_fee?d.params.hardship_fee.value:0)+' บ./เที่ยว</div><table><thead><tr><th>งาน</th><th>ขึ้น</th><th>ลง</th><th>ผ้าใบ</th><th>ฮุคลิฟท์</th><th>Hardship</th></tr></thead><tbody>';
  d.jobTypes.forEach(j=>{ h+=`<tr><td>${j.job_type}</td><td><input type="number" data-jt="${j.job_type}|up_min" value="${j.up_min}"></td><td><input type="number" data-jt="${j.job_type}|down_min" value="${j.down_min}"></td><td><input type="checkbox" data-jtt="${j.job_type}" ${jbool(j.tarp)?'checked':''} style="width:20px;height:20px"></td><td><input type="checkbox" data-jth="${j.job_type}" ${jbool(j.hooklift)?'checked':''} style="width:20px;height:20px"></td><td><input type="checkbox" data-jhs="${j.job_type}" ${jbool(j.hardship)?'checked':''} style="width:20px;height:20px"></td></tr>`; });
  h+='</tbody></table></div>';

  // ราคาน้ำมันกลางวันนี้
  const today=new Date().toISOString().slice(0,10);
  const todayRow=(d.fuelDaily||[]).find(f=>String(f.price_date).slice(0,10)===today);
  h+=`<div class="card"><div class="ch">⛽ ราคาน้ำมันกลางรายวัน</div><div class="note">เจ้าหน้าที่ปั๊มแจ้ง → กรอกที่นี่ · ใช้คิดค่าน้ำมันเติมโรงงาน (เติมนอกใช้ใบเสร็จ)</div>`;
  h+=`<div class="grid"><label>วันที่<input type="date" id="fpDate" value="${today}"></label><label>ราคา (บ./ล.)<input type="number" step="0.25" id="fpPrice" value="${todayRow?todayRow.price_per_liter:''}" placeholder="เช่น 32.00"></label></div>`;
  if(d.fuelDaily&&d.fuelDaily.length){ h+='<div class="note" style="margin-top:8px">ล่าสุด: '+d.fuelDaily.slice(0,5).map(f=>String(f.price_date).slice(5,10)+'='+f.price_per_liter).join(' · ')+'</div>'; }
  h+='</div>';

  $('body').innerHTML=h;
  renderDp();
}

// ═══════ ⏱️ เวลารอลงของ ตาม DP Type (= ตาราง K-L ใน DATABASE.xlsx) ═══════
// ค่ารอ = ชม.รอ × เรท "ค่ารอลงของ" · สถานีผูก DP Type ที่หน้า 📍 ค่ากลาง · state เก็บใน DPW (render() สร้างการ์ดใหม่ได้ไม่หาย)
let DPW={rows:[],del:[],waitRate:0,loaded:false,err:null,busy:false};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function gasTry(url,opt,tries){   // GAS บางครั้งส่งหน้า error HTML แทน JSON → อ่านซ้ำได้ (เฉพาะการอ่าน)
  let last;
  for(let n=1;n<=tries;n++){
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),70000);
      const r=await fetch(url,Object.assign({signal:c.signal},opt||{})),txt=await r.text();clearTimeout(t);
      try{return JSON.parse(txt);}catch(e){last=new Error('หลังบ้านตอบผิดรูปแบบ');}
    }catch(e){last=e&&e.name==='AbortError'?new Error('หลังบ้านไม่ตอบภายใน 70 วินาที'):e;}
    if(n<tries)await new Promise(r=>setTimeout(r,1500*n));
  }
  throw last;
}
async function loadDp(){
  DPW.err=null; renderDp();
  try{
    const d=await gasTry(GAS_URL+'?action=getDpWaitTimes&userId='+encodeURIComponent(MY_UID),null,3);
    if(!d.ok)throw new Error(d.denied?'ไม่มีสิทธิ์':(d.error||'โหลดไม่ได้'));
    DPW.rows=d.rows.map(r=>({id:r.id,dp_type:r.dp_type,wait_hours:r.wait_hours,note:r.note||'',active:r.active!==false,stations:r.stations||0}));
    DPW.del=[]; DPW.waitRate=d.waitRate; DPW.loaded=true;
  }catch(e){DPW.err=(e&&e.message)||String(e);}
  renderDp();
}
function dpRate(){const i=document.querySelector('[data-p="wait_rate_per_hr"]');const v=i?parseFloat(i.value):NaN;return isNaN(v)?DPW.waitRate:v;}
function renderDp(){
  const box=$('dpCard'); if(!box)return;
  let h='<div class="card"><div class="ch">⏱️ เวลารอลงของ ตาม DP Type</div>'
    +'<div class="note">ค่ารอ = <b>ชม.รอ × เรทค่ารอลงของ</b> ('+dpRate()+' บ./ชม. จากค่าตั้งกลางด้านบน) · เลือก DP Type ให้แต่ละสถานีที่หน้า <b>📍 ค่ากลาง</b> · สถานีที่ไม่มี DP Type = ไม่คิดค่ารอ<br>'
    +'"จำนวนสถานีที่เลือกใช้" = สถานีในหน้า 📍 ค่ากลาง ที่เลือก DP Type นั้น (ยังไม่มี = ยังไม่มีออเดอร์ไหนคิดค่ารอด้วย DP นี้)<br>'
    +'ตารางนี้บันทึกแยกด้วยปุ่มในการ์ด · เปลี่ยนชื่อ DP Type แล้วสถานีที่ผูกไว้เปลี่ยนตาม</div>';
  if(DPW.err)h+='<div class="msg" style="padding:12px">โหลดไม่ได้ — '+esc(DPW.err)+' <button type="button" class="tbtn" onclick="loadDp()">↻ ลองใหม่</button></div>';
  else if(!DPW.loaded)h+='<div class="msg" style="padding:12px">กำลังโหลดเวลารอ…</div>';
  else{
    const rate=dpRate();
    h+='<table><thead><tr><th>DP Type</th><th>ชม.รอ</th><th>ค่ารอ (บ.)</th><th title="จำนวนสถานีในหน้า 📍 ค่ากลาง ที่เลือก DP Type นี้">จำนวนสถานีที่เลือกใช้</th><th></th></tr></thead><tbody>';
    DPW.rows.forEach((r,i)=>{
      h+='<tr><td><input style="width:100%;text-align:left" value="'+esc(r.dp_type)+'" placeholder="เช่น แม็คโคร" oninput="DPW.rows['+i+'].dp_type=this.value"></td>'
        +'<td><input type="number" step="0.25" min="0" value="'+r.wait_hours+'" oninput="DPW.rows['+i+'].wait_hours=this.value;this.closest(\'tr\').children[2].textContent=((parseFloat(this.value)||0)*'+rate+').toLocaleString(\'th-TH\')"></td>'
        +'<td>'+((parseFloat(r.wait_hours)||0)*rate).toLocaleString('th-TH')+'</td>'
        +'<td>'+(r.id?(r.stations?r.stations+' แห่ง':'<span style="color:var(--txt2)">ยังไม่มี</span>'):'<span class="tag">ใหม่</span>')+'</td>'
        +'<td>'+(r.confirmDel
          ?'<button type="button" onclick="dpDel('+i+',true)" style="border:0;background:var(--danger);color:#fff;border-radius:7px;font:inherit;font-size:11.5px;padding:4px 8px;cursor:pointer">ยืนยันลบ</button>'
          :'<button type="button" onclick="dpDel('+i+')" title="ลบ" style="border:0;background:transparent;color:var(--danger);font-size:15px;cursor:pointer;padding:2px 6px">✕</button>')+'</td></tr>';
      if(r.confirmDel&&r.stations)h+='<tr><td colspan="5" style="text-align:left;color:var(--danger);font-size:11.5px">ลบแล้ว '+r.stations+' สถานีที่ใช้ "'+esc(r.dp_type)+'" จะไม่คิดค่ารอ</td></tr>';
    });
    if(!DPW.rows.length)h+='<tr><td colspan="5" style="text-align:center;color:var(--txt2)">ยังไม่มี DP Type</td></tr>';
    h+='</tbody></table>';
    if(DPW.del.length)h+='<div class="note" style="margin:8px 0 0;color:var(--danger)">รอลบตอนกดบันทึก: '+DPW.del.map(x=>esc(x.dp_type)).join(', ')+'</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      +'<button type="button" onclick="dpAdd()" style="border:1px dashed var(--line2);background:transparent;color:var(--primary);font:inherit;font-size:12.5px;font-weight:600;border-radius:9px;padding:6px 14px;cursor:pointer">➕ เพิ่ม DP Type</button>'
      +'<button type="button" class="tbtn primary" id="dpSave" onclick="saveDp()"'+(DPW.busy?' disabled':'')+'>'+(DPW.busy?'กำลังบันทึก…':'💾 บันทึกเวลารอ')+'</button>'
      +'<button type="button" class="tbtn" onclick="loadDp()">↺ ยกเลิกที่แก้</button></div>';
  }
  box.innerHTML=h+'</div>';
}
function dpAdd(){DPW.rows.push({dp_type:'',wait_hours:0,note:'',active:true,stations:0});renderDp();const ins=document.querySelectorAll('#dpCard tbody tr td:first-child input');if(ins.length)ins[ins.length-1].focus();}
function dpDel(i,sure){
  const r=DPW.rows[i];
  if(r.id&&!sure){DPW.rows.forEach(x=>x.confirmDel=false);r.confirmDel=true;renderDp();return;}
  if(r.id)DPW.del.push({id:r.id,dp_type:r.dp_type});
  DPW.rows.splice(i,1);renderDp();
}
async function saveDp(){
  const rows=DPW.rows.map(r=>({id:r.id||undefined,dp_type:String(r.dp_type||'').trim(),wait_hours:r.wait_hours,note:r.note,active:r.active}));
  const bad=rows.find(r=>!r.dp_type||isNaN(parseFloat(r.wait_hours))||parseFloat(r.wait_hours)<0);
  if(bad){toast('⚠️ กรอกชื่อ DP Type และชม.รอ (0 ขึ้นไป) ให้ครบทุกแถว');return;}
  DPW.busy=true;renderDp();
  let d;
  try{d=await gasTry(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveDpWaitTimes',userId:MY_UID,rows,deleteIds:DPW.del.map(x=>x.id)})},1);}
  catch(e){d={ok:false,unsure:true};}
  DPW.busy=false;
  if(d.ok){toast('✅ บันทึกเวลารอแล้ว');await loadDp();}
  else if(d.unsure){toast('⚠️ หลังบ้านตอบไม่ชัด อาจบันทึกแล้ว — โหลดข้อมูลล่าสุดให้ตรวจ');await loadDp();}
  else{toast('❌ '+(d.denied?'ไม่มีสิทธิ์':(d.error||'บันทึกไม่ได้')));renderDp();}
}

// รวบรวมค่าตั้งค่าปัจจุบันจากฟอร์ม → config 1 ชุด (ใช้ทั้ง save() และ template)
function gatherConfig(){
  const params={}; document.querySelectorAll('[data-p]').forEach(i=>params[i.dataset.p]=parseFloat(i.value)||0);
  Object.keys(TOG).forEach(k=>params[k]=Number(TOG[k]));   // toggle → cost_params (เข้ารหัสเลข)
  WBITEMS.forEach(it=>params['wb_'+it[0]]=WB[it[0]]?1:0);  // drag-drop ฐานถ่วง → cost_params
  const stMap={};
  document.querySelectorAll('[data-st]').forEach(i=>{const[m,seq,f]=i.dataset.st.split('|');const k=m+'|'+seq;stMap[k]=stMap[k]||{model:m,seq:+seq};stMap[k][f]=(i.value===''?null:parseFloat(i.value));});
  // re-sequence ต่อรุ่น (เรียงตาม max_km · ∞/ว่าง ท้ายสุด) — รองรับ เพิ่ม/ลบ ช่วง
  const byM={}; Object.values(stMap).forEach(t=>{(byM[t.model]=byM[t.model]||[]).push(t);});
  const speedTier=[];
  Object.keys(byM).forEach(m=>{byM[m].sort((a,b)=>((a.max_km==null?Infinity:a.max_km)-(b.max_km==null?Infinity:b.max_km)));byM[m].forEach((t,i,arr)=>{t.seq=i+1;t.from_km=i?(arr[i-1].max_km||0):0;speedTier.push(t);});});
  // ความเร็วไล่ระดับ (ส่งทั้งตาราง · แถวว่างทั้งแถวข้าม)
  const siMap={}; document.querySelectorAll('[data-si]').forEach(i=>{const[ix,f]=i.dataset.si.split('|');siMap[ix]=siMap[ix]||{};siMap[ix][f]=(i.value===''?null:parseFloat(i.value));});
  const speedInterp=Object.keys(siMap).sort((a,b)=>a-b).map(k=>siMap[k]).filter(p=>p.dist_km!=null||p.avg_speed!=null).map(p=>({dist_km:p.dist_km,avg_speed:p.avg_speed,note:''}));
  const fwMap={}; document.querySelectorAll('[data-fw]').forEach(i=>{const[m,f]=i.dataset.fw.split('|');fwMap[m]=fwMap[m]||{model:m};fwMap[m][f]=parseFloat(i.value)||0;});
  const fuelWeight=Object.values(fwMap);
  const jtMap={}; document.querySelectorAll('[data-jt]').forEach(i=>{const[j,f]=i.dataset.jt.split('|');jtMap[j]=jtMap[j]||{job_type:j};jtMap[j][f]=parseInt(i.value)||0;});
  document.querySelectorAll('[data-jtt]').forEach(i=>{const j=i.dataset.jtt;jtMap[j]=jtMap[j]||{job_type:j};jtMap[j].tarp=i.checked;});
  document.querySelectorAll('[data-jth]').forEach(i=>{const j=i.dataset.jth;jtMap[j]=jtMap[j]||{job_type:j};jtMap[j].hooklift=i.checked;});
  document.querySelectorAll('[data-jhs]').forEach(i=>{const j=i.dataset.jhs;jtMap[j]=jtMap[j]||{job_type:j};jtMap[j].hardship=i.checked;});   // overnight (ค้างคืน) เลิกใช้ ไม่ส่ง = คงค่าเดิมในฐาน
  const jobTypes=Object.values(jtMap);
  // ตาราง⑬ — ส่งทุกแถว (ขอบช่วงเดิม + กม./ล. จากฟอร์ม)
  const fzIn={}; document.querySelectorAll('[data-fz]').forEach(i=>{fzIn[i.dataset.fz]=i.value;});
  const fuelZones=(DATA.fuelZones||[]).map(z=>{const g=k=>{const v=fzIn[z.vehicle_type+'|'+z.seq+'|'+k];return v===undefined?z[k]:(v===''?0:parseFloat(v));};
    return {vehicle_type:z.vehicle_type,seq:z.seq,from_km:z.from_km,to_km:z.to_km,kmpl_heavy:g('kmpl_heavy'),kmpl_light:g('kmpl_light')};});
  return {params,speedTier,speedInterp,fuelWeight,fuelZones,jobTypes};
}
async function save(){
  const cfg=gatherConfig();
  const fuelDaily=$('fpPrice').value?{date:$('fpDate').value,price:parseFloat($('fpPrice').value)}:null;
  const payload=Object.assign({action:'saveWageSettings',userId:MY_UID,fuelDaily},cfg);
  $('saveBtn').textContent='กำลังบันทึก…';$('saveBtn').disabled=true;
  try{
    const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.ok){toast('✅ บันทึกเข้าฐานแล้ว');}
    else if(d.denied)toast('❌ ไม่มีสิทธิ์ (เฉพาะแอดมิน)');
    else toast('❌ '+(d.error||'บันทึกไม่สำเร็จ'));
  }catch(e){toast('❌ '+e);}
  $('saveBtn').textContent='💾 บันทึกเข้าฐาน';$('saveBtn').disabled=false;
  loadTemplates();   // เผื่อ save ทับ config ที่ผูกกับชุด
}

// ═══════ 🧮 ชุดคำนวณค่าแรง (template) — เปิดใช้ทีละ 1 ชุด สลับได้ ═══════
let TEMPLATES=[], ACTIVE_ID='';
const escT=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadTemplates(){
  try{const d=await gasTry(GAS_URL+'?action=getWageTemplates&userId='+encodeURIComponent(MY_UID),null,3);
    if(d&&d.ok){TEMPLATES=d.templates||[];ACTIVE_ID=d.activeId||'';}}catch(e){}
  renderTemplates();
}
function renderTemplates(){
  const bar=$('tplbar'); if(!bar)return;
  if(!TEMPLATES.length){
    bar.innerHTML=`<div class="tplwrap"><div class="tplhead">🧮 ชุดคำนวณค่าแรง</div>
      <div class="tplnote">ยังไม่มีชุด — ตั้งค่าด้านล่างให้เรียบร้อย แล้วกด <b>➕ บันทึกเป็นชุดใหม่</b> เพื่อเก็บเป็นชุดที่ 1<br>
      ต่อไปสร้างได้หลายชุด (ปกติ / หน้าฝน / ลูกค้า A) แล้วสลับ "เปิดใช้" ได้ — ระบบคิดค่าแรงเที่ยวใหม่ตามชุดที่เปิดใช้</div>
      <div style="margin-top:10px"><button class="tbtn primary" onclick="saveAsTpl()">➕ บันทึกเป็นชุดใหม่ (จากค่าปัจจุบัน)</button></div></div>`;
    return;
  }
  const active=TEMPLATES.find(t=>t.id===ACTIVE_ID)||TEMPLATES[0];
  const chips=TEMPLATES.map(t=>{const on=t.id===ACTIVE_ID;
    return `<span class="tchip ${on?'on':''}">
      <button class="tchipname" onclick="activateTpl('${t.id}')" ${on?'disabled':''}>${on?'✓ ':''}${escT(t.name)}</button>
      ${on?'<span class="tchipbadge">ใช้อยู่</span>':`<button class="tchipx" title="ลบชุดนี้" onclick="deleteTpl('${t.id}')">✕</button>`}
    </span>`;}).join('');
  bar.innerHTML=`<div class="tplwrap">
    <div class="tplhead">🧮 ชุดคำนวณค่าแรง <span class="tplsub">คิดค่าแรงเที่ยวใหม่ตามชุดที่เปิดใช้</span></div>
    <div class="tchips">${chips}</div>
    <div class="tacts">
      <button class="tbtn" onclick="saveAsTpl()">➕ เพิ่มชุดใหม่</button>
      <button class="tbtn primary" onclick="overwriteTpl()">💾 บันทึกลงชุด “${escT(active.name)}”</button>
      <button class="tbtn" onclick="renameTpl('${active.id}')">✏️ เปลี่ยนชื่อ</button>
    </div>
    <div class="tplnote" style="margin-top:9px">แก้ตั้งค่าด้านล่าง → กด <b>💾 บันทึกลงชุด</b> เพื่อเก็บเข้าชุดที่ใช้อยู่ · กดชิปชุดอื่นเพื่อสลับ</div>
  </div>`;
}
async function activateTpl(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  if(!confirm('เปิดใช้ชุด "'+t.name+'"?\n\nระบบจะคิดค่าแรง "เที่ยวที่คิดใหม่" ตามชุดนี้\n(เที่ยวที่จ่าย/ล็อกแล้วไม่เปลี่ยน)'))return;
  toast('กำลังเปิดใช้…');
  try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'activateWageTemplate',userId:MY_UID,id})});const d=await r.json();
    if(d&&d.ok){ACTIVE_ID=id;toast('✅ เปิดใช้ชุด "'+t.name+'" แล้ว');await load();await loadTemplates();}
    else toast('❌ '+((d&&d.error)||'เปิดใช้ไม่สำเร็จ'));
  }catch(e){toast('❌ '+e);}
}
async function saveAsTpl(){
  const name=prompt('ตั้งชื่อชุดใหม่ (เช่น สูตรปกติ / หน้าฝน / ลูกค้า A):','ชุดที่ '+(TEMPLATES.length+1));
  if(name===null)return;
  toast('กำลังบันทึก…');
  try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveWageTemplate',userId:MY_UID,name,config:gatherConfig()})});const d=await r.json();
    if(d&&d.ok){toast('✅ บันทึกชุดใหม่แล้ว');await loadTemplates();}
    else toast('❌ '+((d&&d.error)||'บันทึกไม่สำเร็จ'));
  }catch(e){toast('❌ '+e);}
}
async function overwriteTpl(){
  const t=TEMPLATES.find(x=>x.id===ACTIVE_ID); if(!t)return saveAsTpl();
  if(!confirm('บันทึกค่าปัจจุบันลงชุด "'+t.name+'"?\n(ชุดนี้กำลังใช้อยู่ → ค่าแรงเที่ยวใหม่จะใช้ค่านี้ทันที)'))return;
  toast('กำลังบันทึก…');
  try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveWageTemplate',userId:MY_UID,id:t.id,name:t.name,config:gatherConfig()})});const d=await r.json();
    if(d&&d.ok){toast('✅ บันทึกลงชุด "'+t.name+'" แล้ว');await loadTemplates();}
    else toast('❌ '+((d&&d.error)||'บันทึกไม่สำเร็จ'));
  }catch(e){toast('❌ '+e);}
}
async function renameTpl(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  const name=prompt('เปลี่ยนชื่อชุด:',t.name); if(name===null||!name.trim())return;
  try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveWageTemplate',userId:MY_UID,id:t.id,name:name.trim(),config:t.config||gatherConfig()})});const d=await r.json();
    if(d&&d.ok){toast('✅ เปลี่ยนชื่อแล้ว');await loadTemplates();}else toast('❌ '+((d&&d.error)||''));
  }catch(e){toast('❌ '+e);}
}
async function deleteTpl(id){
  const t=TEMPLATES.find(x=>x.id===id); if(!t)return;
  if(!confirm('ลบชุด "'+t.name+'"? ลบแล้วกู้คืนไม่ได้'))return;
  try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'deleteWageTemplate',userId:MY_UID,id})});const d=await r.json();
    if(d&&d.ok){toast('ลบแล้ว');await loadTemplates();}else toast('❌ '+((d&&d.error)||''));
  }catch(e){toast('❌ '+e);}
}
// เพิ่ม/ลบ ช่วงความเร็ว (sync ค่าปัจจุบันเข้า DATA ก่อน render ใหม่ กันค่าที่แก้หาย)
function syncTiers(){document.querySelectorAll('[data-st]').forEach(i=>{const[m,seq,f]=i.dataset.st.split('|');const t=DATA.speedTier.find(x=>x.model===m&&String(x.seq)===seq);if(t)t[f]=(i.value===''?null:parseFloat(i.value));});}
// เก็บค่าที่กำลังแก้ในฟอร์มกลับเข้า DATA ก่อนวาดหน้าใหม่ (เพิ่ม/ลบแถว) — กันตัวเลขที่ยังไม่บันทึกหาย
function syncInterp(){const a=(DATA.speedInterp||[]).slice().sort((x,y)=>x.seq-y.seq);document.querySelectorAll('[data-si]').forEach(i=>{const[ix,f]=i.dataset.si.split('|');if(a[+ix])a[+ix][f]=(i.value===''?null:parseFloat(i.value));});DATA.speedInterp=a;}
function syncAll(){
  syncTiers(); syncInterp();
  document.querySelectorAll('[data-p]').forEach(i=>{const k=i.dataset.p;DATA.params[k]=Object.assign({},DATA.params[k]||{},{value:parseFloat(i.value)||0});});
  document.querySelectorAll('[data-fw]').forEach(i=>{const[m,f]=i.dataset.fw.split('|');let r=DATA.fuelWeight.find(x=>x.model===m);if(!r){r={model:m};DATA.fuelWeight.push(r);}r[f]=parseFloat(i.value)||0;});
  document.querySelectorAll('[data-fz]').forEach(i=>{const[t,s,f]=i.dataset.fz.split('|');const r=(DATA.fuelZones||[]).find(x=>x.vehicle_type===t&&String(x.seq)===s);if(r)r[f]=parseFloat(i.value)||0;});
  document.querySelectorAll('[data-jt]').forEach(i=>{const[j,f]=i.dataset.jt.split('|');const r=DATA.jobTypes.find(x=>x.job_type===j);if(r)r[f]=parseInt(i.value)||0;});
  [['data-jtt','tarp'],['data-jth','hooklift'],['data-jhs','hardship']].forEach(([a,f])=>document.querySelectorAll('['+a+']').forEach(i=>{const r=DATA.jobTypes.find(x=>x.job_type===i.getAttribute(a));if(r)r[f]=i.checked;}));
}
function addTier(m){syncAll();const sq=DATA.speedTier.filter(t=>t.model===m).map(t=>+t.seq);DATA.speedTier.push({model:m,seq:(sq.length?Math.max(...sq):0)+1,max_km:null,speed_kmph:null,kmpl_trailer:null,kmpl_single:null,kmpl_6wheel:null,kmpl_4wheel:null});render();}
function delTier(m,seq){syncAll();DATA.speedTier=DATA.speedTier.filter(t=>!(t.model===m&&String(t.seq)===String(seq)));render();}
// แก้ขอบช่วงตาราง⑬: ช่วง seq สิ้นสุดที่ val → ช่วงถัดไปเริ่ม val+1 · ใช้กับทุกประเภทรถ
function setZoneTo(seq,val){
  syncAll();
  const Z=DATA.fuelZones||[], seqs=[...new Set(Z.map(z=>z.seq))].sort((a,b)=>a-b), i=seqs.indexOf(seq);
  const b=s=>Z.find(x=>x.seq===s)||{}, v=parseFloat(val);
  const from=+b(seq).from_km, nextTo=i<seqs.length-1?+b(seqs[i+1]).to_km:Infinity;
  if(!(v>from)||!(v+1<nextTo)){
    toast('⚠️ ช่วงที่ '+(i+1)+' ต้องมากกว่า '+from+' และน้อยกว่า '+(nextTo===Infinity?'∞':(nextTo-1))+' กม.');
    render(); return;
  }
  Z.forEach(z=>{ if(z.seq===seq)z.to_km=v; if(z.seq===seqs[i+1])z.from_km=v+1; });
  render();
}
function addInterp(){syncAll();const a=DATA.speedInterp||[];a.push({seq:a.length+1,dist_km:null,avg_speed:null,note:''});DATA.speedInterp=a;render();}
function delInterp(ix){syncAll();DATA.speedInterp.splice(ix,1);DATA.speedInterp.forEach((p,i)=>p.seq=i+1);render();}

$('saveBtn').onclick=save;
// สลับ toggle (delegated — #body คงอยู่ถึง innerHTML เปลี่ยน)
$('body').addEventListener('click',e=>{const b=e.target.closest('[data-tog]');if(!b)return;syncAll();TOG[b.dataset.tog]=Number(b.dataset.val);render();});
// drag-drop ฐานถ่วง + แตะสลับฝั่ง (มือถือ)
$('body').addEventListener('dragstart',e=>{const c=e.target.closest('[data-wb]');if(c){DRAGKEY=c.dataset.wb;if(e.dataTransfer)e.dataTransfer.effectAllowed='move';}});
$('body').addEventListener('dragover',e=>{const z=e.target.closest('.wbzone');if(z){e.preventDefault();z.classList.add('hl');}});
$('body').addEventListener('dragleave',e=>{const z=e.target.closest('.wbzone');if(z)z.classList.remove('hl');});
$('body').addEventListener('drop',e=>{const z=e.target.closest('.wbzone');if(z&&DRAGKEY){e.preventDefault();WB[DRAGKEY]=+z.dataset.zone;DRAGKEY=null;render();}});
$('body').addEventListener('click',e=>{const c=e.target.closest('[data-wb]');if(c){WB[c.dataset.wb]=WB[c.dataset.wb]?0:1;render();}});

(async function(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}

})();
