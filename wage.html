<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค่าแรง/ต้นทุน คนขับ · SSB</title>
<link rel="icon" type="image/svg+xml" href="favicon-wage.svg?v=1">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="ssb-read.js?v=20261016w"></script>
<script src="ssb-pin-gate.js?v=20261014b"></script>
<style>
  :root{--bg:#eef1f4;--card:#fff;--card2:#f6f8fa;--line:#e2e6ea;--line2:#cfd5db;--txt:#1a2530;--txt2:#6b7785;--primary:#1f8a52;--danger:#c8352f;--radius:8px}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#182028;--card2:#1f2830;--line:#2a343d;--line2:#3a4650;--txt:#e6ebf0;--txt2:#8a97a3;--primary:#2ea567;--danger:#e5645d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;line-height:1.5;padding:16px 12px 60px}
  .wrap{max-width:1240px;margin:0 auto}
  .maincols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  #tbl{overflow-x:auto}   /* ตารางกว้างเลื่อนในกรอบ หน้าไม่ล้นจอ (popup กลางจอมือถือจึงไม่หลุดขอบ) */
  @media(min-width:1000px){.maincols{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
  .sumwrap{position:sticky;top:16px}
  .sumhead{font-size:14px;font-weight:800;color:var(--primary);margin-bottom:10px}
  .sumsearch{margin-bottom:10px}
  .sumsearch input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:13px;background:var(--card);color:var(--txt)}
  .sumfilter{font-size:12px;font-weight:700;color:var(--primary);background:var(--card);border:1px dashed var(--primary);border-radius:9px;padding:6px 11px;margin-bottom:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,60,.05);cursor:pointer;transition:.12s}
  .sumcard:hover{border-color:var(--primary)}
  .sumcard.on{border-color:var(--primary);box-shadow:0 0 0 2px rgba(30,122,63,.18)}
  .sumcode{font-family:'Cascadia Mono',monospace;font-size:10px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--txt2);padding:1px 6px;border-radius:5px;margin-right:5px;white-space:nowrap}
  .sumdetail{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .sumtitle{font-size:13px;font-weight:800;color:var(--txt);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sumn{font-size:11px;font-weight:700;color:#fff;background:var(--primary);padding:2px 9px;border-radius:999px;white-space:nowrap;flex:none}
  .sumline{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11.5px;border-top:1px dashed var(--line)}
  .sumline .sl{color:var(--txt2);flex:none}
  .sumline .sv{text-align:right}
  .bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:2px 2px 16px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  h1{font-size:17px;margin:0;font-weight:700}.sub{font-size:12px;color:var(--txt2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
  .filt{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  label{font-size:12px;color:var(--txt2)}
  input,select{margin-top:3px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--card2);color:var(--txt);font:inherit;font-size:13.5px}
  .btn{padding:9px 16px;border:0;border-radius:9px;background:var(--primary);color:#fff;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt2);font-weight:400}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
  .kpi{background:var(--card2);border-radius:var(--radius);padding:9px 12px}
  .kpi .k{font-size:11px;color:var(--txt2)}.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:11.5px;color:var(--txt2);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.row{cursor:pointer}tr.row:hover{background:var(--card2)}
  /* 📦 12 พ.ย. งาน Packing ที่ใช้รถไร่ (ใบขอรถ PKR) = แถวม่วงอมชมพู (สีเดียวกับชิป Packing หน้าสถานะ) · หน้า Packing: ค่าแรงจ่ายที่ไร่ = แถวเทา */
  tr.row.pkr{background:linear-gradient(90deg,rgba(139,92,246,.13),rgba(217,70,239,.07))}
  tr.row.pkr>td:first-child{box-shadow:inset 4px 0 0 #a855f7}
  tr.row.pkr:hover{background:linear-gradient(90deg,rgba(139,92,246,.2),rgba(217,70,239,.12))}
  tr.row.paidby{background:var(--card2)}
  tr.row.paidby>td:first-child{box-shadow:inset 4px 0 0 var(--line2)}
  tr.row.paidby:hover{background:var(--line)}
  .pkchip{display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(90deg,#8b5cf6,#d946ef);border-radius:999px;padding:1px 8px;margin-top:3px}
  .farmchip{display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;color:#1f6b3a;background:#dff3e6;border:1px solid #b9e2c7;border-radius:999px;padding:0 7px;margin-top:3px}
  .sumcard.pkr{border-color:#d8b4fe;background:linear-gradient(90deg,rgba(139,92,246,.10),rgba(217,70,239,.05))}
  .sumcard.pkr .sumcode{background:linear-gradient(90deg,#8b5cf6,#d946ef);color:#fff;border-color:transparent}
  #drBody.ro #recalcOne{display:none}
  .expc{font-size:10.5px;color:var(--txt2);line-height:1.35;white-space:nowrap}
  .expn{font-size:10.5px;color:var(--txt2);max-width:170px;white-space:normal;line-height:1.3}
  @media(prefers-color-scheme:dark){.farmchip{color:#9be3b3;background:#173524;border-color:#245a3a}.sumcard.pkr{border-color:#6d3fa8}}
  .pill{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--txt2)}
  .pill.lock{background:var(--primary);color:#fff}
  .msg{text-align:center;color:var(--txt2);padding:30px;font-size:13.5px}
  #ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  #ov.on{display:block}
  #dr{position:fixed;top:0;right:0;width:420px;max-width:94vw;height:100%;background:var(--card);box-shadow:-6px 0 24px rgba(0,0,0,.25);z-index:41;transform:translateX(105%);transition:.25s;overflow-y:auto;padding:16px 18px}
  #dr.on{transform:translateX(0)}
  .drow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
  .drow .l{color:var(--txt2)}
  .sec{margin:12px 0 4px;font-size:12px;font-weight:700;color:var(--primary)}
  .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--line);margin-top:10px;padding-top:10px}
  .big .amt{font-size:26px;font-weight:800;color:var(--primary)}
  /* ตัวโหลดวงแหวน (ลิ้นชักรายละเอียดเที่ยว) */
  .dload{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px}
  .dring{width:40px;height:40px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--primary);animation:dspin .8s linear infinite}
  .dltx{font-size:13px;font-weight:600;color:var(--txt2)}
  .dltx::after{content:'';display:inline-block;width:16px;text-align:left;animation:ddots 1.2s steps(4,end) infinite}
  @keyframes dspin{to{transform:rotate(360deg)}}
  @keyframes ddots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  @media(prefers-reduced-motion:reduce){.dring{animation-duration:2.4s}.dltx::after{animation:none;content:'…'}}
  /* แถบโหลดบางๆ ใต้หัวหน้า (เหมือนหน้าเครื่องคิดเลข) — ไม่บังหน้า ข้อมูลเดิมยังดูได้ระหว่างรอ */
  .ldbar{display:flex;flex-direction:column;gap:4px;margin:-8px 0 12px;transition:opacity .35s}
  .ldbar.out{opacity:0}
  .ldbar[hidden]{display:none}
  .ldtrack{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .ldtrack i{display:block;height:100%;width:40%;background:var(--primary);border-radius:2px;animation:ldslide 1.1s ease-in-out infinite}
  .ldtx{font-size:11.5px;color:var(--txt2)}
  .ldtx::after{content:'';display:inline-block;width:14px;text-align:left;animation:lddots 1.2s steps(4,end) infinite}
  @keyframes ldslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @keyframes lddots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  @media(prefers-reduced-motion:reduce){.ldtrack i{animation-duration:3s}.ldtx::after{animation:none;content:'…'}}
  /* เมนูดาวน์โหลด Excel / PDF / JPEG */
  .dlwrap{position:relative}
  .dlmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:250px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px rgba(20,40,60,.18);padding:6px}
  .dlmenu[hidden]{display:none}
  .dlmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--txt);font:inherit;font-size:13.5px;font-weight:600;padding:9px 11px;border-radius:8px;cursor:pointer}
  .dlmenu button:hover,.dlmenu button:focus-visible{background:var(--card2);outline:none}
  .dlmenu small{display:block;font-size:11px;font-weight:400;color:var(--txt2);margin-top:1px}
  /* 🧭 หน้าเลือกกลุ่มค่าแรง (ไร่ / Bulk / Packing) ก่อนเข้ารายงาน · 2026-10-14 */
  .gp{max-width:760px;margin:0 auto;padding:4px 0 24px}
  .gp[hidden]{display:none}
  .gphi{display:flex;align-items:center;gap:13px;margin:6px 2px 18px}
  .gpav{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card2);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--txt2)}
  .gphi h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
  .gphi p{margin:2px 0 0;font-size:13px;color:var(--txt2)}
  .gpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .gpc{position:relative;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:170px;padding:20px 20px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);font:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(20,40,60,.05);transition:border-color .15s,box-shadow .15s,transform .1s}
  .gpc:hover{border-color:var(--primary)}
  .gpc:active{transform:scale(.985)}
  .gpc:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .gpc.last{border:1.5px solid var(--primary);box-shadow:0 0 0 3px rgba(31,138,82,.12)}
  .gpc.lock{cursor:not-allowed;opacity:.5;box-shadow:none}
  .gpc.lock:hover{border-color:var(--line)}
  .gpi{width:56px;height:56px;border-radius:14px;background:rgba(31,138,82,.1);display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:8px}
  .gpc b{font-size:19px;font-weight:700}
  .gpc small{font-size:13px;color:var(--txt2)}
  .gpc em{font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-top:auto;padding-top:6px}
  .gpmsg{text-align:center;color:var(--txt2);padding:40px 16px;font-size:14px}
  .gpnote{font-size:12px;color:var(--txt2);margin:16px 2px 0}
  .grpchip{border:1px solid var(--primary);background:var(--card);color:var(--primary);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto}
  .grpchip span{font-weight:400;color:var(--txt2)}
  .grpchip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  /* 🔄 ป๊อปอัปความคืบหน้า "คำนวณใหม่" — กลางจอ บังหน้าไว้จนเสร็จ (คุณน้อง 26 ต.ค.) */
  /* ⚠️ popup เที่ยวที่ต้องตรวจ (ไม่มีระยะ · วิ่งจริง/เติมน้ำมันเกินค่ากลาง 5%) */
  .wachip{border:1px solid var(--danger);background:var(--card);color:var(--danger);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .wachip[hidden]{display:none}
  .wachip:focus-visible{outline:2px solid var(--danger);outline-offset:2px}
  .wa-ov{position:fixed;inset:0;z-index:180;background:rgba(10,20,15,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .wa{width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.3);overflow:hidden}
  .wa-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .wa-h h3{margin:0;font-size:16px;font-weight:800;line-height:1.4}
  .wa-h p{margin:2px 0 0;font-size:12.5px;color:var(--txt2);line-height:1.5}
  .wa-x{margin-left:auto;flex:none;width:32px;height:32px;border:1px solid var(--line2);border-radius:10px;background:transparent;color:var(--txt2);font-size:15px;cursor:pointer}
  .wa-b{overflow-y:auto;padding:0 20px 8px}
  .wa-sec{position:sticky;top:0;background:var(--card);padding:12px 0 6px;font-size:13.5px;font-weight:800;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}
  .wa-sec span{font-weight:400;font-size:12px;color:var(--txt2);white-space:nowrap}
  .wa-r{display:flex;width:100%;gap:12px;justify-content:space-between;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
  .wa-r:hover,.wa-r:focus-visible{border-color:var(--primary);outline:none}
  .wa-m{min-width:0;font-size:12.5px;line-height:1.5}
  .wa-m b{font-size:13px}
  .wa-m small{display:block;font-size:11.5px;color:var(--txt2)}
  .wa-v{flex:none;text-align:right;font-size:11.5px;color:var(--txt2);line-height:1.5;font-variant-numeric:tabular-nums}
  .wa-v b{display:block;font-size:15px;color:var(--danger)}
  .wa-t{display:inline-block;font-size:10.5px;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:0 6px;margin-left:5px;white-space:nowrap}
  .wa-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:12px}
  .wa-f a{color:var(--primary);font-weight:700}
  .rcp-ov{position:fixed;inset:0;z-index:190;background:rgba(10,20,15,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .rcp{width:100%;max-width:420px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.3);padding:22px 22px 18px}
  .rcp h3{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
  .rcp .num{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0 2px}
  .rcp .num small{font-size:14px;font-weight:600;color:var(--txt2)}
  .rcp-bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}   /* ไม่ใช้ .bar — ชนกับแถบหัวหน้า */
  .rcp-bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .3s}
  .rcp .st{font-size:12.5px;color:var(--txt2);min-height:18px}
  .rcp .warn{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(184,134,11,.12);color:var(--txt);font-size:12.5px;line-height:1.6}
  .rcp .f{display:flex;justify-content:flex-end;margin-top:16px}
  .rcp .f button{border:1px solid var(--line2);background:transparent;color:var(--txt2);border-radius:10px;padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .rcp .f button:disabled{opacity:.5;cursor:default}
  .rcp .f button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.rcp-bar i{transition:none}}
</style>
</head>
<body>
<section class="gp" id="gp" aria-labelledby="gpHi">
  <div class="bar">
    <button onclick="goBack()" style="border:1px solid var(--line2);background:var(--card);color:var(--txt);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer" aria-label="กลับ">←</button>
    <div class="logo">฿</div>
    <div><h1>รายงานค่าแรง</h1><div class="sub">SSB Smart Supply</div></div>
  </div>
  <div class="gphi"><div class="gpav" id="gpAv">👤</div><div><h2 id="gpHi">กำลังตรวจสิทธิ์…</h2><p id="gpSub">เลือกกลุ่มคนขับก่อนเข้าดูค่าแรง</p></div></div>
  <div class="gpgrid" id="gpGrid"><div class="gpmsg">กำลังโหลด…</div></div>
  <p class="gpnote" id="gpNote"></p>
</section>
<div class="wrap" id="mainWrap" hidden>
  <div class="bar">
    <button onclick="goBack()" style="border:1px solid var(--line2);background:var(--card);color:var(--txt);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer">←</button>
    <div class="logo">฿</div>
    <div><h1>ค่าแรง / ต้นทุน คนขับ</h1><div class="sub">SSB Smart Supply · ล็อกค่าตอนจบงาน</div></div>
    <button class="grpchip" id="grpChip" type="button" onclick="showPicker()" title="เปลี่ยนกลุ่ม">—</button>
    <button class="wachip" id="waChip" type="button" onclick="waOpen()" hidden></button>
  </div>
  <div id="ldBar" class="ldbar" role="status" aria-live="polite" aria-label="กำลังโหลด"><div class="ldtrack" aria-hidden="true"><i></i></div><span id="ldTxt" class="ldtx">กำลังเข้าสู่ระบบ</span></div>

  <div class="card">
    <div class="filt">
      <label>ตั้งแต่<br><input type="date" id="from"></label>
      <label>ถึง<br><input type="date" id="to"></label>
      <label>คนขับ<br><select id="driver"><option value="">ทุกคน</option></select></label>
      <button class="btn" id="load">ค้นหา</button>
      <button class="btn ghost" id="recalc" title="คิดค่าแรงใหม่ตามเงื่อนไขปัจจุบัน เฉพาะเที่ยวที่ยังไม่จ่าย">🔄 คำนวณใหม่</button>
      <button class="btn ghost" id="paidAll" title="ทำเครื่องหมายจ่ายแล้ว/ยกเลิก ทุกเที่ยวที่แสดงอยู่">☑️ จ่ายแล้วทั้งหมด</button>
      <div class="dlwrap"><button class="btn ghost" id="dlBtn" aria-haspopup="menu">⬇️ ดาวน์โหลด ▾</button>
        <div class="dlmenu" id="dlMenu" role="menu" hidden>
          <button role="menuitem" data-f="xlsx">📊 Excel (.xlsx)<small>ทุกเที่ยว + สรุปรายคนขับ · ติดลบสีแดง</small></button>
          <button role="menuitem" data-f="pdf">📄 PDF<small>A4 แนวนอน พร้อมพิมพ์ · มีเลขหน้า</small></button>

<aside id="dr">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b style="font-size:15px">🧾 รายละเอียดเที่ยว</b>

<script src="wage-ui.js?v=20261105b"></script>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw2DXaTVoX5cgUZjQrGlpx7tQ1-gwcYYB85eY8MElo2oaqBIxCsjVfL7yMiM8uuUw9YxA/exec';
const LIFF_ID='2010274217-Ot7vGhri';
let MY_UID='', ROWS=[], VIEW=[], SEARCH='', ACTIVE_DEST='';
const money=n=>Math.round(n||0).toLocaleString('th-TH');
const $=id=>document.getElementById(id);
function goBack(){ if(history.length>1){history.back();} else {location.href='/SSB-SMART-SUPPLY-DASHBOARD/';} }

function deny(t){ldHide();if(!$('msg'))$('tbl').innerHTML='<div class="msg" id="msg"></div>';$('msg').textContent=t;$('msg').style.color='var(--danger)';}

async function api(params){
  if(params&&params.action==='getWageReport')params=Object.assign({},params,{group:window.WAGE_GROUP||''});   // 🧭 กลุ่มที่เลือก (server ตรวจสิทธิ์ซ้ำ)
  const u=GAS_URL+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(), 90000);   // กัน hang ตลอดกาล (ครั้งแรกหลัง deploy อาจช้า)
  try{ const r=await (window.ssbFetch||fetch)(u,{signal:ctrl.signal}); return await r.json(); }   // ⚡ รายงานค่าแรงอ่าน Supabase ก่อน (ssb-read.js) · ตัวอื่น/พลาด → GAS
  finally{ clearTimeout(t); }
}

// แถบโหลด: โชว์ระหว่างรอ · จางหายเมื่อเสร็จ · กันค้าง 100 วิ (api หมดเวลา 90 วิ)
let _ldT=null;
function ldShow(msg){const b=$('ldBar');if(!b)return;$('ldTxt').textContent=msg;b.hidden=false;b.classList.remove('out');clearTimeout(_ldT);_ldT=setTimeout(ldHide,100000);}
function ldHide(){const b=$('ldBar');if(!b)return;clearTimeout(_ldT);b.classList.add('out');setTimeout(()=>{if(b.classList.contains('out'))b.hidden=true;},380);}
async function loadReport(){
  ldShow('กำลังโหลดรายงานค่าแรง…');   // อ่านจาก Supabase ~1 วิ (ssb-read) · ถอยไป GAS เฉพาะตอน Supabase พัง
  if(!ROWS.length)$('tbl').innerHTML='';   // มีข้อมูลเดิม = ปล่อยไว้ให้ดูระหว่างรอ
  let res;
  try{
    res=await api({action:'getWageReport',userId:MY_UID,from:$('from').value,to:$('to').value,driver:$('driver').value});
  }catch(e){
    ldHide();
    const why=(e&&e.name==='AbortError')?'หมดเวลา (backend ตอบช้า)':'เชื่อมต่อไม่ได้';
    $('tbl').innerHTML='<div class="msg">โหลดไม่สำเร็จ — '+why+' <button class="btn" style="margin-left:8px" onclick="loadReport()">ลองใหม่</button></div>';
    return;
  }
  ldHide();
  if(res.denied){if(window.uiProfile)uiProfile.set({status:'denied'});deny('ไม่มีสิทธิ์เข้าถึง (เฉพาะแอดมิน) — กดปุ่มโปรไฟล์มุมขวาบน เพื่อคัดลอก UID ขอสิทธิ์ หรือออกจากระบบแล้วเข้าด้วยบัญชีแอดมิน');return;}
  if(!res.ok){$('tbl').innerHTML='<div class="msg">'+(res.error||'ผิดพลาด')+' <button class="btn" style="margin-left:8px" onclick="loadReport()">ลองใหม่</button></div>';return;}
  if(window.uiProfile)uiProfile.set({status:'admin'});
  ROWS=res.rows||[]; ACTIVE_DEST='';
  // driver options (คงค่าเดิม)
  const cur=$('driver').value, ds=[...new Set(ROWS.map(r=>r.driver).filter(Boolean))];
  $('driver').innerHTML='<option value="">ทุกคน</option>'+ds.map(d=>`<option${d===cur?' selected':''}>${d}</option>`).join('');
  applyView();
  waAfterLoad();
}

const _escS=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ชื่อกลุ่ม: ถ้าจุดรับ (dest) ต่างจากชื่อสวน = ออเดอร์สวน → "ชื่อสวน · จุดรับ" · ถ้าเหมือนกัน = ลาน → ชื่อเดียว
/* สวน/ลาน + จุดรับ → ข้อความเดียว · ชื่อซ้ำกัน (ไม่สนเว้นวรรค/ตัวพิมพ์ หรือชื่อหนึ่งอยู่ในอีกชื่อ) = โชว์ชื่อเดียว เช่น ลานคลองหาด → ลานคลองหาด = ลานคลองหาด */
function _pn(s){return String(s||'').replace(/[\s\u200b]+/g,'').toLowerCase();}
function placeOf(g,d,sep){g=String(g||'').trim();d=String(d||'').trim();if(!g||!d)return d||g;const a=_pn(g),b=_pn(d);if(a===b||a.includes(b)||b.includes(a))return a.length>=b.length?g:d;return g+(sep||' → ')+d;}
window.placeOf=placeOf;
const _gkey=r=>placeOf(r.garden,r.dest,' · ')||'—';

/* กรอง (ค้นหา + ปลายทางที่เลือก) → เรนเดอร์ ตาราง + KPI + สรุป */
function applyView(){
  const q=SEARCH.trim().toLowerCase();
  const hit=r=>!q||[r.dest,r.garden,r.rampCode,r.gardenCode,r.pickupCode,r.driver,r.orderId,r.plate,r.jobType,r.vehicleType,r.model].some(x=>String(x||'').toLowerCase().includes(q));
  const searchRows=ROWS.filter(hit);
  VIEW=ACTIVE_DEST?searchRows.filter(r=>_gkey(r)===ACTIVE_DEST):searchRows;
  renderTable(VIEW);
  const pay=VIEW.filter(r=>!r.paidBy);   // 📦 เที่ยวที่ค่าแรงจ่ายกลุ่มอื่น (PKR ใช้รถไร่) ไม่นับรวมค่าแรงหน้านี้
  const tot=pay.reduce((s,r)=>s+(r.wage||0),0);
  const totDist=VIEW.reduce((s,r)=>s+(Number(r.distActual)||0),0);
  const totFuel=VIEW.reduce((s,r)=>s+(Number(r.liters)||0),0);
  $('kTrips').textContent=VIEW.length+(pay.length<VIEW.length?' ('+(VIEW.length-pay.length)+' จ่ายที่ไร่)':'');
  $('kWage').textContent=money(tot)+' บ.';
  $('kAvg').textContent=(pay.length?money(tot/pay.length):0)+' บ.';
  $('kDist').textContent=totDist.toLocaleString('th-TH',{maximumFractionDigits:1})+' กม.';
  $('kFuel').textContent=totFuel.toLocaleString('th-TH',{maximumFractionDigits:1})+' ล.';
  renderSummary(searchRows);
  updatePaidAllBtn();
}
/* เที่ยวนี้คิดค่าแรงด้วยค่ากลางไหม — snapshot ใหม่บอกตรง (usedCentral) · snapshot เก่าเดาจาก ระยะที่ใช้คิด ≈ ค่ากลาง และ ≠ ระยะจริง */
function usedCentral(r){
  if(r.usedCentral===true||r.usedCentral===false)return r.usedCentral;
  const c=+r.distCentral||0,u=+r.distUsed||0,a=+r.distActual||0;
  return c>0&&Math.abs(u-c)<0.15&&Math.abs(u-a)>=0.15;
}
const USEDCHIP='<div><span style="display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;color:#fff;background:var(--primary);border-radius:999px;padding:1px 7px;margin-top:2px">ใช้คิด</span></div>';
function centralCell(r){
  const c=+r.distCentral||0,a=+r.distActual||0;
  if(!(c>0))return '<span style="color:var(--txt2);font-size:11px">ยังไม่มี</span>';
  const d=a-c, used=usedCentral(r);
  return c.toLocaleString('th-TH',{maximumFractionDigits:1})
    +(used?USEDCHIP:'')
    +(a>0?`<div style="font-size:10.5px;color:${Math.abs(d)>c*0.1?'var(--danger)':'var(--txt2)'}">จริง${d>=0?'+':''}${d.toLocaleString('th-TH',{maximumFractionDigits:1})}</div>`:'');
}
/* 💸 ค่าใช้จ่ายในเที่ยว (หน้า Packing · คุณน้อง 12 พ.ย.) — รวม + แยกรายการ · หมายเหตุใต้ */
const EXP_ITEMS=[['toll','ทางด่วน'],['unload','ค่าลงของ'],['helper','เด็กลงนอก'],['fuelRoad','น้ำมันระหว่างทาง'],['repair','ซ่อมนอก']];
let SHOW_EXP=false;
const expTotal=e=>e?EXP_ITEMS.reduce((s,[k])=>s+(+e[k]||0),0):0;
function expCell(e){
  const tot=expTotal(e), note=e&&e.note?String(e.note).replace(/^"+|"+$/g,''):'';
  if(!tot&&!note)return '<span style="color:var(--txt2)">—</span>';
  return (tot?'<b>'+money(tot)+'</b>':'')
    +EXP_ITEMS.filter(([k])=>+e[k]>0).map(([k,l])=>'<div class="expc">'+l+' '+money(+e[k])+'</div>').join('')
    +(note?'<div class="expn" title="หมายเหตุค่าใช้จ่าย">📝 '+_escS(note)+'</div>':'');
}
function renderTable(rows){
  SHOW_EXP=window.WAGE_GROUP==='Packing';
  if(!rows.length){$('tbl').innerHTML='<div class="msg">'+((SEARCH||ACTIVE_DEST)?'ไม่มีเที่ยวที่ตรงเงื่อนไข':'ไม่มีเที่ยวในช่วงที่เลือก')+'</div>';return;}
  const n1=v=>{v=Number(v||0);return v?v.toLocaleString('th-TH',{maximumFractionDigits:1}):'—';};
  const n2=v=>{v=Number(v||0);return v?v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';};
  let h='<table><thead><tr><th>วันที่</th><th>ออเดอร์</th><th>คนขับ</th><th>ชนิดรถ</th><th>สวน / ปลายทาง</th><th class="num" title="จากเลขไมล์ที่คนขับกรอก">ระยะจริง (กม.)</th><th class="num" title="ค่ากลางไป-กลับ (หน้า 📍 ค่ากลาง × 2) · ป้าย ใช้คิด = เที่ยวนี้คิดค่าแรงด้วยค่ากลาง · จริง± = ระยะจริงต่างจากค่ากลาง (แดง = ต่างเกิน 10%)">ระยะกลาง (กม.)</th><th class="num">น้ำมัน (ล.)</th><th class="num">กม./ล.</th>'+(SHOW_EXP?'<th class="num" title="ค่าใช้จ่ายที่คนขับกรอกในเที่ยว: ทางด่วน · ค่าลงของ · เด็กลงสินค้านอก · น้ำมันเติมระหว่างทาง · ซ่อมนอก">ค่าใช้จ่าย (บ.)</th>':'')+'<th class="num">ค่าแรง</th><th>จ่ายแล้ว</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const place=placeOf(r.garden,r.dest)||'—';
    const kmpl=(Number(r.liters)>0&&Number(r.distActual)>0)?(Number(r.distActual)/Number(r.liters)):0;
    const vtMain=r.model?('รุ่น '+r.model):(r.vehicleType||'—');
    const vtSub=(r.model&&r.vehicleType)?`<div style="font-size:10px;color:var(--txt2)">${r.vehicleType}</div>`:'';
    const cls=r.paidBy?' paidby':(r.pkr?' pkr':'');
    const tag=r.paidBy?`<div><span class="farmchip">🌴 จ่ายที่${_escS(r.paidBy)}</span></div>`:(r.pkr?'<div><span class="pkchip">📦 Packing</span></div>':'');
    const wageCell=r.paidBy
      ? `<span style="color:var(--txt2)" title="ค่าแรงเที่ยวนี้จ่ายที่กลุ่ม${_escS(r.paidBy)} · ไม่นับรวมหน้านี้">${money(r.wage)}</span>`
      : `<b${Number(r.wage)<0?' style="color:var(--danger)"':''}>${money(r.wage)}</b>`;
    const paidCell=r.paidBy
      ? `<span style="font-size:11px;color:var(--txt2)">จ่ายที่${_escS(r.paidBy)}${r.locked?' 🔒':''}</span>`
      : `<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" ${r.locked?'checked':''} onchange="togglePaid('${r.orderId}',this.checked,this)" style="width:17px;height:17px"><span style="font-size:11px;color:${r.locked?'var(--primary)':'var(--txt2)'}">${r.locked?'จ่ายแล้ว 🔒':'ยังไม่จ่าย'}</span></label>`;
    h+=`<tr class="row${cls}" data-i="${i}"><td style="white-space:nowrap">${fmtD(r.date)}</td><td style="white-space:nowrap">${r.orderId}<div style="font-size:10.5px;color:var(--txt2)">${r.plate||''}</div>${tag}</td><td>${r.driver||'—'}</td><td style="font-size:12px">${vtMain}${vtSub}</td><td style="font-size:12px">${place}</td><td class="num">${n1(r.distActual)}${(!usedCentral(r)&&+r.distActual>0)?USEDCHIP:''}</td><td class="num">${centralCell(r)}</td><td class="num">${n1(r.liters)}</td><td class="num">${n2(kmpl)}</td>${SHOW_EXP?'<td class="num">'+expCell(r.exp)+'</td>':''}<td class="num">${wageCell}</td><td>${paidCell}</td></tr>`;
  });
  $('tbl').innerHTML=h+'</tbody></table>';
  $('tbl').querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>openDetail(rows[+tr.dataset.i].orderId));
}

/* 📊 สรุปตามปลายทาง — รหัส+ชื่อ+เที่ยว · กดกาง+กรองตาราง */
function _stat(arr,f){const v=arr.map(f).filter(x=>x!=null&&!isNaN(x)&&x!==0);if(!v.length)return null;const sum=v.reduce((a,b)=>a+b,0);return{max:Math.max(...v),min:Math.min(...v),avg:sum/v.length};}
function _sline(label,s,unit,dec){
  const f=x=>Number(x||0).toLocaleString('th-TH',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0});
  if(!s)return `<div class="sumline"><span class="sl">${label}</span><span class="sv" style="color:var(--txt2)">—</span></div>`;
  return `<div class="sumline"><span class="sl">${label}</span><span class="sv">สูง <b>${f(s.max)}</b> · ต่ำ <b>${f(s.min)}</b> · เฉลี่ย <b>${f(s.avg)}</b> ${unit}</span></div>`;
}
function renderSummary(rows){
  const box=$('summary'); if(!box)return;
  if(!rows.length){box.innerHTML='<div class="sumhead" style="color:var(--txt2)">ไม่มีข้อมูล</div>';return;}
  const g={};
  rows.forEach(r=>{const k=_gkey(r);if(!g[k])g[k]={rows:[],r0:r};g[k].rows.push(r);});
  const groups=Object.keys(g).map(k=>({name:k,r0:g[k].r0,rows:g[k].rows})).sort((a,b)=>b.rows.length-a.rows.length);
  let h='<div class="sumhead">📊 สรุปตามปลายทาง ('+groups.length+' แห่ง)</div>';
  if(ACTIVE_DEST)h+=`<div class="sumfilter">📍 กรอง: ${_escS(ACTIVE_DEST)} <b>✕</b></div>`;
  const chip=c=>c?`<span class="sumcode">${_escS(c)}</span>`:'';
  groups.forEach(gr=>{
    const on=ACTIVE_DEST===gr.name, r0=gr.r0, gg=(r0.garden||'').trim(), dd=(r0.dest||'').trim();
    // สวน (มีจุดรับ): [รหัสสวน] ชื่อสวน · [รหัสจุดรับ] จุดรับ · ลาน: [รหัสลาน] ชื่อลาน
    const label=(dd&&gg&&placeOf(gg,dd)!==gg&&placeOf(gg,dd)!==dd)   // ชื่อซ้ำ (เช่น ลานคลองหาด/ลานคลองหาด) = ชื่อเดียว
      ? chip(r0.gardenCode)+_escS(gg)+' · '+chip(r0.pickupCode)+_escS(dd)
      : chip(r0.rampCode||r0.gardenCode||r0.pickupCode)+_escS(dd||gg||'—');
    const pk=window.WAGE_GROUP!=='Packing'&&gr.rows.some(r=>r.pkr);   // 📦 ปลายทางงาน Packing (ใช้รถไร่) = การ์ดม่วง
    h+=`<div class="sumcard ${on?'on':''}${pk?' pkr':''}" data-dest="${_escS(gr.name)}">
      <div class="sumtitle"><span>${label}</span><span class="sumn">${gr.rows.length} เที่ยว</span></div>
      ${on?`<div class="sumdetail">
        ${_sline('ค่าเที่ยว',_stat(gr.rows,r=>r.wage),'บ.',0)}
        ${_sline('ระยะจริง',_stat(gr.rows,r=>r.distActual),'กม.',1)}
        ${_sline('ระยะกลาง',_stat(gr.rows,r=>r.distCentral),'กม.',1)}
        ${_sline('น้ำมัน',_stat(gr.rows,r=>r.liters),'ล.',1)}
        ${_sline('กม./ล.',_stat(gr.rows,r=>{const l=+r.liters,d=+r.distActual;return(l>0&&d>0)?d/l:0;}),'',2)}
      </div>`:''}
    </div>`;
  });
  box.innerHTML=h;
}
function pickDest(name){ ACTIVE_DEST=(ACTIVE_DEST===name)?'':name; applyView(); }

/* ก้อนน้ำมัน: ลิตรเกณฑ์ (จากระยะที่ใช้คิด) + ลิตรค่าพิเศษ − ลิตรเติมจริง = ส่วนต่าง × เลทน้ำมัน */
/* อธิบาย "เลท กม./ล." ว่ามาจากตาราง⑬ ช่วงไหน (ตารางปัจจุบันของประเภทรถ · ตรงกับ computeTripWage _blendKmpl_/_bench13Rate_/_bench13Zone_)
 *   ตัวเลขลิตรจริงยังใช้ค่าที่บันทึกไว้ — บรรทัดนี้แค่บอกที่มา */
function zoneWhy(d,key,mode,zones,lastTo){
  if(!(d>0)||!zones||!zones.length)return'';
  const L=key==='h'?'หนัก':'เบา', f2=x=>(+x).toFixed(2), rng=z=>z.lo+'–'+(z.hi>=9999?'∞':z.hi)+' กม.';
  let i=0;while(i<zones.length-1&&d>zones[i].hi)i++;
  const z=zones[i], k=z[key];
  if(mode==='hlrate')return 'ตาราง⑬ '+L+' ช่วง '+rng(z)+' · เลท '+f2(k)+' กม./ล. (ใช้ทั้งก้อน)';
  if(mode==='hlzone')return 'ตาราง⑬ แบ่งตามช่วง: '+zones.filter(x=>Math.min(d,x.hi)-x.lo>0).map(x=>rng(x)+' @'+f2(x[key])).join(' · ');
  if(mode!=='hlblend')return'';
  if(i===0||!(zones[i-1][key]>0))return 'ตาราง⑬ '+L+' ช่วง '+rng(z)+' · เลท '+f2(k)+' กม./ล.';
  const p=zones[i-1], a=p.hi; let top=z.hi;

/* กล่องสถานะหัวลิ้นชัก: คำนวณล่าสุดเมื่อไร · จ่ายแล้วไหม · ถ้าคิดใหม่ตอนนี้ได้เท่าไร (ต่างเพราะอะไร) + ปุ่มคิดใหม่เที่ยวนี้ */

async function recalcOne(orderId,btn){
  btn.disabled=true;btn.textContent='กำลังคิด…';
  let d=null;
  for(let tr=1;tr<=3&&!d;tr++){   // คิดซ้ำได้ปลอดภัย (ผลเดิม) → GAS ตอบ HTML = ลองใหม่
    try{d=await recomputeApi([orderId]);}catch(_){d=null;await new Promise(z=>setTimeout(z,1500*tr));}
  }
  if(!d||!d.ok||!d.done){btn.disabled=false;btn.textContent='🔄 คิดใหม่เที่ยวนี้';uiAlert('❌ คิดใหม่ไม่สำเร็จ'+(d&&d.results&&d.results[0]&&d.results[0].error?': '+d.results[0].error:''));return;}
  await loadReport(); openDetail(orderId);
}

let DR_SEQ=0, DR_ZONES=null, DR_DEST=null, DR_GPS=null, DR_BILL=null;   // DR_ZONES = ตาราง⑬ ของเที่ยวที่เปิดอยู่ (จาก wage-stored) ไว้อธิบายเลท · DR_DEST = ปลายทาง+ประวัติแก้หมุด · DR_GPS = จุดจอดจาก GPS (Promise/ผล) · DR_BILL = เลขบิลน้ำมันที่ระบบอ่านจากรูป (12 พ.ย.)

async function compareLive(orderId,btn,seqIn){

  const slow=(async()=>{
    // GAS บางครั้งตอบหน้า HTML (บ่อยหลัง deploy) → อ่านซ้ำได้ 3 รอบ (อ่านอย่างเดียว ปลอดภัย)
    for(let n=1;;n++){ try{ return await api({action:'getWageMonitor',userId:MY_UID,orderId}); }catch(e){ if(n>=3||(e&&e.name==='AbortError'))throw e; await new Promise(z=>setTimeout(z,1500*n)); } }
  })();
  let res;

  catch(e){   // หมดเวลา 90 วิ / หลังบ้านตอบหน้า HTML → อย่าให้วงแหวนหมุนค้าง
    if(seq!==DR_SEQ)return;
    const why='('+(e&&e.name==='AbortError'?'หลังบ้านไม่ตอบใน 90 วินาที':'หลังบ้านตอบผิดรูปแบบ')+')';
    cmpFail(orderId,fast,'('+(e&&e.name==='AbortError'?'หลังบ้านไม่ตอบใน 90 วินาที':'หลังบ้านตอบผิดรูปแบบ')+')');
    return;
  }
  if(seq!==DR_SEQ)return;
  if(!res.ok){ cmpFail(orderId,fast,res.error||'ผิดพลาด'); return; }
  renderDetail(orderId,res,false);
}

/* 🏁 ปลายทางจริงของเที่ยว + แก้หมุด + ประวัติ (คุณน้อง 2026-11-05) · ค่าว่าง = จบที่โรงงาน
 *   ดูจากพิกัดที่รถจอดจริง (Edge trip-dest) แล้วถาม "ใช่ที่นี่ไหม" ให้แอดมินยืนยัน · ไม่บันทึกเองโดยไม่มีคนกด */
const TRIP_DEST_URL='https://abihhdjcrbvwlkzwvjio.supabase.co/functions/v1/trip-dest';
const DEST_FACTORY='จบที่โรงงาน (ไม่มีจุดส่งอื่น)';
const destHere=(s)=>s.name||(s.lat+', '+s.lng);
const destMapUrl=(s)=>'https://www.google.com/maps?q='+s.lat+','+s.lng;
function destMins(m){m=+m||0;const h=Math.floor(m/60);return (h?h+' ชม. ':'')+(m%60||!h?(m%60)+' นาที':'');}
function destGps(orderId){
  if(!DR_GPS)DR_GPS=fetch(TRIP_DEST_URL+'?action=suggest&userId='+encodeURIComponent(MY_UID)+'&orderId='+encodeURIComponent(orderId)).then(r=>r.json()).catch(()=>({ok:false,error:'เชื่อมต่อไม่สำเร็จ'}));
  return DR_GPS;
}
async function destGpsPaint(orderId,locked,seq){
  const g=await destGps(orderId);
  const box=$('destGps'); if(seq!==DR_SEQ||!box)return;
  box.innerHTML=destGpsHtml(orderId,g,locked);
}
function destGpsHtml(orderId,g,locked){
  const replay='<a href="replay.html?order='+encodeURIComponent(orderId)+'" target="_blank" rel="noopener">ดูเส้นทางบนแผนที่</a>';
  const note=(t)=>'<div style="margin-top:7px;font-size:12px;color:var(--txt2);line-height:1.55">'+t+'</div>';
  if(g.skip)return '';
  if(!g.ok)return note('อ่าน GPS ไม่สำเร็จ'+(g.error?' ('+_escS(g.error)+')':'')+' · '+replay);
  if(!g.gpsOk)return note('ตรวจจาก GPS ไม่ได้: '+_escS(g.why||'')+' · '+replay);
  const stops=g.stops||[], s=g.suggest, cur=g.current||'';
  const list=stops.length?'<details style="margin-top:7px;font-size:12px"><summary style="cursor:pointer;color:var(--txt2)">จุดจอดทั้งหมดของเที่ยวนี้ ('+stops.length+')</summary>'
    +stops.map(x=>'<div style="padding:5px 0 0;line-height:1.5"><span style="color:var(--txt2)">'+destTime(x.arr)+' · '+destMins(x.mins)+'</span>'+(x.pickup?' <b>จุดรับ</b>':'')+'<br>'+_escS(destHere(x))+(x.poi?' <span style="color:var(--txt2)">'+_escS(x.poi)+'</span>':'')+' · <a href="'+destMapUrl(x)+'" target="_blank" rel="noopener">แผนที่</a></div>').join('')
    +'<div style="padding-top:6px">'+replay+'</div></details>':'';
  const box=(html)=>'<div style="margin-top:8px;padding:9px 11px;border:1px solid var(--warn,#c98a12);border-radius:9px;background:rgba(201,138,18,.09);font-size:13px;line-height:1.6">'+html+'</div>';
  const btns=(ok)=>locked?'':'<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">'+ok+'<button class="btn ghost" style="padding:5px 12px;font-size:12.5px" onclick="editDest(\''+orderId+'\',this)">ไม่ใช่ เลือกเอง</button></div>';
  if(s&&!g.match){
    const back=g.backAt?'จุดจอดสุดท้ายก่อนกลับโรงงาน':'จุดจอดสุดท้ายของเที่ยว (GPS ยังไม่เห็นรถกลับเข้าโรงงาน)';
    const yes=s.station?'<button class="btn" style="padding:5px 12px;font-size:12.5px" onclick="destYes(\''+orderId+'\',this)">✅ ใช่ ที่นี่</button>':'';
    return box('<div style="font-size:12px;color:var(--txt2)">GPS: '+back+'</div>'
      +'<b>'+_escS(destHere(s))+'</b>'+(s.poi?' <span style="font-size:12px;color:var(--txt2)">'+_escS(s.poi)+'</span>':'')
      +'<div style="font-size:12px;color:var(--txt2)">ถึง '+destTime(s.arr)+' · จอด '+destMins(s.mins)+' · <a href="'+destMapUrl(s)+'" target="_blank" rel="noopener">แผนที่</a></div>'
      +(locked?'<div style="margin-top:5px;font-size:12.5px">ไม่ตรงกับปลายทางที่บันทึกไว้ แต่เที่ยวนี้จ่ายแล้ว แก้ไม่ได้</div>':s.station?'<div style="margin-top:5px;font-weight:700">ปลายทางจริงใช่ที่นี่ไหม?</div>':'<div style="margin-top:5px;font-size:12.5px">จุดนี้ยังไม่มีในตารางค่ากลาง ถ้าใช่ ให้ DEV เพิ่มสถานีก่อน จึงจะยืนยันได้</div>')
      +btns(yes))+list;
  }
  if(s)return note('✅ GPS ตรงกัน: จอดที่ '+_escS(destHere(s))+' '+destMins(s.mins))+list;
  if(cur)return box('GPS ไม่พบว่ารถจอดที่ <b>'+_escS(cur)+'</b> หลังจุดรับ'+(locked?'':'<div style="margin-top:5px;font-weight:700">เที่ยวนี้จบที่โรงงานใช่ไหม?</div>')
    +btns('<button class="btn" style="padding:5px 12px;font-size:12.5px" onclick="destYes(\''+orderId+'\',this,1)">✅ ใช่ จบที่โรงงาน</button>'))+list;
  return note('GPS: หลังจุดรับ'+(g.backAt?' กลับโรงงานเลย':'')+' ไม่มีจุดส่งอื่น')+list;
}
async function destYes(orderId,el,factory){
  const g=await destGps(orderId), s=g&&g.suggest, dest=factory?'โรงงาน':(s&&s.station);
  if(!dest)return;
  const label=factory?DEST_FACTORY:dest;
  if(!(await uiConfirm({title:'ยืนยันปลายทาง: '+label+'?',msg:'ระบบบันทึกชื่อแอดมินกับวันเวลาที่ยืนยัน แล้วคิดค่าแรงเที่ยวนี้ใหม่ทันที',okText:'ยืนยัน',icon:'🏁'})))return;
  const note=factory?'GPS ไม่พบจุดจอดอื่นหลังจุดรับ':('GPS '+destHere(s)+' ถึง '+destTime(s.arr)+' จอด '+destMins(s.mins));
  await destApply(orderId,dest,note,'ยืนยันจาก GPS',el);
}
async function destApply(orderId,dest,note,source,el){
  el.disabled=true;el.textContent='กำลังคิด…';
  let w=null;
  try{ w=await fetch(LOAD_EDGE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'setDest',userId:MY_UID,orderId,dest,note,source})}).then(x=>x.json()); }catch(_){}
  if(!w||!w.success){ uiAlert('❌ '+((w&&w.error)||'แก้ปลายทางไม่สำเร็จ')); openDetail(orderId); return; }
  let c=null;
  for(let tr=1;tr<=3&&!c;tr++){ try{c=await recomputeApi([orderId]);}catch(_){c=null;await new Promise(z=>setTimeout(z,1500*tr));} }
  if(!c||!c.ok||!c.done) uiAlert('แก้ปลายทางแล้ว แต่คิดค่าแรงใหม่ไม่สำเร็จ — กด "คิดใหม่เที่ยวนี้"');
  await loadReport(); openDetail(orderId);
}
function destTime(iso){
  const t=new Date(iso); if(isNaN(t))return '';
  const b=new Date(t.getTime()+7*3600000),p=n=>('0'+n).slice(-2);
  return p(b.getUTCDate())+'/'+p(b.getUTCMonth()+1)+'/'+b.getUTCFullYear()+' '+p(b.getUTCHours())+':'+p(b.getUTCMinutes())+' น.';
}
function destBlock(orderId,st){
  const d=DR_DEST; if(!d)return '';
  const locked=!!(st&&st.locked), log=d.log||[];
  let s='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px"><span>🏁 ปลายทาง <b>'+_escS(d.current||DEST_FACTORY)+'</b></span>';
  if(d.canEdit)s+=locked?'<span style="font-size:12px;color:var(--txt2)">จ่ายแล้ว แก้ไม่ได้</span>':'<button class="btn ghost" style="padding:4px 12px;font-size:12.5px" onclick="editDest(\''+orderId+'\',this)">แก้หมุด</button>';
  s+='</div>';
  if(d.canEdit){
    s+='<div id="destGps"><div style="margin-top:7px;font-size:12px;color:var(--txt2)">กำลังอ่านจุดจอดจาก GPS…</div></div>';
    const seq=DR_SEQ; setTimeout(()=>destGpsPaint(orderId,locked,seq),0);
  }
  if(log.length)s+='<details style="margin-top:7px;font-size:12px"'+(log.length<=3?' open':'')+'><summary style="cursor:pointer;color:var(--txt2)">ประวัติการแก้ไข ('+log.length+')</summary>'
    +log.map(x=>'<div style="padding:6px 0 0;line-height:1.55"><span style="color:var(--txt2)">'+destTime(x.edited_at)+'</span> · <b>'+_escS(x.editor_name||'—')+'</b><br>'
      +(x.old_station?_escS(x.old_station):'จบที่โรงงาน')+' → '+(x.new_station?_escS(x.new_station):'จบที่โรงงาน')
      +' <span style="color:var(--txt2)">('+_escS(x.source||'แก้หมุด')+')</span>'
      +(x.note?'<br><span style="color:var(--txt2)">'+_escS(x.note)+'</span>':'')+'</div>').join('')+'</details>';
  return '<div style="border:1px solid var(--line2);border-radius:10px;padding:9px 11px;margin:0 0 10px">'+s+'</div>';
}
async function editDest(orderId,el){
  const d=DR_DEST; if(!d)return;
  const g=await destGps(orderId);
  // ชิป = จุดที่รถจอดจริงหลังจุดรับ (ที่มีในค่ากลาง) + จบที่โรงงาน · อื่นๆ ค้นจากตารางค่ากลางทั้งหมด
  const after=(g.stops||[]).slice((g.stops||[]).findIndex(x=>x.pickup)+1).filter(x=>x.station).map(x=>x.station);
  const value=d.current||DEST_FACTORY, options=[...new Set([...after,value,DEST_FACTORY])];
  const r=await uiChoose({title:'แก้ปลายทางของเที่ยวนี้',msg:'ชิปคือจุดที่รถจอดจริงตาม GPS · ระบบบันทึกชื่อแอดมินกับวันเวลาที่แก้ แล้วคิดค่าแรงเที่ยวนี้ใหม่ทันที',options,value,list:g.stations||[],listPlaceholder:'ค้นหาสถานีอื่น',placeholder:'หมายเหตุ (ถ้ามี)',icon:'🏁'});
  if(!r)return;
  await destApply(orderId,r.value===DEST_FACTORY?'โรงงาน':r.value,r.note,'แก้หมุด',el);
}
function renderDetail(orderId,res,pending){
  // ลิ้นชักโชว์ "ค่าที่บันทึกไว้" = ตัวเดียวกับตาราง/รายงาน (ไม่ใช่คิดสด) · ค่าสดใช้เทียบ ถ้าต่าง = บอก + ปุ่มคิดใหม่
  const live=res.wage, st=res.stored, c=res.cost;
  const isStored=!!(st&&st.snapshot);
  const w=isStored?Object.assign({driver:live.driver,plate:live.plate,garden:live.garden,dest:live.dest},st.snapshot,{wage:st.fee,snapshot:st.snapshot.params||{},model:''}):live;
  if(!w.snapshot)w.snapshot={};
  w.zones=res.zones||DR_ZONES;
  // snapshot เก่า (ส.ค.) ไม่มี distTotal/distMode → คิดจากขา
  if(w.distTotal==null){const dl=(w.legs||[]).reduce((a,l)=>a+(+l.distKm||0),0);w.distTotal=Math.round(((+w.distHeavy||0)+(+w.distLight||0)||dl)*10)/10;}
  if(w.distHeavy==null&&w.legs){w.distHeavy=(w.legs||[]).filter(l=>l.weight==='หนัก').reduce((a,l)=>a+(+l.distKm||0),0);w.distLight=w.distTotal-w.distHeavy;}
  function row(l,v,cl){return `<div class="drow"><span class="l">${l}</span><span${cl?' style="'+cl+'"':''}>${v}</span></div>`;}
  const place=placeOf(w.garden,w.dest);
  const rr=ROWS.find(x=>x.orderId===orderId)||{}, ro=!!rr.paidBy;   // 📦 ค่าแรงจ่ายที่กลุ่มอื่น = ดูอย่างเดียว (ไม่คิดใหม่/ไม่แก้)
  $('drBody').classList.toggle('ro',ro);
  let h=`<div style="font-size:12px;color:var(--txt2);margin-bottom:6px">${orderId} · ${w.driver||''} · ${w.plate||''} · ${w.vehType||(live.vehType||'')} · ${w.distTotal} กม. ${w.distMode==='central'?'(ระยะกลาง)':'(ระยะจริง)'}</div>`;
  if(ro)h+=`<div style="background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;margin-bottom:8px;font-size:12.5px">🌴 งาน Packing ใช้รถ${_escS(rr.paidBy)} — <b>ค่าแรงจ่ายที่หน้าค่าแรง${_escS(rr.paidBy)}</b> หน้านี้ดูค่าใช้จ่ายอย่างเดียว</div>`;
  if(rr.pkr&&!ro)h+=`<div style="margin-bottom:8px"><span class="pkchip">📦 งาน Packing ใช้รถไร่ (ใบขอรถ)</span></div>`;
  if(rr.exp&&(expTotal(rr.exp)||rr.exp.note))h+='<div class="sec">💸 ค่าใช้จ่ายในเที่ยว</div><div style="margin-bottom:6px">'+EXP_ITEMS.filter(([k])=>+rr.exp[k]>0).map(([k,l])=>row(l,money(+rr.exp[k])+' บ.')).join('')+(expTotal(rr.exp)?row('<b>รวม</b>','<b>'+money(expTotal(rr.exp))+' บ.</b>'):'')+(rr.exp.note?row('หมายเหตุ',_escS(String(rr.exp.note).replace(/^"+|"+$/g,''))):'')+'</div>';
  if(place)h+=`<div style="font-size:13px;font-weight:600;margin-bottom:8px">📍 ${place}</div>`;
  if(!ro)h+=destBlock(orderId,st);
  h+='<div id="calcSt">'+calcStatus(orderId,w,live,st,isStored,pending)+'</div>';
  h+='<div class="sec">👷 ค่าแรงคนขับ</div>';
  // 🆕 2026-11-05 รูทหลายจุด: โชว์ชื่อช่วง + ชนิดรถรายขา (เดี่ยว = 10 ล้อ)
  (w.legs||[]).forEach(l=>h+=row((l.name?`<b>${_escS(l.name)}</b>${l.veh?` <span style="color:var(--txt2);font-size:11px">${l.veh==='เดี่ยว'?'10 ล้อ':_escS(l.veh)}</span>`:''}<br>`:'')+`${l.weight} ${l.distKm} กม. × ${l.pct}% ÷ 50`,money(l.runWage)+' บ.'));
  if(!ro)h+=loadEditBlock(orderId,w,res.raw,st);
  h+=row('ขึ้น-ลงของ',money(w.loadWage)+' บ.');
  if(w.tarp>0)h+=row('ค่าคลุมผ้าใบ',money(w.tarp)+' บ.');
  const via=!!(w.snapshot&&w.snapshot.toggles&&w.snapshot.toggles.viaLiters);
  // แปลงเป็นลิตร = ฮุคลิฟท์/ให้เพิ่ม ไม่จ่ายเป็นบาท แต่ไปบวกในลิตรเกณฑ์ (ดูก้อนน้ำมันด้านล่าง)
  if(!via&&w.hooklift>0)h+=row('ค่ายกกระบะ ฮุคลิฟท์',money(w.hooklift)+' บ.');
  if(!via&&w.give>0)h+=row('ให้เพิ่มตามเวลาวิ่ง ('+(+w.totalHrs).toFixed(2)+' ชม.)',money(w.give)+' บ.');
  if(w.hardship>0)h+=row('Hardship',money(w.hardship)+' บ.');
  if(w.wait>0)h+=row('ค่ารอลงของ ('+(w.waitHrs||0)+' ชม.)',money(w.wait)+' บ.');
  h+=fuelBlock(w,via,row);
  if(Number(w.bonus))h+=row('โบนัส '+(w.snapshot.bonusPct||'')+'%','+'+money(w.bonus)+' บ.');
  h+=`<div class="big"><span style="font-weight:700">ค่าแรงสุทธิ</span><span class="amt"${Number(w.wage)<0?' style="color:var(--danger)"':''}>${money(w.wage)} บ.</span></div>`;
  if(c){
    h+='<div class="sec">🏢 ต้นทุนบริษัท</div>';
    // ต้นทุนใช้ค่าแรงที่บันทึกไว้ (ตัวเดียวกับด้านบน/ตาราง) แทนค่าแรงคิดสด
    const cw=Number(w.wage)||0, ctot=Number(c.total)-Number(c.wage||0)+cw, cper=(c.qty>0)?Math.round(ctot/c.qty*100)/100:c.perUnit;
    h+=row('ค่าแรงคนขับ',money(cw)+' บ.');
    h+=row('น้ำมันต้นทุน ('+w.litersActual+'ล.×'+c.fuelPriceDaily+')',money(c.fuelCost)+' บ.');
    h+=row('ต้นทุนคงที่ (รวมค่าเสื่อม)',money(c.fixedCost)+' บ.');
    h+=row('ต้นทุนผันแปร',money(c.varCost)+' บ.');
    h+=row('ค่าดำเนินงาน',money(c.opsCost)+' บ.');
    if(c.extraCost)h+=row('ค่าใช้จ่ายรายเที่ยว',money(c.extraCost)+' บ.');
    h+=`<div class="big"><span style="font-weight:700">ต้นทุนรวม</span><span class="amt" style="color:var(--txt)">${money(ctot)} บ.</span></div>`;
    if(c.perUnit!=null)h+=row('ต่อหน่วย ('+money(c.qty)+' '+c.unit+')','<b>'+cper+'</b> บ./'+c.unit,'font-size:14px');
  }
  // 📋 ข้อมูลดิบที่คนขับกรอก — ให้แอดมินตรวจ (เลขไมล์/ดุม/น้ำหนัก/น้ำมัน/ค่าใช้จ่าย/รูป)
  if(res.raw && Object.keys(res.raw).length){
    h+='<div class="sec" style="color:var(--txt);border-top:2px solid var(--line);margin-top:16px;padding-top:12px">📋 ข้อมูลที่คนขับกรอก <span style="font-weight:400;color:var(--txt2);font-size:11px">(ตรวจสอบ)</span></div>';
    h+=renderRaw(res.raw,row);
  }
  $('drBody').innerHTML=h;
}

// จัดกลุ่มข้อมูลดิบเป็นหมวด ให้แอดมินไล่ตรวจง่าย
function renderRaw(raw,row){
  const SKIP={'Order ID':1,'Ref ID':1,'Timestamp':1,'ประเภทงาน':1,'LINE UID':1,'LINE UID คนขับ':1,'userId':1,'สถานะ':1,'ชื่อคนขับ':1,'ทะเบียนรถ':1};
  const isUrl=v=>/^https?:\/\//.test(String(v));
  const fmtN=v=>{const s=String(v).replace(/,/g,'');return (s!==''&&/^\-?\d+(\.\d+)?$/.test(s))?Number(s).toLocaleString('th-TH'):v;};
  const used={}; let h='';
  const groups=[
    {t:'🛞 เลขไมล์ / เลขดุม',      test:k=>/เลขไมล์|เลขดุม|ไมล์|ดุม/.test(k)},
    {t:'⚖️ น้ำหนัก (กก.)',        test:k=>/น้ำหนัก|สุทธิ/.test(k)},
    {t:'⛽ น้ำมัน',               test:k=>/น้ำมัน|ลิตร/.test(k)},
    {t:'💸 ค่าใช้จ่ายรายเที่ยว',   test:k=>/^ค่า|ทางด่วน|ซ่อม|ลงของ|เด็ก/.test(k)},
    {t:'🚗 สภาพรถ (เบา/หนัก)',    test:k=>/สภาพรถ/.test(k)}
  ];
  groups.forEach(g=>{
    const ks=Object.keys(raw).filter(k=>!SKIP[k]&&!used[k]&&!isUrl(raw[k])&&g.test(k));
    if(!ks.length)return;
    h+='<div class="sec" style="color:var(--txt2)">'+g.t+'</div>';
    ks.forEach(k=>{used[k]=1;h+=row(k,fmtN(raw[k]));});
  });
  // 📏 ระยะทาง — จับ ระยะเบา/ระยะหนัก/%วิ่งหนัก + คำนวณ "รวมระยะทาง"
  const distKeys=Object.keys(raw).filter(k=>!SKIP[k]&&!used[k]&&!isUrl(raw[k])&&/ระยะเบา|ระยะหนัก|%วิ่งหนัก/.test(k));
  if(distKeys.length){
    h+='<div class="sec" style="color:var(--txt2)">📏 ระยะทาง (กม.)</div>';
    let sum=0,hasDist=false;

const WA_OVER=1.05, WA_SEEN=new Set();

function waScan(){
  const rows=ROWS.filter(r=>!r.locked), rk=r=>(+r.distActual)/(+r.distCentral), rf=r=>(+r.liters)/(+r.benchLiters);
  const miss=rows.filter(r=>Array.isArray(r.routeMissing)&&r.routeMissing.length);
  const km=rows.filter(r=>+r.distCentral>0&&+r.distActual>+r.distCentral*WA_OVER).sort((a,b)=>rk(b)-rk(a));
  const fuel=rows.filter(r=>usedCentral(r)&&+r.benchLiters>0&&+r.liters>+r.benchLiters*WA_OVER).sort((a,b)=>rf(b)-rf(a));
  const ids=new Set([...miss,...km,...fuel].map(r=>r.orderId));
  return {miss,km,fuel,ids};
}

  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';

  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});

// คิดค่าแรงใหม่ตามเงื่อนไขปัจจุบัน — เฉพาะเที่ยวที่ยังไม่จ่าย (ล็อกแล้วข้าม)
//   ⚠️ แบ่งส่งเป็นก้อน (chunk) กัน request เดียวนานเกินจน Google คืนหน้า HTML error
async function recomputeUnpaid(){
  const ids=VIEW.filter(r=>!r.locked&&!r.paidBy).map(r=>r.orderId);   // เฉพาะที่แสดงอยู่ (ตามค้นหา/กรอง) · จ่ายที่กลุ่มอื่น = กลุ่มนั้นคิด
  if(!ids.length){uiAlert('ไม่มีเที่ยวที่ยังไม่จ่ายให้คิดใหม่ (ที่จ่ายแล้วจะไม่ถูกแตะ)');return;}
  if(!(await uiConfirm({title:'คำนวณค่าแรงใหม่ '+ids.length+' เที่ยว?',msg:'เฉพาะที่ยังไม่จ่าย · คิดตามตั้งค่าปัจจุบัน\nเที่ยวที่จ่ายแล้วจะไม่เปลี่ยน',okText:'คำนวณใหม่',icon:'🔄'})))return;
  const b=$('recalc');b.disabled=true;
  const CHUNK=8;
  let done=0,skipped=0,failed=0,ok=true,err='',stopped=false,sent=0;const badChunks=[];
  // ป๊อปอัปกลางจอ + เตือนก่อนปิดหน้า — คิดทีละก้อนจากเบราว์เซอร์ ปิดหน้า = ก้อนที่เหลือไม่ถูกคิด (ที่คิดแล้วเก็บไว้ · กดใหม่ต่อได้)
  const P=rcpOpen(ids.length,()=>{stopped=true;});
  const leave=e=>{e.preventDefault();e.returnValue='';return '';};
  window.addEventListener('beforeunload',leave);
  try{
    for(let i=0;i<ids.length;i+=CHUNK){
      if(stopped)break;
      const part=ids.slice(i,i+CHUNK);
      b.textContent=`กำลังคิด… ${Math.min(i+CHUNK,ids.length)}/${ids.length}`;
      P.step(i,'กำลังคิด '+(i+1)+'–'+Math.min(i+CHUNK,ids.length));
      // คิดใหม่ซ้ำได้ปลอดภัย (ผลเดิม · ที่จ่ายแล้วข้าม) → Google ตอบหน้า HTML/หลุด = ลองก้อนเดิมใหม่ 3 รอบ แล้วไปก้อนถัดไป (เดิมหยุดทั้งหมด เที่ยวที่เหลือไม่ถูกคิด)
      let d=null;
      for(let tr=1;tr<=3&&!d;tr++){
        try{ d=await recomputeApi(part); }catch(_){ d=null; }
        if(!d&&tr<3){ b.textContent=`ลองใหม่… ${Math.min(i+CHUNK,ids.length)}/${ids.length}`; P.step(i,'หลังบ้านตอบช้า กำลังลองใหม่ (ครั้งที่ '+(tr+1)+'/3)'); await new Promise(z=>setTimeout(z,2000*tr)); }
      }
      sent=i+part.length;
      if(!d){ badChunks.push(...part); P.step(sent,''); continue; }
      if(!d.ok){ ok=false; err=d.error||(d.denied?'ไม่มีสิทธิ์':'ผิดพลาด'); break; }
      done+=d.done||0; skipped+=d.skipped||0; failed+=d.failed||0;
      P.step(sent,'');
    }
  }catch(e){ ok=false; err=String(e); }
  window.removeEventListener('beforeunload',leave);
  P.close();
  b.textContent='🔄 คำนวณใหม่';b.disabled=false;
  if(!ok){ uiAlert('❌ '+err+(done?'\n(คิดสำเร็จไปแล้ว '+done+' เที่ยวก่อนหยุด)':'')); if(done)await loadReport(); return; }
  await loadReport();
  const left=ids.length-sent;   // หยุดกลางทาง = ก้อนที่ยังไม่ได้ส่ง
  uiAlert((badChunks.length||stopped?'⚠️ ':'✅ ')+(stopped?'หยุดกลางทาง · ':'')+'คิดใหม่ '+done+' เที่ยว'+(skipped?' · ข้าม(จ่ายแล้ว) '+skipped:'')+(failed?' · ล้มเหลว '+failed:'')
    +(stopped&&left>0?'\nยังไม่ได้คิด '+left+' เที่ยว (ใช้ค่าเดิม) — กด 🔄 คำนวณใหม่ เพื่อคิดต่อ':'')
    +(badChunks.length?'\nหลังบ้านไม่ตอบ '+badChunks.length+' เที่ยว — กด 🔄 คำนวณใหม่ อีกครั้ง\n('+badChunks.slice(0,6).join(', ')+(badChunks.length>6?' …':'')+')':''));
}
function rcpOpen(total,onStop){
  const ov=document.createElement('div');ov.className='rcp-ov';
  ov.innerHTML='<div class="rcp" role="alertdialog" aria-modal="true" aria-labelledby="rcpT" aria-describedby="rcpW">'
    +'<h3 id="rcpT"><span class="dring" style="width:22px;height:22px;border-width:3px;flex:none" aria-hidden="true"></span>กำลังคิดค่าแรงใหม่</h3>'
    +'<div class="num" aria-live="polite"><span id="rcpN">0</span> <small>/ '+total+' เที่ยว</small></div>'
    +'<div class="rcp-bar"><i id="rcpB"></i></div><div class="st" id="rcpS"></div>'
    +'<div class="warn" id="rcpW">⚠️ <b>อย่าเพิ่งปิดหน้านี้</b> — ถ้าปิดจะหยุดกลางทาง<br>เที่ยวที่คิดเสร็จแล้วเก็บไว้ · ที่เหลือใช้ค่าเดิม กด 🔄 คำนวณใหม่ อีกครั้งเพื่อคิดต่อได้ (คิดซ้ำไม่เสียหาย)</div>'

  return {
    step(n,msg){const v=Math.min(n,total);ov.querySelector('#rcpN').textContent=v;ov.querySelector('#rcpB').style.width=(total?v/total*100:0)+'%';ov.querySelector('#rcpS').textContent=msg||'';},

  };

async function togglePaid(orderId,checked,el){

    else{el.checked=!checked;uiAlert('❌ '+(d.error||(d.denied?'ไม่มีสิทธิ์':'ผิดพลาด')));}
  }catch(e){el.checked=!checked;uiAlert('❌ '+e);}

async function togglePaidAll(){

  if(!mine.length)return;
  const paid=!mine.every(r=>r.locked);   // ยังไม่ครบ → จ่ายทั้งหมด · ครบแล้ว → ยกเลิกทั้งหมด
  const ids=mine.map(r=>r.orderId);
  if(!(await uiConfirm({title:(paid?'ทำเครื่องหมาย "จ่ายแล้ว" ':'ยกเลิก "จ่ายแล้ว" ')+ids.length+' เที่ยว?',msg:paid?'เที่ยวที่จ่ายแล้วจะถูกล็อก ไม่ถูกคิดใหม่':'เที่ยวจะกลับไปคิดใหม่ได้',okText:paid?'จ่ายแล้ว':'ยกเลิกจ่าย',icon:paid?'☑️':'↩️',danger:!paid})))return;
  const b=$('paidAll');b.textContent='กำลังบันทึก…';b.disabled=true;
  try{
    const d=await adminWrite({action:'setWagePaidBulk',userId:MY_UID,orderIds:ids,paid});
    if(d.ok){ mine.forEach(r=>r.locked=paid); applyView(); }
    else uiAlert('❌ '+(d.error||(d.denied?'ไม่มีสิทธิ์':'ผิดพลาด')));
  }catch(e){uiAlert('❌ '+e);}
  b.disabled=false;
}

$('load').onclick=loadReport;
$('recalc').onclick=recomputeUnpaid;
$('paidAll').onclick=togglePaidAll;
// 🔎 ค้นหา (กรองตาราง+สรุป) · เริ่มพิมพ์ = ล้างการเลือกปลายทาง
$('sumSearch').addEventListener('input',e=>{SEARCH=e.target.value;ACTIVE_DEST='';applyView();});
// จิ้มการ์ดสรุป = กางรายละเอียด + กรองตารางเฉพาะปลายทางนั้น (จิ้มชิป/การ์ดที่เลือกอยู่ = ล้าง)
$('summary').addEventListener('click',e=>{
  if(e.target.closest('.sumfilter')){ pickDest(ACTIVE_DEST); return; }
  const c=e.target.closest('.sumcard');
  if(c&&c.dataset.dest) pickDest(c.dataset.dest);
});

/* ═════ 🧭 เลือกกลุ่มค่าแรง + PIN ส่วนตัว (2026-10-14 คุณน้องสั่ง) ═════
 * DEV = ทุกกลุ่ม · แอดมินตามประเภท (ADMIN=ไร่ · ADMIN_BULK=Bulk · ADMIN_PK=Packing · MANAGER/EXECUTIVE=ทุกกลุ่ม)
 * สิทธิ์จริงตรวจที่ Edge (admin-perms getPinInfo + ssb-read getWageReport group) · PIN ครั้งแรกแอดมินตั้งเอง */
const WG={'ไร่':{ic:'🌴',t:'ไร่',d:'คนขับรถไร่ · งานรับปาล์ม'},Bulk:{ic:'🏭',t:'Bulk',d:'คนขับกลุ่ม Bulk'},Packing:{ic:'📦',t:'Packing',d:'คนขับกลุ่ม Packing'}};
let PIN_INFO=null; window.WAGE_GROUP='';
function lastGroup(){try{return localStorage.getItem('ssb_wage_group')||'';}catch(e){return '';}}
function gpMsg(t){$('gpHi').textContent=t;$('gpSub').textContent='';$('gpGrid').innerHTML='';}
function showPicker(){
  WA_BACK=false; waClose();
  $('mainWrap').hidden=true; $('gp').hidden=false; closeDr&&closeDr();
  const allow=(PIN_INFO&&PIN_INFO.groups)||[], last=lastGroup();
  $('gpGrid').innerHTML=Object.keys(WG).map(k=>{const g=WG[k],ok=allow.includes(k),isLast=ok&&k===last;
    return '<button type="button" class="gpc'+(ok?'':' lock')+(isLast?' last':'')+'"'+(ok?'':' disabled aria-disabled="true"')+' onclick="pickGroup(\''+k+'\')">'
      +'<span class="gpi" aria-hidden="true">'+g.ic+'</span><b>'+g.t+'</b><small>'+(ok?g.d:'🔒 ไม่มีสิทธิ์ดูกลุ่มนี้')+'</small>'+(isLast?'<em>ใช้ล่าสุด</em>':'')+'</button>';}).join('');
  $('gpNote').textContent=allow.length===3?'คุณดูได้ทุกกลุ่ม':'คุณดูได้เฉพาะกลุ่ม '+allow.join(', ')+' (ตามประเภทแอดมิน)';
}
async function pickGroup(k){
  if(!((PIN_INFO&&PIN_INFO.groups)||[]).includes(k))return;
  if(!(await ssbAdminPin(MY_UID,{text:'รายงานค่าแรง'})))return;
  const changed=window.WAGE_GROUP!==k;
  window.WAGE_GROUP=k; try{localStorage.setItem('ssb_wage_group',k);}catch(e){}
  $('gp').hidden=true; $('mainWrap').hidden=false;
  $('grpChip').innerHTML=WG[k].ic+' '+WG[k].t+' <span>· เปลี่ยน</span>';
  if(changed||!ROWS.length){ ROWS=[]; VIEW=[]; $('driver').value=''; loadReport(); }
}

(function initDates(){
  const t=new Date(), y=new Date(t.getFullYear(),t.getMonth()-1,t.getDate());
  $('to').value=t.toISOString().slice(0,10);
  $('from').value=y.toISOString().slice(0,10);
})();

(async function(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const p=await liff.getProfile();
    MY_UID=p.userId||'';
    if(window.uiProfile)uiProfile({name:p.displayName,picture:p.pictureUrl,uid:MY_UID,status:'checking'});   // 👤 ปุ่มโปรไฟล์/ออกจากระบบ
    if(!MY_UID){gpMsg('ไม่พบ LINE UID — เปิดผ่าน LINE อีกครั้ง');return;}
    if(p.pictureUrl){$('gpAv').innerHTML='<img class="gpav" alt="" src="'+_escS(p.pictureUrl)+'">';}
    try{ PIN_INFO=await ssbAdminPinInfo(MY_UID); }catch(e){}
    if(!PIN_INFO||!PIN_INFO.ok){gpMsg('ตรวจสิทธิ์ไม่สำเร็จ — ลองเปิดหน้านี้ใหม่');return;}
    if(!PIN_INFO.isAdmin){if(window.uiProfile)uiProfile.set({status:'denied'});gpMsg('ไม่มีสิทธิ์เข้าถึง (เฉพาะแอดมิน)');return;}
    if(window.uiProfile)uiProfile.set({status:'admin'});   // จุดสถานะบนปุ่มโปรไฟล์ = เขียว ตั้งแต่ผ่านตรวจสิทธิ์
    $('gpHi').textContent='สวัสดี '+(p.displayName||'');
    showPicker();
  }catch(e){gpMsg('LIFF error: '+e);}
})();
</script>
