<title>Developer · SSB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="ssb-read.js?v=20261008h"></script>
<script src="ssb-ui.js?v=20261008h"></script>
<style>
  :root{
    --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F6F8F5; --surface-3:#EDF2ED;
    --ink:#15241D; --ink-soft:#5B6B63; --ink-faint:#8A988F;
    --line:#E1E7E0; --line-strong:#CDD6CD;
    --pine:#0E7C66; --pine-deep:#0A5C4C; --gold:#B7892A;
    --green:#157A40; --green-bg:#DCF3E3; --amber:#9A5B0B; --amber-bg:#FDF0D8;
    --red:#A91F12; --red-bg:#FBE4E1; --blue:#1D5FA8; --blue-bg:#E3EEFB;
    --dev:#9A3412; --dev-bg:#FFEDD5;
    --g-farm:#157A40; --g-farm-bg:#DCF3E3; --g-pk:#0E7490; --g-pk-bg:#DEF2F6; --g-bulk:#C2410C; --g-bulk-bg:#FDEBDD;
    --shadow:0 1px 2px rgba(21,36,29,.04), 0 8px 24px rgba(21,36,29,.06);
    --lift:0 18px 50px rgba(10,40,28,.18);
    --sans:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',system-ui,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono','Cascadia Mono',ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0D1512;--surface:#152019;--surface-2:#1B2721;--surface-3:#22302A;
    --ink:#E4EDE7;--ink-soft:#A2B3A9;--ink-faint:#75887E;--line:#25332C;--line-strong:#33443B;
    --pine:#3FA98F;--gold:#D7A845;--green:#3FBE72;--green-bg:#123222;--amber:#E5A54B;--amber-bg:#33240D;
    --red:#F08A7C;--red-bg:#3A1A16;--blue:#7DB3F0;--blue-bg:#14253A;--dev:#FDBA74;--dev-bg:#3A1F0E;
    --g-farm:#3FBE72;--g-farm-bg:#123222;--g-pk:#4FB6CE;--g-pk-bg:#102A31;--g-bulk:#F59E57;--g-bulk-bg:#33190A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--lift:0 18px 50px rgba(0,0,0,.6);}}
  :root[data-theme="dark"]{
    --bg:#0D1512;--surface:#152019;--surface-2:#1B2721;--surface-3:#22302A;
    --ink:#E4EDE7;--ink-soft:#A2B3A9;--ink-faint:#75887E;--line:#25332C;--line-strong:#33443B;
    --pine:#3FA98F;--gold:#D7A845;--green:#3FBE72;--green-bg:#123222;--amber:#E5A54B;--amber-bg:#33240D;
    --red:#F08A7C;--red-bg:#3A1A16;--blue:#7DB3F0;--blue-bg:#14253A;--dev:#FDBA74;--dev-bg:#3A1F0E;
    --g-farm:#3FBE72;--g-farm-bg:#123222;--g-pk:#4FB6CE;--g-pk-bg:#102A31;--g-bulk:#F59E57;--g-bulk-bg:#33190A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--lift:0 18px 50px rgba(0,0,0,.6);}

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
  button{font-family:inherit}

  header{background:var(--pine-deep);color:#EAF3EF;border-bottom:3px solid var(--gold)}
  .bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FC9B9;font-weight:600}
  .bar h1{font-size:20px;font-weight:700}
  .spacer{flex:1}
  .devtag{font-size:11px;font-weight:800;letter-spacing:.08em;background:#FDBA74;color:#7C2D12;padding:4px 11px;border-radius:999px}
  .backbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#EAF3EF;background:rgba(255,255,255,.12);border:1px solid rgba(143,201,185,.4);border-radius:10px;padding:8px 13px;cursor:pointer}
  .backbtn:hover{background:rgba(255,255,255,.22)}
  main{max-width:1180px;margin:0 auto;padding:18px 20px 40px}

  .hint{display:flex;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--dev);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .hint b{color:var(--ink)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer}
  .chip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:4px}
  .chip.on{background:var(--pine-deep);border-color:var(--pine-deep);color:#fff}
  .chip.on .n{color:#BFE3D8}
  .search{flex:1;min-width:180px;padding:8px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
  .search::placeholder{color:var(--ink-faint);font-size:13px}
  .ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}

  .list{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media(max-width:980px){.list{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.list{grid-template-columns:1fr}}
  .card{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:11px;align-items:center;cursor:pointer;position:relative;overflow:hidden;transition:.14s;color:var(--ink)}
  .card:hover{border-color:var(--pine);transform:translateY(-2px);box-shadow:var(--lift)}
  .card .edge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc)}
  .av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--gc);flex:none}
  .who{flex:1;min-width:0}
  .who .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .sb{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
  .gb{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gbg);color:var(--gc);margin-right:4px}
  .act{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-bg);color:var(--amber);flex:none}
  .act.z{background:var(--surface-3);color:var(--ink-faint);font-weight:500}
  .empty{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:14px}

  #scrim{position:fixed;inset:0;background:rgba(9,22,17,.5);opacity:0;pointer-events:none;transition:.22s;z-index:50}
  #scrim.on{opacity:1;pointer-events:auto}
  #dw{position:fixed;top:0;right:0;height:100%;width:520px;max-width:96vw;background:var(--bg);z-index:60;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);overflow-y:auto;box-shadow:var(--lift)}
  #dw.on{transform:none}
  .dwhead{position:sticky;top:0;background:var(--pine-deep);color:#EAF3EF;padding:15px 18px 16px;border-bottom:3px solid var(--gold);z-index:2}
  .dwhead .top{display:flex;gap:12px;align-items:flex-start}
  .dwhead h2{font-size:17px;font-weight:700;flex:1}
  .dwhead .sub{font-size:12px;color:#BFE3D8;margin-top:4px}
  .xbtn{background:rgba(255,255,255,.12);border:1px solid rgba(143,201,185,.4);color:#EAF3EF;width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;flex:none}
  .jobs{padding:14px 16px 30px;display:flex;flex-direction:column;gap:9px}
  .jh{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);margin:6px 2px 0;display:flex;gap:8px;align-items:center}
  .jh::after{content:"";flex:1;height:1px;background:var(--line)}
  .job{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--ink);transition:.12s}
  .job:hover{border-color:var(--pine);box-shadow:var(--shadow)}
  .job .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .job .oid{font-family:var(--mono);font-size:13px;font-weight:700}
  .job .r2{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .job .r3{font-size:11.5px;color:var(--ink-faint);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}
  .pill.done{background:var(--green-bg);color:var(--green)}
  .pill.cx{background:var(--red-bg);color:var(--red)}
  .pill.run{background:var(--amber-bg);color:var(--amber)}
  .pill.lock{background:var(--red-bg);color:var(--red)}

  /* ── หน้าดูงาน ── */
  #jv{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
  #jv.on{display:flex}
  .jvhead{background:var(--pine-deep);color:#EAF3EF;border-bottom:3px solid var(--gold);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .jvhead h2{font-size:16px;font-weight:700}
  .jvhead .sub{font-size:12px;color:#BFE3D8}
  .jvbody{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr;gap:0}
  .phone{border-right:1px solid var(--line);background:var(--surface-3);display:flex;flex-direction:column;min-height:0}
  .phone .ph-bar{font-size:11.5px;color:var(--ink-soft);padding:7px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .phone iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
  .phone .off{padding:30px 22px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.7}
  .panel{overflow-y:auto;min-height:0;padding:14px 18px 0}
  @media(max-width:860px){.jvbody{grid-template-columns:1fr;overflow-y:auto}.phone{height:72vh;border-right:0;border-bottom:1px solid var(--line)}.panel{overflow:visible}}

  .sec{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:12px}
  .sec h3{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--ink-faint);margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .sec h3 .r{margin-left:auto;font-weight:500;letter-spacing:0;font-size:11.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11.5px;color:var(--ink-soft)}
  .f input,.f select,.f textarea{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%}
  .f input.num{font-family:var(--mono)}
  .f input::placeholder{color:var(--ink-faint);font-size:12px}
  .f.chg input,.f.chg select,.f.chg textarea{border-color:var(--dev);background:var(--dev-bg);box-shadow:0 0 0 1px var(--dev)}
  .f .was{font-size:10.5px;color:var(--dev);font-family:var(--mono)}
  table.pts{width:100%;border-collapse:collapse;font-size:13px}
  table.pts th{font-size:11px;font-weight:600;color:var(--ink-faint);text-align:left;padding:4px 6px}
  table.pts td{padding:4px 6px;vertical-align:top}
  table.pts td:first-child{white-space:nowrap;font-weight:600;font-size:12.5px;padding-top:11px}
  .calc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .kv{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  .kv b{font-family:var(--mono)}
  .note{font-size:11.5px;color:var(--ink-faint);margin-top:8px;line-height:1.6}
  .warnbox{display:flex;gap:10px;background:var(--red-bg);border-left:3px solid var(--red);border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px;line-height:1.6}
  .warnbox b{color:var(--red)}
  .stop{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--surface-2);font-size:13px}
  .stop .sq{font-family:var(--mono);font-weight:700;width:22px;text-align:center;color:var(--ink-faint)}
  .stop .nm{flex:1;min-width:0}
  .stop .tg{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--green-bg);color:var(--green)}
  .stop .tg.new{background:var(--dev-bg);color:var(--dev)}
  .ib{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px}
  .ib:disabled{opacity:.35;cursor:not-allowed}
  .sres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .sres button{text-align:left;font-size:12.5px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  .sres button:hover{border-color:var(--pine)}
  .hist{font-size:12px;border-top:1px solid var(--line);padding:8px 0}
  .hist:first-of-type{border-top:0}
  .hist .hd{display:flex;gap:8px;flex-wrap:wrap;color:var(--ink-soft)}
  .hist .hd b{color:var(--ink)}
  .hist .ch{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:3px;word-break:break-word}
  .savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:11px 0 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 -18px;padding-left:18px;padding-right:18px}
  .savebar input{flex:1;min-width:200px;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);color:var(--ink)}
  .btn{font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:10px;border:0;background:var(--dev);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);font-weight:500}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .chgn{font-size:12px;color:var(--dev);font-weight:700}
  /* ── ที่มาเช็คอิน / เวลาถึงแต่ละจุด / พิกัดรถ (12 พ.ย.) ── */
  .src{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--ink-soft)}
  .src.gps{background:var(--green-bg);color:var(--green)}
  .src.man{background:var(--amber-bg);color:var(--amber)}
  .src.no{background:var(--red-bg);color:var(--red)}
  .mini{font-size:11.5px;color:var(--ink-faint)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .cki{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
  .cki .gpsres{flex-basis:100%}
  .arow{display:flex;gap:10px;padding:9px 4px;border-top:1px solid var(--line);font-size:13px}
  .arow:first-of-type{border-top:0}
  .arow .sq{font-family:var(--mono);font-weight:700;color:var(--ink-faint);width:20px;text-align:center;flex:none;padding-top:1px}
  .arow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .gbox{font-size:12.5px;line-height:1.7;border-radius:9px;padding:8px 11px;border-left:3px solid var(--line-strong);background:var(--surface-2)}
  .gbox.gps{border-left-color:var(--green);background:var(--green-bg)}
  .gbox.man{border-left-color:var(--amber);background:var(--amber-bg)}
  .gbox.no{border-left-color:var(--red);background:var(--red-bg)}
  .gbox a{color:var(--blue);font-weight:600;margin-left:8px;white-space:nowrap}

  /* ── 25 พ.ย. แถบเมนูซ้ายกระจกเขียว (คนขับ / คนสวน / ทีมตัด) — skill webapp-glass-sidebar ใช้สี SSB ── */
  :root{--glass:rgba(255,255,255,.6);--glass-2:rgba(255,255,255,.82);--glass-line:rgba(255,255,255,.9);
    --glass-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -22px rgba(10,92,76,.38),0 2px 6px -3px rgba(10,92,76,.12);
    --blob1:#A7DCC6;--blob2:#F1DDA6;--tg-bg:#fff;--tg-ink:#15241D}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(21,32,25,.58);--glass-2:rgba(27,39,33,.86);--glass-line:rgba(120,200,170,.15);
    --glass-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -24px rgba(0,0,0,.8);--blob1:#0F4D3C;--blob2:#4A3A12;--tg-bg:#E4EDE7;--tg-ink:#0D1512}}
  :root[data-theme="dark"]{--glass:rgba(21,32,25,.58);--glass-2:rgba(27,39,33,.86);--glass-line:rgba(120,200,170,.15);
    --glass-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 44px -24px rgba(0,0,0,.8);--blob1:#0F4D3C;--blob2:#4A3A12;--tg-bg:#E4EDE7;--tg-ink:#0D1512}
  body::before,body::after{content:'';position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
  body::before{width:42vw;height:42vw;left:-12vw;top:4vw;background:radial-gradient(circle,var(--blob1),transparent 68%)}
  body::after{width:46vw;height:46vw;right:-16vw;bottom:-18vw;background:radial-gradient(circle,var(--blob2),transparent 66%)}
  .dash{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1440px;margin:0 auto;position:relative;isolation:isolate}
  .dash>main{max-width:none;margin:0;min-width:0}
  .side{position:sticky;top:14px;align-self:start;z-index:5;margin:18px 0 18px 14px;max-height:calc(100vh - 28px);border-radius:26px;padding:18px 14px 14px;
    display:flex;flex-direction:column;overflow:visible;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);padding:2px 6px 14px;white-space:nowrap}
  .brand .logo{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;
    background:linear-gradient(135deg,#3FA98F,#0A5C4C 65%,#073F34);box-shadow:0 6px 14px -6px rgba(10,92,76,.75),0 1px 0 rgba(255,255,255,.45) inset}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-faint);margin-top:1px}
  .nsec{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);padding:0 8px 6px;white-space:nowrap}
  .side nav{display:flex;flex-direction:column;overflow:auto;scrollbar-width:none;padding:6px 8px 10px;margin:0 -8px}
  .side nav::-webkit-scrollbar{display:none}
  .rtab{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;padding:10px 12px;margin-bottom:5px;border-radius:14px;
    border:1px solid transparent;background:none;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
    transition:background .2s,color .2s,transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
  .rtab .ic{width:20px;flex:none;text-align:center;font-size:17px;line-height:1}
  .rtab .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .rtab .tx b{font-size:14px;font-weight:700;color:var(--ink)}
  .rtab .tx small{font-size:11px;font-weight:500;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis}
  .rtab .bd{flex:none;min-width:22px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--amber-bg);color:var(--amber)}
  .rtab .bd.z{background:var(--surface-3);color:var(--ink-faint);font-weight:500}
  .rtab:hover{background:var(--glass-2);transform:translateX(3px);box-shadow:0 6px 16px -10px rgba(10,92,76,.35)}

const normV=(k,v)=>{ v=String(v??'').trim(); if(/^lw\.(mile|hub|weight|fuel|toll|external|unload|helper|hooklift|overnight|price|total)/.test(k) && v!=='' && !isNaN(v.replace(/,/g,''))) return String(Number(v.replace(/,/g,''))); return v; };

/* 💵 ช่องเงินคิดให้เองเมื่อแก้ตัวคูณ (คุณน้อง 13 พ.ย.) · ลิตร × ราคา / สุทธิ × ราคา/กก. ปัดเป็นบาทเต็ม

const AUTO_MONEY={'lw.fuel_total_road':['lw.fuel_liter_road','lw.fuel_price_road'],'lw.total_amount':['lw.weight_net_customer','lw.price_per_kg']};
function autoMoney(k){
  Object.entries(AUTO_MONEY).forEach(([out,[a,b]])=>{
    if(k!==a&&k!==b) return;
    const ea=document.querySelector(`#panel [data-k="${a}"]`), eb=document.querySelector(`#panel [data-k="${b}"]`), eo=document.querySelector(`#panel [data-k="${out}"]`);
    if(!ea||!eb||!eo) return;
    const num=e=>{ const s=e.value.replace(/,/g,'').trim(); return s===''||isNaN(s)?null:Number(s); };
    const x=num(ea), y=num(eb);
    let v;
    if(x!=null&&y!=null) v=String(Math.round(x*y));   // ปัดเป็นบาทเต็ม (คุณน้องเลือก 13 พ.ย.) · แก้ทับเองได้
    else if(ea.value.trim()===''&&eb.value.trim()==='') v='';
    else return;   // พิมพ์ยังไม่ครบ/ไม่ใช่ตัวเลข → ไม่แตะ
    if(eo.value===v) return;
    eo.value=v; const f=eo.closest('.f'), o=f.dataset.orig, ch=normV(out,v)!==normV(out,o);
    f.classList.toggle('chg',ch); f.querySelector('.was').textContent=ch?('เดิม: '+(o===''?'—':o)+' · คิดให้อัตโนมัติ'):'';
  });
}

}

/* ── 🎭 สลับโรล (เฟส 2 · 27 พ.ย. คุณน้องเคาะ) ──
   เล่นเป็นแอดมินชนิดอื่นจริงชั่วคราว: แจ้งเตือน LINE · ริชเมนู · หน้าเว็บ ตามโรลนั้น · สิทธิ์ DEV ปิดจนกลับเป็น DEV · ไม่ต้อง PIN
   ⚠️ ตรงกับ Edge dev-drivers roleState/playRole · ในไลน์พิมพ์ "โรล" ได้การ์ดเดียวกัน */
let RST=null;
function roleHtml(r){
  if(!r||!r.ok) return `<div class="empty">${esc((r&&r.error)||'โหลดไม่สำเร็จ')}</div>`;
  const cur=r.current;
  return `<div class="dvs">
    <div class="rp-now"><span class="ic" aria-hidden="true">${r.icon||'👤'}</span><span><small>ตอนนี้เป็น</small><b>${esc(r.label)}</b>${r.playing?'<em>เล่นโรลอยู่</em>':''}</span></div>
    ${r.playing?`<button class="dvs-save" type="button" onclick="playRole('DEV',this)">🛠️ กลับเป็น DEV</button>`:''}
    ${r.canPlay?(r.roles||[]).map(x=>`<button class="dvs-opt rp-opt${x.type===cur?' on':''}" type="button"${x.type===cur?' disabled':''} onclick="playRole('${x.type}',this)">
        <span class="ic" aria-hidden="true">${x.icon}</span><span><b>${esc(x.label)}</b><small>${x.type===cur?'กำลังเล่นโรลนี้':'แตะเพื่อเล่นเป็นโรลนี้'}</small></span></button>`).join('')
      :`<div class="dvs-warn">บัญชีนี้ยังไม่ใช่ชนิด DEV — เล่นโรลไม่ได้</div>`}
    <div class="dvs-note">เล่นโรล = เป็นแอดมินชนิดนั้นจริงชั่วคราว: <b>แจ้งเตือน LINE · ริชเมนู · หน้าเว็บ</b> ตามโรลนี้ · สิทธิ์ DEV (หน้านี้/ค่ากลาง/สิทธิ์แอดมิน) ปิดไว้จนกลับเป็น DEV<br>
      ข้อความเฉพาะ DEV ยังได้เสมอ · บัญชีคนขับ = ปิดคนขับชั่วคราว · ในไลน์พิมพ์ <b>"โรล"</b> เพื่อสลับ/กลับได้ทุกเมื่อ · หน้าเว็บที่เปิดค้างไว้ให้รีเฟรช</div></div>`;
}
async function openRolePanel(){
  $('#dw').innerHTML=`<div class="dwhead"><div class="top"><h2>🎭 สลับโรล</h2><button class="xbtn" onclick="closeDw()" aria-label="ปิด">✕</button></div>
    <div class="sub">เล่นเป็นแอดมินชนิดอื่น · เฉพาะบัญชีนี้</div></div><div id="rpBody">${ldr('กำลังโหลด…')}</div>`;
  $('#dw').classList.add('on'); $('#scrim').classList.add('on'); document.body.style.overflow='hidden';
  let r; try{ r=await apiGet({action:'roleState'}); }catch(e){ r={ok:false,error:'โหลดไม่สำเร็จ'}; }
  RST=r; if($('#rpBody')) $('#rpBody').innerHTML=roleHtml(r);
}
async function playRole(to,btn){
  if(BUSY) return;
  const lab=to==='DEV'?'DEV':(((RST&&RST.roles)||[]).find(x=>x.type===to)||{}).label||to;
  const msg=to==='DEV'?'คืนสิทธิ์ DEV · แจ้งเตือนกลับมาตามที่ติ๊ก · ริชเมนูเดิม'
    :`แจ้งเตือน LINE · ริชเมนู · หน้าเว็บ จะเป็นแบบ ${lab}\nสิทธิ์ DEV ปิดชั่วคราว — กลับได้จากหน้านี้ หรือพิมพ์ "โรล" ในไลน์`;
  if(!(await ssbConfirm({icon:'🎭',title:to==='DEV'?'กลับเป็น DEV':'เล่นเป็น '+lab,msg,okText:'ยืนยัน'}))) return;
  BUSY=true; if(btn) btn.disabled=true;
  try{
    const d=await apiPost({action:'playRole',to});
    BUSY=false;
    if(d&&d.ok){ toast((d.same?'เป็น ':'เปลี่ยนเป็น ')+d.label+(d.menu?' · ริชเมนู: '+d.menu:'')); setTimeout(()=>location.reload(),900); return; }
    await ssbAlert('❌ สลับไม่สำเร็จ\n'+((d&&d.error)||'ไม่ทราบสาเหตุ'));
  }catch(e){ BUSY=false; await ssbAlert('❌ สลับไม่สำเร็จ\n'+e); }
  if(btn) btn.disabled=false;
}

/* ── บันทึก ── */
async function save(){
  if(BUSY||!JOB) return;
  let ch=changes();
  const o=JOB.order, stNew=($('#f_order__status')||{}).value;
  // ถอยสถานะ → ล้างเวลาขั้นหลัง
  const iOld=FLOW.findIndex(x=>x[0]===o.status), iNew=FLOW.findIndex(x=>x[0]===stNew);
  if(stNew!==o.status && $('#clrLater').checked && iNew>=0 && iOld>=0 && iNew<iOld){
    FLOW.slice(iNew+1).forEach(([,k])=>{ const el=$('#f_order__'+k); if(el && el.value.trim()){ el.value=''; mark(el); } });
    ch=changes();
  }
  const stCh=stopsChanged();
  if(!ch.length && !stCh) return toast('ยังไม่มีการแก้');
  const why=$('#why').value.trim(); if(!why){ $('#why').focus(); return toast('กรุณาใส่เหตุผลที่แก้',true); }
  const warn=[];
  if(iNew>=0 && stNew!==o.status){ const k=FLOW[iNew][1], el=$('#f_order__'+k); if(el && !el.value.trim()) warn.push(`สถานะ "${stJ(stNew)}" ยังไม่มี${lbl(k)}`); }
  if(iNew<iOld && iNew>=0) warn.push('ถอยสถานะ — ฟอร์มคนขับจะกลับไปขั้นก่อนหน้า');
  const lines=ch.map(c=>c.k==='order.status'?`• สถานะ: ${stJ(c.from)||'—'} → ${stJ(c.to)}`:`• ${lbl(c.k.split('.')[1])}: ${c.from||'—'} → ${c.to||'(ว่าง)'}`);
  if(stCh) lines.push(`• จุดส่ง: ${STOPS.map(s=>s.name).join(' › ')}`);
  // 🆕 12 พ.ย. ไม่ได้เลือกสถานะเอง + กรอกช่องของขั้นถัดไป → เซิร์ฟเวอร์เลื่อนสถานะให้ (ฟอร์มคนขับปิดขั้นนั้น) · ⚠️ ตรงกับ Edge dev-drivers AUTO_ST
  if(stNew===o.status && iOld>=0){
    let iTo=iOld;
    ch.forEach(c=>{ const st=AUTO_ST[c.k.split('.')[1]]; if(st && String(c.to||'').trim()) iTo=Math.max(iTo,FLOW.findIndex(x=>x[0]===st)); });
    if(iTo>iOld) lines.push(`• สถานะ: ${stJ(o.status)} → ${stJ(FLOW[iTo][0])} (เลื่อนอัตโนมัติ · ฟอร์มคนขับจะปิดขั้นนี้)`);
  }
  if(!(await ssbConfirm({icon:'🛠️',title:`ยืนยันแก้ ${o.order_id}`,msg:lines.join('\n')+'\n\nเหตุผล: '+why,warn:warn.join(' · ')||undefined,okText:'บันทึก'}))) return;
  if(!(await ensurePin())) return;
  const body={action:'save',pin:PIN,orderId:o.order_id,reason:why,order:{},lw:{}};
  ch.forEach(c=>{ const [g,k]=c.k.split('.'); body[g][k]=c.to; });
  if(stCh) body.stops=STOPS.map(s=>s.keep!=null?{keep:s.keep}:{station_id:s.station_id});
  BUSY=true; const b=$('#saveBtn'); b.disabled=true; b.textContent='กำลังบันทึก…';
  try{
    const d=await apiPost(body);
    if(d&&d.ok){
      const w=d.wage||{};
      await ssbAlert({icon:'✅',title:'บันทึกแล้ว',msg:`แก้ ${d.changed.order.length+d.changed.lw.length}${d.changed.stops?' ช่อง + จุดส่ง':' ช่อง'}`+(d.autoStatus?`\nสถานะเลื่อนเป็น "${stJ(d.autoStatus)}" อัตโนมัติ`:'')+`\nค่าแรง: ${d.wageBefore??'—'} → ${d.wageAfter??'—'}`
        +(w.skipped?`\n(${w.reason||'ไม่ได้คิดค่าแรงใหม่'})`:w.ok===false?`\n⚠️ คิดค่าแรงไม่สำเร็จ: ${w.error||''}`:'')});
      BUSY=false; return openJob(o.order_id);
    }
    if(d&&(d.pinBad||d.pinRequired||d.pinLocked)) PIN='';
    await ssbAlert('❌ บันทึกไม่สำเร็จ\n'+((d&&d.error)||'ไม่ทราบสาเหตุ'));
  }catch(e){ await ssbAlert('❌ บันทึกไม่สำเร็จ\n'+e); }
  BUSY=false; b.disabled=false; b.textContent='💾 บันทึก';
}

(async function(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
    const p=await liff.getProfile(); MY_UID=p.userId||'';
    if(!MY_UID){ $('#gate').innerHTML='<div class="box"><div class="deny">⚠️</div><h2>ไม่พบ LINE UID</h2><p>เปิดผ่านแอป LINE อีกครั้ง</p></div>'; return; }
    load();
  }catch(e){ $('#gate').innerHTML='<div class="box"><div class="deny">⚠️</div><h2>เชื่อมต่อ LINE ไม่สำเร็จ</h2><p>'+esc(e)+'</p></div>'; }
})();
</script>
