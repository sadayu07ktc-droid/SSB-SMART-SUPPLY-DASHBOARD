<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex">
<title>แพลนรถ Packing ประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: แถบหัวเขียว SSB + แท็บ 3 หน้า (แพลน / เด็กรถ / สรุปสถานะรถ) · แพลน = รายการรถตามกลุ่มล้อเหมือนใบงาน แก้ทีละคันในลิ้นชักขวา */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#F4F7F4; --ink:#14261C; --muted:#5D6E63; --line:#D7E1D9;
  --head:#1B4332; --head-ink:#F3F7F4; --brand:#1F6B48; --brand-ink:#FFFFFF; --gold:#C9A227; --gold-ink:#5B4600;
  --good:#17703F; --goodbg:#E2F2E7; --bad:#B42318; --badbg:#FCEBE9; --warn:#9A5B06; --warnbg:#FFF2D8;
  --idle:#5D6E63; --idlebg:#ECF0ED; --info:#1E4FA3; --infobg:#E6EEFA; --shadow:rgba(20,38,28,.10);
  --chat:#8DA9C9; --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif; --body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1611; --surface:#14211A; --surface2:#1A2A21; --ink:#E4EDE7; --muted:#9AAEA1; --line:#2A3C31;
  --head:#123023; --head-ink:#E9F2EC; --brand:#3C8F66; --brand-ink:#FFFFFF; --gold:#D9B743; --gold-ink:#F4E3A6;
  --good:#6BCB93; --goodbg:#173326; --bad:#F2877C; --badbg:#3A1C19; --warn:#F0B95A; --warnbg:#3A2C12;
  --idle:#9AAEA1; --idlebg:#1E2C24; --info:#8DB2F2; --infobg:#18263F; --shadow:rgba(0,0,0,.45); --chat:#2C3D52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#14211A; --surface2:#1A2A21; --ink:#E4EDE7; --muted:#9AAEA1; --line:#2A3C31;
  --head:#123023; --head-ink:#E9F2EC; --brand:#3C8F66; --brand-ink:#FFFFFF; --gold:#D9B743; --gold-ink:#F4E3A6;
  --good:#6BCB93; --goodbg:#173326; --bad:#F2877C; --badbg:#3A1C19; --warn:#F0B95A; --warnbg:#3A2C12;
  --idle:#9AAEA1; --idlebg:#1E2C24; --info:#8DB2F2; --infobg:#18263F; --shadow:rgba(0,0,0,.45); --chat:#2C3D52; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--head);color:var(--head-ink);padding-block:16px 0}
.top h1{font-family:var(--display);font-size:22px;margin:0;font-weight:700;letter-spacing:.01em}
.top .row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top .sub{opacity:.78;font-size:13px}
.datebox{display:flex;align-items:center;gap:8px;font-size:13px}
.hrow{display:flex;align-items:center;gap:14px;min-width:0}
.homeb{display:inline-flex;flex-direction:column;align-items:center;gap:1px;flex:none;padding:6px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--head-ink) 28%,transparent);color:var(--head-ink);text-decoration:none;font-size:11px;font-weight:600;line-height:1.1}
.homeb:hover{background:color-mix(in srgb,var(--head-ink) 12%,transparent)}
.homeb:focus-visible{outline:2px solid var(--head-ink);outline-offset:2px}
.datebox input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:5px 8px;color:var(--head-ink);color-scheme:dark}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:var(--head-ink);text-decoration:none;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:600;white-space:nowrap;opacity:.75}
.tabs a.on{background:var(--bg);color:var(--ink);opacity:1}
.tabs a:hover{opacity:1}
.demo{margin:14px 0 0;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
main{padding-block:14px 120px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.grp{margin-top:18px}
.grp h2{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.grp h2 span{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vr{display:grid;grid-template-columns:28px minmax(150px,1.15fr) minmax(140px,1fr) minmax(150px,1.1fr) minmax(200px,1.7fr) 112px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.vr:first-child{border-top:0}
.vr:hover{background:var(--surface2)}
.vr .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.plate{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.plate small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.cell{min-width:0;font-size:13.5px}
.cell .k{display:none;color:var(--muted);font-size:12px}
.cell .m{color:var(--muted);font-size:12.5px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-job{background:var(--goodbg);color:var(--good)} .p-wait{background:var(--idlebg);color:var(--idle)}
.p-rep{background:var(--badbg);color:var(--bad)} .p-nod{background:var(--warnbg);color:var(--warn)}
.p-tail{background:var(--warnbg);color:var(--gold-ink)} .p-long{background:var(--infobg);color:var(--info)}
.warn{color:var(--warn);font-size:12.5px}
.tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);margin-left:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -16px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
/* 📋 Pending ยี่ปั๊ว (ออเดอร์จากกลุ่มไลน์ เซลส์แอดมิน) */
.barl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.btn.yp{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-color:color-mix(in srgb,var(--gold) 55%,var(--line));color:var(--ink);white-space:nowrap}
.btn.yp b{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--line);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.btn.yp b.on{background:var(--bad);color:#fff}
.yptab{display:flex;gap:6px;flex-wrap:wrap}
.yptab button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.yptab button.on{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.yptab b{font-variant-numeric:tabular-nums;margin-left:3px}
.ypc .yph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ypc .yph b{font-size:16px}
.ypm{display:flex;gap:6px;flex-wrap:wrap}
.ypm span{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface2);border:1px solid var(--line)}
.ypm .w{background:var(--warnbg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.ypm .g{background:var(--goodbg);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.ypm .i{background:var(--infobg);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.ypc details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.ypc pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin:6px 0 0}
.ypa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ypa label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.ypb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tchip.ypk{background:var(--infobg);color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent);font-size:12px;vertical-align:2px}
.ypm .r{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.ypcoa{font-size:13px;background:var(--badbg);color:var(--bad);border-radius:8px;padding:7px 10px;line-height:1.6;margin-top:6px}
.tchip.coa{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.yppk{font-size:13px;background:var(--infobg);color:var(--info);border-radius:8px;padding:7px 10px;line-height:1.6}
.ypc details.ypalt>summary{margin-top:2px}
.ypban{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
@media(max-width:560px){.ypa{grid-template-columns:1fr}}
/* ชิปวันที่ (Pending) + ป้าย ใหม่ · กดชิปแล้วป้ายหาย */
.ypdc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ypdc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.ypdc button.on{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.ypnw{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11px;font-weight:700}
.ypc.ypnew{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 22%,transparent)}
.tchip.nw{background:var(--bad);color:#fff;border-color:var(--bad);font-size:12px;vertical-align:2px}
/* ลูกค้ารับเอง เซลส์ยังไม่แจ้งทะเบียน → แนะนำทะเบียนที่เคยมารับ */
.yppl{font-size:13px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.yppl.ok{background:var(--infobg);color:var(--info)}
.yplh{display:flex;gap:6px;flex-wrap:wrap}.yplh .btn{font-weight:600}.yplh .btn.on{outline:2px solid var(--good);outline-offset:1px}
.yplin{display:flex;gap:6px}.yplin .in{flex:1;min-width:0}
.bar .sum{font-size:13px;color:var(--muted)}
.bar .sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A2000}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
/* ลิ้นชักแก้งาน */
.scrim{position:fixed;inset:0;background:rgba(8,16,11,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--head);color:var(--head-ink);padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-family:var(--display);font-size:19px}
.dh .m{opacity:.8;font-size:13px}
.dh .x{background:rgba(255,255,255,.12);border:0;color:var(--head-ink);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:17px;flex:none}
.db{flex:1;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.df{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.box > label,.lb{font-weight:600;font-size:13.5px}
.seg{flex-wrap:wrap;display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg button.on.r{background:var(--bad);border-color:var(--bad)}
.in{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.stop .n{width:24px;height:24px;border-radius:50%;background:var(--head);color:var(--head-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.stop .nm{font-weight:600;min-width:0}
.stop .q{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.stop .q input{width:92px}
.stop .ac{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.res{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer}
.res button:first-child{border-top:0}
.res button:hover{background:var(--surface2)}
.res .km{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hl label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:pointer;background:var(--surface2);font-size:13px}
.hl label.dis{opacity:.55}
.hl small{display:block;color:var(--muted);font-size:11.5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:32px;height:32px;cursor:pointer;font-size:16px}
.step span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.note{color:var(--muted);font-size:12.5px}
/* เด็กรถ */
.hgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-family:var(--display);font-size:16px;margin:0 0 10px}
.form{display:flex;flex-direction:column;gap:9px}
.form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.hrow{display:grid;grid-template-columns:76px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) 96px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
/* สรุปสถานะ */
.rgrid.r1{grid-template-columns:minmax(0,760px)}
.rgrid{display:grid;grid-template-columns:minmax(0,640px) 340px;gap:20px;align-items:start;justify-content:start}
.imgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.imgbox img{display:block;width:100%;height:auto;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:10px 4px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.15)}
.chat{background:var(--chat);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat .who{font-size:12px;color:#fff;opacity:.9}
.flex{background:#fff;color:#1d2a22;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.flex .fh{background:#1B4332;color:#fff;padding:12px 14px}
.flex .fh b{display:block;font-family:var(--display);font-size:16px;color:#E9CF6E}
.flex .fb{padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.flex .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.flex .kp div{background:#F1F5F2;border-radius:8px;padding:6px 2px}
.flex .kp b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.flex .rp{color:#B42318;font-size:12.5px}
.flex img{display:block;width:100%;max-height:170px;object-fit:cover;object-position:top}
.flex .fbt{display:block;text-align:center;color:#1E4FA3;font-weight:700;padding:10px;border-top:1px solid #E3E9E5}
.opt{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 10px}
/* สถิติรายเดือน */
.stats{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px 22px;align-items:start}
.stats h2{font-family:var(--display);font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stats h2 span{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.tot{display:flex;align-items:baseline;gap:8px;margin:8px 0 10px}
.tot b{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);font-size:13px}
.tys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ty{border-radius:11px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line)}
.ty b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.ty small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.ty small i,.tchip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.ty .pc{font-size:11.5px;color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:6px;overflow-x:auto}
.day{flex:1 0 22px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:22px}
.day .stk{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden}
.day .stk span{display:block}
.day .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .n{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.day.today .d{color:var(--ink);font-weight:700}

   ตัดจำนวน / ยกเลิก PO ทีละใบได้บนเว็บ (ยกเลิก = ปิดไว้ เปิดคืนได้) → Loading Planner โหลดใหม่ แล้วกดส่งเข้าแพลนห้างอีกครั้ง งานห้างอัปเดตตาม */
const LPX={busy:false};
function lpBar(){const L=LPI.last,n=LP_POS.length,ds=[...new Set(LP_POS.map(p=>p.date))];
  const src=LPI.src==='sample'?'<span class="lpsrc s">🧪 PO ตัวอย่าง (ยังไม่มีแพลนจริง)</span>'
    :LPI.src==='empty'?'<span class="lpsrc s">📭 ยังไม่มีแพลน PO · กด 📥 นำเข้าแพลน PO</span>'
    :LPI.src==='hist'?'<span class="lpsrc h">🕘 ประวัติ · ส่งแล้ว '+ds.map(d=>esc(lpTh(d))).join(', ')+' · '+n+' ใบ</span>'
    :'<span class="lpsrc">📄 '+(LPI.src==='db-old'?'แพลน PO ':'ยังไม่ส่ง ')+n+' ใบ · '+ds.length+' วัน · ส่ง '+ds.map(d=>esc(lpTh(d))).join(', ')+(LPI.src==='db-old'?' (ไม่มีแพลนที่ยังไม่ส่ง · แสดงไฟล์ที่อัปล่าสุด)':'')+'</span>';
  const H=LPI.hist||[],hs=H.length?'<select class="in lphs" id="lpHist" aria-label="ดูประวัติวันส่ง"><option value="">'+(LPI.src==='db-old'?'📄 ไฟล์ที่อัปล่าสุด':'📄 ยังไม่ส่ง (ทั้งหมด)')+'</option><optgroup label="🕘 ประวัติ (ส่งแล้ว)">'
    +H.map(h=>'<option value="'+esc(h[0])+'"'+(LPI.view===h[0]?' selected':'')+'>'+esc(lpIsoTh(h[0]))+' · '+h[2]+' PO</option>').join('')+'</optgroup></select>':'';
  const last=L?'<span class="note">อัปเดตล่าสุด '+esc(lpAt(L.at))+(L.by_name?' · '+esc(L.by_name):'')+(L.file?' · '+esc(L.file):'')+'</span>':'';
  return '<div class="lpbar">'+src+hs+last+'<span class="sp"></span>'
    +(LPI.can?'<button class="btn sm mallb" id="lpImp">📥 นำเข้าแพลน PO (Excel)</button>'+(LPI.src!=='sample'&&LPI.src!=='empty'?'<button class="btn sm" id="lpMgr">✂️ ตัดจำนวน / ยกเลิก PO'+(LPI.off.length?' · ยกเลิกไว้ '+LPI.off.length:'')+'</button>':''):'<span class="note">นำเข้า/แก้แพลน PO ได้เฉพาะแอดมินห้าง</span>')
    +'<input type="file" id="lpFile" accept=".xlsx,.xls" hidden></div>';}
function lpWire(){const i=$('lpImp'),f=$('lpFile'),m=$('lpMgr'),hs=$('lpHist');if(hs)hs.onchange=()=>lpView(hs.value,hs);if(i)i.onclick=()=>f.click();if(f)f.onchange=()=>{const x=f.files[0];f.value='';if(x)lpPick(x);};if(m)m.onclick=lpMgr;}
async function lpView(d,el){if(typeof PKD_URL==='undefined'||!MY_UID){toast('หน้าเดโมนี้ไม่ได้ต่อระบบ');if(el)el.value=LPI.view;return;}
  if(el)el.disabled=true;
  try{const x=await fetch(PKD_URL+'?action=lpPos&userId='+encodeURIComponent(MY_UID)+(d?'&date='+encodeURIComponent(d):'')).then(z=>z.json());
    if(!x.ok)throw new Error(x.error||'โหลดไม่ได้');lpReload(x);toast(d?'🕘 ประวัติ ส่ง '+lpIsoTh(d)+' · '+x.lpPos.length+' PO':'📄 แพลนที่ยังไม่ส่ง '+x.lpPos.length+' PO');}
  catch(e){toast('❌ '+(e.message||e));if(el){el.disabled=false;el.value=LPI.view;}}}
function lpAt(s){const d=new Date(s);return isNaN(d)?String(s||''):d.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function lpTh(d){const m=String(d||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);return m?(+m[1])+' '+['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+m[2]]:d;}
async function lpCall(body){if(typeof PKD_URL==='undefined'||!MY_UID)throw new Error('หน้าเดโมนี้ไม่ได้ต่อระบบ (เปิดจากหน้าแพลนรถ Packing จริง)');
  const r=await fetch(PKD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,userId:MY_UID,name:window.MY_NAME||''})});
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('ระบบตอบกลับไม่ถูกต้อง ('+r.status+')');if(!j.ok)throw new Error(j.error||'ไม่สำเร็จ');return j;}
/* อ่านไฟล์: ทุกชีต · หาแถวหัวจากคำ (ลำดับ / นัดส่ง / SO / P/O / รายการสินค้า / จำนวน / สถานที่ส่ง) · แถวที่มีแต่สินค้า+จำนวน = รายการต่อของ PO ข้างบน */
function lpDate(v){if(v==null||v==='')return'';if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10);}
  if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const m=String(v).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
  const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:String(v).trim();}
function lpParse(wb){const rows=[],skip=[];
  wb.SheetNames.forEach(sn=>{const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});const col={};
    const K=[['seq',/^ลำดับ/],['date',/นัดส่ง|ว\/ด\/ป/],['so',/^เลขที่\s*SO|^SO\b/i],['po',/P\/O|^PO\b/i],['p',/รายการสินค้า|^สินค้า/],['q',/^จำนวน/],['dc',/สถานที่ส่ง|^คลัง|ปลายทาง/]];
    let hr=-1;for(let r=0;r<Math.min(A.length,10);r++){(A[r]||[]).forEach((c,ci)=>{const s=String(c).replace(/\s+/g,' ').trim();K.forEach(([k,re])=>{if(col[k]==null&&s&&re.test(s)){col[k]=ci;hr=Math.max(hr,r);}});});}
    if(col.po==null||col.p==null||col.q==null){skip.push(sn);return;}
    let cur=null;for(let r=hr+1;r<A.length;r++){const R=A[r]||[],g=k=>col[k]==null?'':R[col[k]];
      const po=String(g('po')).trim(),p=String(g('p')).replace(/\s+/g,' ').trim(),q=g('q');
      if(po){cur={po,so:String(g('so')).trim(),seq:Number(g('seq'))||null,date:lpDate(g('date')),dc:String(g('dc')).replace(/\s+/g,' ').trim(),lines:[],sheet:sn,row:r+1};rows.push(cur);}
      else if(!p)cur=null;   /* แถวว่าง = จบ PO */
      if(cur&&p)cur.lines.push({p,q:typeof q==='number'?q:Number(String(q).replace(/,/g,''))});}});
  return {rows,skip};}
async function lpPick(file){if(LPX.busy)return;LPX.busy=true;const b=$('lpImp'),t0=b&&b.textContent;if(b){b.disabled=true;b.textContent='⏳ กำลังอ่านไฟล์…';}
  try{await mxLoad('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const {rows,skip}=lpParse(wb);
    if(!rows.length){await askModal({title:'ไม่พบ PO ในไฟล์',icon:'📄',ok:'ปิด',cancel:null,html:'<p>ต้องมีหัวคอลัมน์ <b>เลขที่ P/O · รายการสินค้า · จำนวน</b> (แบบไฟล์แพลน 7-11 ของแอดมินห้าง)</p>'+(skip.length?'<p class="note">ชีตที่ข้าม: '+esc(skip.join(', '))+'</p>':'')});return;}
    if(b)b.textContent='⏳ กำลังตรวจกับระบบ…';
    const pv=await lpCall({action:'lpImport',file:file.name,rows,apply:false});
    const go=await lpPreview(pv,file.name,skip,rows);if(!go)return;
    if(b)b.textContent='⏳ กำลังบันทึก…';
    const ap=await lpCall({action:'lpImport',file:file.name,rows,apply:true});
    lpReload(ap);toast('✅ นำเข้าแพลน PO แล้ว · ใหม่ '+ap.add.length+' · แก้ '+ap.change.length+(ap.errors.length?' · ข้าม '+ap.errors.length+' (ผิดพลาด)':'')+' · Loading Planner โหลดใหม่แล้ว');
  }catch(e){toast('❌ '+(e.message||e));}finally{LPX.busy=false;if(b&&b.isConnected){b.disabled=false;b.textContent=t0;}}}
function lpGrp(cls,title,n,body,open){return n?'<details class="lpg '+cls+'"'+(open?' open':'')+'><summary><b>'+title+'</b> <span class="lpn">'+n+'</span></summary><div class="lpgb">'+body+'</div></details>':'';}
/* ยอดจากไฟล์ที่อ่านในหน้า (ไม่ใช่ค่าที่ระบบคำนวณ) · หน่วย = ลัง ตามคอลัมน์ "จำนวน" ของไฟล์ · PO ที่ผิดพลาดไม่นับ */
const lpQn=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2});
const lpTot=x=>(x&&x.lines||[]).reduce((a,l)=>a+(+l.q||0),0);
function lpIsoTh(d){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return esc(d||'ไม่มีวันส่ง');const dt=new Date(+m[1],+m[2]-1,+m[3]);
  return ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][dt.getDay()]+' '+(+m[3])+' '+['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+m[2]]+' '+String((+m[1]+543)%100).padStart(2,'0');}
function lpDaySum(rows,r){const bad=new Set(r.errors.map(x=>x.po)),good=(rows||[]).filter(x=>!bad.has(x.po));if(!good.length)return '';
  const D={},allDc=new Set();good.forEach(x=>{const d=D[x.date]=D[x.date]||{po:0,q:0,dc:new Set(),sku:{}};const dc=String(x.dc).slice(0,4);
    d.po++;d.q+=lpTot(x);d.dc.add(dc);allDc.add(dc);x.lines.forEach(l=>{d.sku[l.p]=(d.sku[l.p]||0)+(+l.q||0);});});
  const ds=Object.keys(D).sort(),T=ds.reduce((a,k)=>a+D[k].q,0);
  return '<div class="lpds"><div class="lpdh">📅 สรุปตามวันส่ง <span class="note">'+ds.length+' วัน · '+good.length+' PO · รวม <b>'+lpQn(T)+'</b> ลัง</span></div>'
    +'<div class="tw"><table class="lpdt"><thead><tr><th>วันส่ง</th><th class="n">PO</th><th class="n">คลัง</th><th class="n">ยอดรวม (ลัง)</th></tr></thead><tbody>'
    +ds.map(k=>{const d=D[k],sk=Object.entries(d.sku).sort((a,b)=>b[1]-a[1]);
      return '<tr><td><b>'+lpIsoTh(k)+'</b><div class="lpsk">'+sk.map(([p,q])=>esc(p)+' <b>'+lpQn(q)+'</b>').join(' · ')+'</div></td><td class="n">'+d.po+'</td><td class="n" title="'+esc([...d.dc].sort().join(', '))+'">'+d.dc.size+'</td><td class="n"><b>'+lpQn(d.q)+'</b></td></tr>';}).join('')
    +'</tbody><tfoot><tr><td>รวม '+ds.length+' วัน</td><td class="n">'+good.length+'</td><td class="n">'+allDc.size+'</td><td class="n">'+lpQn(T)+'</td></tr></tfoot></table></div>'
    +(bad.size?'<div class="note">ไม่นับ PO ที่ผิดพลาด '+bad.size+' ใบ</div>':'')+'</div>';}
function lpPreview(r,fname,skip,rows){const ok=r.add.length+r.change.length;
  const byPo={};(rows||[]).forEach(x=>{byPo[x.po]=x;});
  const qty=po=>{const x=byPo[po];return x?'<span class="lpq">'+lpQn(lpTot(x))+' ลัง</span>':'';};
  const lns=(po,fb)=>{const x=byPo[po];return x&&x.lines.length?x.lines.map(l=>esc(l.p)+' <b>'+lpQn(l.q)+'</b>').join(' · '):esc(fb||'');};
  const ln=s=>'<div class="lpr">'+s+'</div>',where=x=>'<span class="note">'+esc(x.sheet?('ชีต '+x.sheet+' · '):'')+'แถว '+x.row+'</span>';
  const html='<div class="lpsum"><span class="c-add">ใหม่ <b>'+r.add.length+'</b></span><span class="c-chg">แก้ไข <b>'+r.change.length+'</b></span><span>ไม่เปลี่ยน <b>'+r.same+'</b></span><span class="c-err">ผิดพลาด <b>'+r.errors.length+'</b></span><span class="c-warn">เตือน <b>'+r.warns.length+'</b></span></div>'
    +'<div class="note">ไฟล์ '+esc(fname)+' · '+r.total+' PO · วันส่ง '+r.dates.map(([d,n])=>esc(lpTh(d))+' ('+n+')').join(', ')+(skip.length?' · ข้ามชีต '+esc(skip.join(', ')):'')+'</div>'
    +lpDaySum(rows,r)
    +lpGrp('add','➕ เพิ่มใหม่',r.add.length,r.add.map(x=>ln(qty(x.po)+'<b class="mono">'+esc(x.po)+'</b> ส่ง '+esc(lpTh(x.date))+' · '+esc(x.dc.slice(0,4))+'<div class="note">'+lns(x.po,x.lines)+'</div>')).join(''),r.add.length<=8)
    +lpGrp('chg','✏️ แก้ไข (เก่า → ใหม่)',r.change.length,r.change.map(x=>ln(qty(x.po)+'<b class="mono">'+esc(x.po)+'</b> · '+esc(x.dc.slice(0,4))+x.diffs.map(d=>'<div class="lpd"><span>'+esc(d.f)+'</span> <s>'+esc(d.o)+'</s> → <b>'+esc(d.n)+'</b></div>').join(''))).join(''),true)
    +lpGrp('err','⛔ ผิดพลาด · ไม่บันทึก',r.errors.length,r.errors.map(x=>ln('<b class="mono">'+esc(x.po||'—')+'</b> '+esc(x.msg)+' '+where(x))).join(''),true)
    +lpGrp('warn','⚠️ เตือน · บันทึกได้',r.warns.length,r.warns.map(x=>ln('<b class="mono">'+esc(x.po)+'</b> '+esc(x.msg)+' '+where(x))).join(''),r.warns.length<=6)
    +lpGrp('off','📌 ไม่อยู่ในไฟล์ · คงไว้ ไม่ลบ',r.notIn.length,'<div class="note">ถ้า PO ไหนไม่ส่งแล้ว ให้กด ✂️ ตัดจำนวน / ยกเลิก PO</div>'+r.notIn.map(x=>ln('<b class="mono">'+esc(x.po)+'</b> ส่ง '+esc(lpTh(x.date))+' · '+esc(x.dc.slice(0,4)))).join(''),false)
    +(ok?'<p class="note" style="margin-top:10px">ยืนยันแล้ว Loading Planner จะโหลด PO ใหม่ · ที่จัดลงรถไว้แต่ยังไม่กดส่งเข้าแพลนห้างจะเริ่มใหม่</p>':'<p class="note" style="margin-top:10px">ไม่มีรายการที่ต้องบันทึก</p>');
  return askModal({title:'ตรวจแพลน PO ก่อนนำเข้า',icon:'📥',wide:true,html,ok:ok?'ยืนยันนำเข้า '+ok+' PO':'ปิด',cancel:ok?'ยกเลิก':null}).then(v=>!!(v&&ok));}
function lpReload(r){if(r.lpPos)LP_POS=r.lpPos;LPI.src=r.lpSrc||LPI.src;LPI.last=r.lpLast||LPI.last;LPI.off=r.lpOff||[];if(r.lpHist)LPI.hist=r.lpHist;LPI.view=r.lpView||'';
  const f=$('lpFrame');if(f){f.removeAttribute('src');f.setAttribute('src','pk-loadplan.html?v=20261109w&r='+Date.now());}renderPlan();}
/* ตัดจำนวน / ยกเลิก PO — ทีละใบ · กันแก้ทับด้วย Rev · PO ที่อยู่ในงานห้างแล้ว: แก้เสร็จต้องไปจัดรถใหม่แล้วกดส่งอีกครั้ง งานห้างจึงอัปเดต */
function lpInJob(po){return MJ.some(j=>String(j.note||'').indexOf(po)>=0);}
function lpMgr(){const ov=document.createElement('div');ov.className='mov';
  const draw=()=>{const ds=[...new Set(LP_POS.map(p=>p.date))];
    ov.innerHTML='<div class="mbox wide" role="dialog" aria-modal="true" aria-label="ตัดจำนวน / ยกเลิก PO"><div class="mic">✂️</div><h3>ตัดจำนวน / ยกเลิก PO</h3><div class="mbody">'
      +'<div class="note">แก้ทีละใบ · จำนวนเป็นลัง · ใส่ 0 = ตัดสินค้านั้นออก · ยกเลิก = ปิดไว้ เปิดคืนได้ · ทุกครั้งบันทึกประวัติ (ใคร/เมื่อไร/เหตุผล)</div>'

        +(p.lines||[]).map((l,i)=>'<label class="lpl"><span>'+esc(l.p)+'</span><input type="number" min="0" step="1" inputmode="numeric" value="'+(+l.q)+'" data-i="'+i+'" data-q0="'+(+l.q)+'" aria-label="จำนวน '+esc(l.p)+'"> ลัง</label>').join('')
        +'<div class="lpa"><input class="lpwhy" placeholder="เหตุผล (ไม่บังคับ) เช่น ผลิตไม่ทัน / คลังขอตัด" maxlength="200"><button class="btn sm pri" data-act="save">💾 บันทึกจำนวน</button><button class="btn sm dang" data-act="off">🚫 ยกเลิก PO</button></div></div>').join('')).join('')
      +(LPI.off.length?'<h4 class="lpdh">🚫 ยกเลิกไว้ '+LPI.off.length+' ใบ</h4>'+LPI.off.map(p=>'<div class="lpc off" data-po="'+esc(p.po)+'"><div class="lph"><b class="mono">'+esc(p.po)+'</b> <span>ส่ง '+esc(lpTh(p.date))+' · '+esc(p.dc.slice(0,4))+'</span> <span class="note">'+esc(p.by?'โดย '+p.by:'')+'</span></div><div class="note">'+esc((p.lines||[]).map(l=>l.p+' '+l.q).join(' · '))+'</div><div class="lpa"><input class="lpwhy" placeholder="เหตุผล (ไม่บังคับ)" maxlength="200"><button class="btn sm" data-act="on">↩ เปิดใช้คืน</button></div></div>').join(''):'')
      +'</div><div class="mact"><button class="btn pri" data-close="1">ปิด</button></div></div>';};
  draw();document.body.appendChild(ov);let changed=false;

let WITHJOB=true,IMG='',RCV=null;
/* เขียว = พร้อมใช้งาน มีคนขับ · เหลือง = พร้อม แต่ไม่มีคนขับ · แดง = ซ่อม · เทา = งดวิ่ง / หางสำรอง */
const DOT={job:'#16A34A',wait:'#16A34A',nod:'#EAB308',rep:'#DC2626',off:'#9CA3AF',tail:'#9CA3AF'};
function stTxt(v,k,p){return k==='rep'?(p.reason||'ซ่อม'):k==='off'?'งดวิ่ง'+(p.reason?' · '+p.reason:''):k==='tail'?'หางสำรอง':k==='nod'?'พร้อม · ไม่มีคนขับ':k==='job'?'ออกงาน'+(otOnly(p)?' · '+p.ot:''):'พร้อม · รอมีงาน';}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function dot(x,cx,cy,r,col,hollow){x.beginPath();x.arc(cx,cy,r+4,0,Math.PI*2);x.fillStyle=col+'2E';x.fill();
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(hollow){x.lineWidth=3;x.strokeStyle=col;x.stroke();}else{x.fillStyle=col;x.fill();}}
async function drawReport(){

  const W=1080,PAD=36,RH=WITHJOB?64:52,GH=50,HEAD=176,KP=118,FOOT=86;
  const groups=['4 ล้อ','6 ล้อ','10/22 ล้อ'];

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const F=(w,s,f)=>w+' '+s+'px '+(f||'"IBM Plex Sans Thai", sans-serif');
  x.fillStyle='#EEF3EF';x.fillRect(0,0,W,H);
  /* หัว */
  x.fillStyle='#1B4332';x.fillRect(0,0,W,HEAD);x.fillStyle='#C9A227';x.fillRect(0,HEAD-6,W,6);
  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle='#E9CF6E';x.font=F('600',20);x.fillText('SSB Smart Supply · Packing',PAD,56);
  x.fillStyle='#FFFFFF';x.font=F('700',40,'"Anuphan", "IBM Plex Sans Thai", sans-serif');x.fillText('สรุปสถานะรถ PK ประจำวัน',PAD,108);
  x.fillStyle='#CFE3D6';x.font=F('500',22);x.fillText(dateTH($('pdate').value),PAD,146);
  /* การ์ดตัวเลข */
  const c=counts(),ready=c.job+c.wait;
  const tiles=[['รถทั้งหมด',VEH.length-c.tail,'#1B4332',null],['พร้อม มีคนขับ',ready,'#16A34A','ออกงาน '+c.job],['ไม่มีคนขับ',c.nod,'#EAB308',null],['ซ่อม',c.rep,'#DC2626',null]];
  const tw=(W-PAD*2-3*14)/4;
  tiles.forEach(([l,n,col,sub],i)=>{const X=PAD+i*(tw+14),Y=HEAD+20;
    x.fillStyle='#FFFFFF';rrect(x,X,Y,tw,KP-34,16);x.fill();
    if(i)dot(x,X+28,Y+30,9,col);
    x.fillStyle='#5D6E63';x.font=F('600',17);x.textAlign='left';x.fillText(l,X+(i?46:20),Y+36);
    x.fillStyle=i?col:'#14261C';x.font=F('700',38,'"Anuphan", "IBM Plex Sans Thai", sans-serif');x.fillText(String(n),X+20,Y+74);
    if(sub){x.fillStyle='#5D6E63';x.font=F('500',15);x.textAlign='right';x.fillText(sub,X+tw-16,Y+72);}
  });
  /* รายการตามกลุ่มล้อ */
  let y=HEAD+KP;const brk=[y];
  groups.forEach(g=>{const vs=VEH.filter(v=>v.g===g),h=GH+vs.length*RH;
    x.fillStyle='#FFFFFF';rrect(x,PAD,y,W-PAD*2,h,18);x.fill();
    x.save();rrect(x,PAD,y,W-PAD*2,h,18);x.clip();
    x.fillStyle='#F4F7F4';x.fillRect(PAD,y,W-PAD*2,GH);
    x.fillStyle='#14261C';x.font=F('700',21,'"Anuphan", "IBM Plex Sans Thai", sans-serif');x.textAlign='left';x.textBaseline='middle';x.fillText(g,PAD+22,y+GH/2);
    const gr=vs.filter(v=>['job','wait'].includes(kind(v))).length,gn=vs.filter(v=>kind(v)==='nod').length,gp=vs.filter(v=>kind(v)==='rep').length;
    x.font=F('500',16);x.fillStyle='#5D6E63';x.textAlign='right';
    const gt=vs.filter(v=>kind(v)==='tail').length;x.fillText((vs.length-gt)+' คัน · พร้อม '+gr+(gn?' · ไม่มีคนขับ '+gn:'')+(gp?' · ซ่อม '+gp:'')+(gt?' · หางสำรอง '+gt:''),W-PAD-22,y+GH/2);
    let ry=y+GH;
    vs.forEach((v,i)=>{const p=PLAN[v.head],k=kind(v),d=drvOf(p.driver);
      if(i){x.strokeStyle='#E3EAE5';x.lineWidth=1;x.beginPath();x.moveTo(PAD+20,ry);x.lineTo(W-PAD-20,ry);x.stroke();}
      if(k==='rep'){x.fillStyle='#FDF0EF';x.fillRect(PAD,ry,W-PAD*2,RH);}
      const cy=WITHJOB?ry+RH/2-10:ry+RH/2;
      dot(x,PAD+34,ry+RH/2,10,DOT[k],k==='tail'||k==='off');
      x.textBaseline='middle';x.textAlign='left';
      x.fillStyle='#9AA8A0';x.font=F('600',15);x.fillText(v.tail?'':String(i+1),PAD+58,cy);
      x.fillStyle='#14261C';x.font=F('700',20);x.fillText(v.plate.replace(',',' / '),PAD+86,cy);
      x.fillStyle='#5D6E63';x.font=F('500',16);fitText(x,[BRAND[v.head],v.shape].filter(Boolean).join(' · '),PAD+330,cy,280,'left');
      x.fillStyle=k==='rep'?'#B91C1C':k==='nod'?'#A16207':k==='tail'||k==='off'?'#6B7280':'#15803D';
      x.font=F('700',k==='rep'?16:18);fitText(x,stTxt(v,k,p),W-PAD-22,cy,W-PAD*2-660,'right');
      if(WITHJOB&&!v.tail&&k!=='rep'){const s0=p.stops[0];
        const jt=(d?d.name:'ยังไม่มีคนขับ')+(s0?' · ถึง '+(s0.at||'--:--')+' '+s0.n+(p.stops.length>1?' +'+(p.stops.length-1)+' จุด':''):otOnly(p)?' · งานอื่นๆ '+otLabel(p):'');
        x.fillStyle='#5D6E63';x.font=F('500',15);fitText(x,jt,PAD+86,ry+RH/2+14,W-PAD*2-110,'left');}
      ry+=RH;brk.push(ry);});
    x.restore();
    y+=h+18;brk.push(y);});
  /* คำอธิบายสี */
  y+=4;const leg=[['#16A34A','พร้อมใช้งาน มีคนขับ',0],['#EAB308','พร้อม ไม่มีคนขับ',0],['#DC2626','ซ่อม',0],['#9CA3AF','หางสำรอง / งดวิ่ง',1]];
  let lx=PAD;x.textBaseline='middle';x.textAlign='left';x.font=F('500',15);
  leg.forEach(([col,t,hol])=>{dot(x,lx+9,y+16,7,col,hol);x.fillStyle='#3F4F45';x.fillText(t,lx+24,y+17);lx+=24+x.measureText(t).width+26;});
  const now=new Date();x.textAlign='right';x.fillStyle='#8A978F';x.font=F('500',14);
  x.fillText('สร้าง '+now.getDate()+'/'+(now.getMonth()+1)+'/'+(now.getFullYear()+543)+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),W-PAD,y+50);
  cv._brk=brk;RCV=cv;IMG=cv.toDataURL('image/png');return IMG;
}
function fitText(x,t,cx,cy,max,align){align=align||'center';x.textAlign=align;let s=t;
  while(x.measureText(s).width>max&&s.length>4)s=s.slice(0,-2);if(s!==t)s=s.slice(0,-1)+'…';x.fillText(s,cx,cy);}

  rep:['ซ่อม','A32D2D','FCEDED'],tail:['หางสำรอง','5F5E5A','EFEFEF'],off:['งดวิ่ง','5F5E5A','EFEFEF']};

  const groups=['4 ล้อ','6 ล้อ','10/22 ล้อ'].map(g=>({g,rows:VEH.filter(v=>v.g===g).map((v,i)=>{const p=PLAN[v.head],k=kind(v),d=drvOf(p.driver),S=!v.tail&&k!=='rep'?(p.stops||[]):[];
    return {no:v.tail?'':i+1,plate:v.plate.split(',').map(s=>s.trim()).filter(Boolean).join(' / '),shape:[BRAND[v.head],v.shape].filter(Boolean).join(' · '),k,
      reason:(k==='rep'||k==='off')?String(p.reason||'').trim():'',drv:v.tail?'':d?d.name:'',first:S[0]?S[0].n:(otOnly(p)?'งานอื่นๆ · '+otLabel(p):''),at:S[0]?(S[0].at||''):'',n:S.length};})})).filter(G=>G.rows.length);

const rsName=(D,ext)=>'สถานะรถPK_'+D.iso.replace(/-/g,'')+'.'+ext;
async function rsPdf(cv){await mxLoad('jspdf');const {jsPDF}=window.jspdf;
  /* รูปเป็นแนวตั้ง → A4 แนวตั้ง · ยาวเกินหน้า = ตัดที่รอยต่อระหว่างแถว */
  const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'}),PW=595.28,PH=841.89,M=22,sc=(PW-M*2)/cv.width,maxH=(PH-M*2-14)/sc;

  while(cv.height-from>maxH){let c=b.filter(v=>v>from+40&&v-from<=maxH).pop();if(!c)c=from+maxH;cuts.push(c);from=c;}cuts.push(cv.height);
  for(let i=0;i<cuts.length-1;i++){const h=cuts[i+1]-cuts[i],pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;
    const px=pc.getContext('2d');px.fillStyle='#EEF3EF';px.fillRect(0,0,pc.width,h);px.drawImage(cv,0,cuts[i],cv.width,h,0,0,cv.width,h);
    if(i)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',M,M,cv.width*sc,h*sc);
    pdf.setFontSize(9);pdf.setTextColor(140);pdf.text((i+1)+' / '+(cuts.length-1),PW-M,PH-10,{align:'right'});}
  return new Blob([pdf.output('arraybuffer')],{type:'application/octet-stream'});}   /* octet-stream: แอป LINE ไม่เปิด PDF ค้างแทนดาวน์โหลด */

(function(){
  const hs=document.createElement('div');hs.id='hsb';hs.setAttribute('aria-hidden','true');hs.innerHTML='<div></div>';document.body.appendChild(hs);
  const inner=hs.firstChild;let cur=null,lock=0,qd=0;
  const unlock=()=>setTimeout(()=>{lock=0;},30);
  function fromSheet(){if(lock||!cur)return;lock=1;hs.scrollLeft=cur.scrollLeft;unlock();}
  hs.addEventListener('scroll',()=>{if(lock||!cur)return;lock=1;cur.scrollLeft=hs.scrollLeft;unlock();},{passive:true});
  function pick(){
    qd=0;const bar=document.getElementById('bar');const br=bar&&bar.getBoundingClientRect();const bt=br&&br.height>0?br.top:innerHeight;   // .bar = fixed → offsetParent เป็น null เสมอ ใช้ขนาดแทน
    let s=null;
    document.querySelectorAll('.sheet').forEach(el=>{
      if(s||!el.offsetParent||el.scrollWidth-el.clientWidth<4)return;
      const r=el.getBoundingClientRect();
      if(r.top<bt-60&&r.bottom>bt-2)s=el;   // ตารางอยู่บนจอ แต่ขอบล่าง (แถบเลื่อนเดิม) จมใต้แถบปุ่ม/นอกจอ
    });
    if(s!==cur){if(cur)cur.removeEventListener('scroll',fromSheet);cur=s;if(cur)cur.addEventListener('scroll',fromSheet,{passive:true});}
    if(!cur){hs.classList.remove('on');return;}
    const r=cur.getBoundingClientRect();
    hs.style.left=(r.left+cur.clientLeft)+'px';hs.style.width=cur.clientWidth+'px';hs.style.bottom=Math.max(0,innerHeight-bt)+'px';
    inner.style.width=cur.scrollWidth+'px';
    hs.classList.add('on');
    if(Math.abs(hs.scrollLeft-cur.scrollLeft)>1){lock=1;hs.scrollLeft=cur.scrollLeft;unlock();}
  }
  const q=()=>{if(!qd){qd=1;setTimeout(pick,16);}};
  addEventListener('scroll',q,{passive:true,capture:true});
  addEventListener('resize',q);
  new MutationObserver(q).observe(document.body,{childList:true,subtree:true});
  setInterval(q,1500);q();
})();

<script>
/* หน้าเว็บเดโม (2026-11-09) · ด่านเข้าเหมือน pk-plan.html: LINE/บัตร SSO → แอดมิน Packing/ผู้จัดการ/ผู้บริหาร/DEV + PIN
 * ข้อมูลสด: Edge pk-daily (คนขับ Packing · เด็กรถ · ค่ากลาง DTC ร้าน↔ร้าน) · ยังไม่บันทึก/ไม่ส่ง LINE จริง */
const LIFF_ID='2010274217-Ot7vGhri', PKD_URL='https://abihhdjcrbvwlkzwvjio.supabase.co/functions/v1/pk-daily';
let MY_UID='';
function gateMsg(h){ const g=document.getElementById('gate'); g.hidden=false; g.innerHTML='<div class="gbox">'+h+'</div>'; }
(async function(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
    const p=await liff.getProfile(); MY_UID=p.userId||''; window.MY_NAME=p.displayName||'';   /* ชื่อคนแก้ในฉบับแก้ไขแพลนห้าง */
    if(!MY_UID){ gateMsg('ไม่พบบัญชี LINE'); return; }
    let info=null; try{ info=await ssbAdminPinInfo(MY_UID); }catch(e){}
    const ok = info&&info.isDev ? await ssbPinGate(MY_UID) : await ssbAdminPin(MY_UID,{info,text:'เข้าหน้าแพลนรถ Packing (เดโม)'});
    if(!ok){ gateMsg('🔐 ต้องใส่ PIN ก่อนเข้าหน้านี้<br><button class="btn pri" style="margin-top:12px" onclick="location.reload()">ใส่ PIN อีกครั้ง</button>'); return; }
    gateMsg('<div class="spin"></div>กำลังโหลดรถ คนขับ และค่ากลาง DTC…');
    let r=null;
    for(let i=0;i<2&&!r;i++){ try{ const x=await fetch(PKD_URL+'?action=boot&userId='+encodeURIComponent(MY_UID)); r=await x.json(); }catch(e){ if(i) throw e; } }
    if(r.denied){ gateMsg('หน้านี้สำหรับแอดมิน Packing / ผู้จัดการ / ผู้บริหาร'); return; }
    if(!r.ok) throw new Error(r.error||'โหลดไม่สำเร็จ');
    window.__D=r;
    const s=document.createElement('script'); s.textContent=document.getElementById('pkMain').textContent; document.body.appendChild(s);
    const at=r.pairAt?new Date(r.pairAt).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    const dm=document.querySelector('.demo'); if(dm&&at) dm.insertAdjacentHTML('beforeend',' · ค่ากลาง DTC อัปเดต '+at+' ('+r.pairs.length+' คู่)');
    document.getElementById('gate').hidden=true;
    if(typeof loadLive==='function'){ loadLive(); setInterval(()=>{ if(!document.hidden) loadLive(); },60000); }   // สถานะสด GPS แผงซ้าย
  }catch(e){ gateMsg('โหลดไม่สำเร็จ: '+String(e&&e.message||e).replace(/[<>&]/g,'')+'<br><button class="btn pri" style="margin-top:12px" onclick="location.reload()">↻ ลองใหม่</button>'); }
})();
</script>
</body>
</html>
