<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex">
<title>แพลนรถ Packing ประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: แถบหัวเขียว SSB + แท็บ 3 หน้า (แพลน / เด็กรถ / สรุปสถานะรถ) · แพลน = รายการรถตามกลุ่มล้อเหมือนใบงาน แก้ทีละคันในลิ้นชักขวา */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#F4F7F4; --ink:#14261C; --muted:#5D6E63; --line:#D7E1D9;
  --head:#1B4332; --head-ink:#F3F7F4; --brand:#1F6B48; --brand-ink:#FFFFFF; --gold:#C9A227; --gold-ink:#5B4600;
  --good:#17703F; --goodbg:#E2F2E7; --bad:#B42318; --badbg:#FCEBE9; --warn:#9A5B06; --warnbg:#FFF2D8;
  --idle:#5D6E63; --idlebg:#ECF0ED; --info:#1E4FA3; --infobg:#E6EEFA; --shadow:rgba(20,38,28,.10);
  --chat:#8DA9C9; --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif; --body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1611; --surface:#14211A; --surface2:#1A2A21; --ink:#E4EDE7; --muted:#9AAEA1; --line:#2A3C31;
  --head:#123023; --head-ink:#E9F2EC; --brand:#3C8F66; --brand-ink:#FFFFFF; --gold:#D9B743; --gold-ink:#F4E3A6;
  --good:#6BCB93; --goodbg:#173326; --bad:#F2877C; --badbg:#3A1C19; --warn:#F0B95A; --warnbg:#3A2C12;
  --idle:#9AAEA1; --idlebg:#1E2C24; --info:#8DB2F2; --infobg:#18263F; --shadow:rgba(0,0,0,.45); --chat:#2C3D52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#14211A; --surface2:#1A2A21; --ink:#E4EDE7; --muted:#9AAEA1; --line:#2A3C31;
  --head:#123023; --head-ink:#E9F2EC; --brand:#3C8F66; --brand-ink:#FFFFFF; --gold:#D9B743; --gold-ink:#F4E3A6;
  --good:#6BCB93; --goodbg:#173326; --bad:#F2877C; --badbg:#3A1C19; --warn:#F0B95A; --warnbg:#3A2C12;
  --idle:#9AAEA1; --idlebg:#1E2C24; --info:#8DB2F2; --infobg:#18263F; --shadow:rgba(0,0,0,.45); --chat:#2C3D52; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--head);color:var(--head-ink);padding-block:16px 0}
.top h1{font-family:var(--display);font-size:22px;margin:0;font-weight:700;letter-spacing:.01em}
.top .row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top .sub{opacity:.78;font-size:13px}
.datebox{display:flex;align-items:center;gap:8px;font-size:13px}
.datebox input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:5px 8px;color:var(--head-ink);color-scheme:dark}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:var(--head-ink);text-decoration:none;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:600;white-space:nowrap;opacity:.75}
.tabs a.on{background:var(--bg);color:var(--ink);opacity:1}
.tabs a:hover{opacity:1}
.demo{margin:14px 0 0;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
main{padding-block:14px 120px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.grp{margin-top:18px}
.grp h2{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.grp h2 span{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vr{display:grid;grid-template-columns:28px minmax(150px,1.15fr) minmax(140px,1fr) minmax(150px,1.1fr) minmax(200px,1.7fr) 112px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.vr:first-child{border-top:0}
.vr:hover{background:var(--surface2)}
.vr .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.plate{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.plate small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.cell{min-width:0;font-size:13.5px}
.cell .k{display:none;color:var(--muted);font-size:12px}
.cell .m{color:var(--muted);font-size:12.5px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-job{background:var(--goodbg);color:var(--good)} .p-wait{background:var(--idlebg);color:var(--idle)}
.p-rep{background:var(--badbg);color:var(--bad)} .p-nod{background:var(--warnbg);color:var(--warn)}
.p-tail{background:var(--warnbg);color:var(--gold-ink)} .p-long{background:var(--infobg);color:var(--info)}
.warn{color:var(--warn);font-size:12.5px}
.tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);margin-left:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -16px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.bar .sum{font-size:13px;color:var(--muted)}
.bar .sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A2000}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
/* ลิ้นชักแก้งาน */
.scrim{position:fixed;inset:0;background:rgba(8,16,11,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--head);color:var(--head-ink);padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-family:var(--display);font-size:19px}
.dh .m{opacity:.8;font-size:13px}
.dh .x{background:rgba(255,255,255,.12);border:0;color:var(--head-ink);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:17px;flex:none}
.db{flex:1;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.df{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;justify-content:flex-end;background:var(--surface)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.box > label,.lb{font-weight:600;font-size:13.5px}
.seg{flex-wrap:wrap;display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg button.on.r{background:var(--bad);border-color:var(--bad)}
.in{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.stop .n{width:24px;height:24px;border-radius:50%;background:var(--head);color:var(--head-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.stop .nm{font-weight:600;min-width:0}
.stop .q{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.stop .q input{width:92px}
.stop .ac{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.res{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.res button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer}
.res button:first-child{border-top:0}
.res button:hover{background:var(--surface2)}
.res .km{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hl label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:pointer;background:var(--surface2);font-size:13px}
.hl label.dis{opacity:.55}
.hl small{display:block;color:var(--muted);font-size:11.5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:32px;height:32px;cursor:pointer;font-size:16px}
.step span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.note{color:var(--muted);font-size:12.5px}
/* เด็กรถ */
.hgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-family:var(--display);font-size:16px;margin:0 0 10px}
.form{display:flex;flex-direction:column;gap:9px}
.form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.hrow{display:grid;grid-template-columns:76px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) 96px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
/* สรุปสถานะ */
.rgrid.r1{grid-template-columns:minmax(0,760px)}
.rgrid{display:grid;grid-template-columns:minmax(0,640px) 340px;gap:20px;align-items:start;justify-content:start}
.imgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.imgbox img{display:block;width:100%;height:auto;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:10px 4px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.15)}
.chat{background:var(--chat);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat .who{font-size:12px;color:#fff;opacity:.9}
.flex{background:#fff;color:#1d2a22;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.flex .fh{background:#1B4332;color:#fff;padding:12px 14px}
.flex .fh b{display:block;font-family:var(--display);font-size:16px;color:#E9CF6E}
.flex .fb{padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.flex .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.flex .kp div{background:#F1F5F2;border-radius:8px;padding:6px 2px}
.flex .kp b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.flex .rp{color:#B42318;font-size:12.5px}
.flex img{display:block;width:100%;max-height:170px;object-fit:cover;object-position:top}
.flex .fbt{display:block;text-align:center;color:#1E4FA3;font-weight:700;padding:10px;border-top:1px solid #E3E9E5}
.opt{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 10px}
/* สถิติรายเดือน */
.stats{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px 22px;align-items:start}
.stats h2{font-family:var(--display);font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stats h2 span{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.tot{display:flex;align-items:baseline;gap:8px;margin:8px 0 10px}
.tot b{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tot span{color:var(--muted);font-size:13px}
.tys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ty{border-radius:11px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line)}
.ty b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.ty small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.ty small i,.tchip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.ty .pc{font-size:11.5px;color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:6px;overflow-x:auto}
.day{flex:1 0 22px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:22px}
.day .stk{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden}
.day .stk span{display:block}
.day .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .n{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.day.today .d{color:var(--ink);font-weight:700}
.day.today .stk{outline:2px solid var(--gold);outline-offset:1px}
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.otbox{display:flex;flex-direction:column;gap:7px;border-top:1px dashed var(--line);padding-top:10px}.otbox[hidden]{display:none}
.otwage{font-size:12.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;line-height:1.5}.otwage span{color:var(--muted);font-size:12px}
.otwage.sm{display:inline-block;padding:1px 8px;font-size:11px;margin-left:6px;vertical-align:1px}
.otl details{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px;background:var(--surface)}.otl summary{cursor:pointer;list-style-position:inside}
.otl ul{margin:6px 0 2px 18px;padding:0;font-size:12.5px;max-height:190px;overflow:auto}.otl li{margin:2px 0}.otn{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.clrl{margin:4px 0 8px 18px;padding:0;line-height:1.7}
.lphs{width:auto;max-width:240px;padding:5px 10px;font-size:13px}
.lpsrc.h{color:#8a5a0b}
.pob{font:inherit;font-weight:700;color:var(--mall);background:none;border:0;border-bottom:1.5px dashed currentColor;padding:0 1px;cursor:pointer;border-radius:0}
.pob:hover,.pob:focus-visible{background:var(--mallbg);outline:none}
.pob2{align-self:flex-start;margin-top:4px}
.drawer.pod{z-index:46}.drawer.pod~.scrim,#drawerHost .scrim{z-index:45}
.pok{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pok>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.pok small{display:block;color:var(--muted);font-size:12px}.pok b{font-size:17px;font-variant-numeric:tabular-nums}
.poc .poh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.poc .poh b{font-size:15px}
.pot{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px}.pot b{font-variant-numeric:tabular-nums}
.pol{width:100%;border-collapse:collapse;font-size:13px}.pol th,.pol td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.pol th{color:var(--muted);font-weight:600;font-size:12px}.pol .n{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:520px){.pok{grid-template-columns:repeat(2,1fr)}}
.tchip.rtc{color:#B45309;border-color:#F3C98B;background:#FFF6EA}
:root[data-theme="dark"] .tchip.rtc{color:#F6B66B;border-color:#6B4A1E;background:#2A2013}
.rtq{color:#B45309;font-weight:600}:root[data-theme="dark"] .rtq{color:#F6B66B}
.stop.rt{border-left:3px solid #E59A3C}.stop.rt.tbd{border-left-style:dashed}
.rtbox{border-color:#F3C98B}.rtloc{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tl .ti.rt::before{border-color:#E59A3C}
.lpds{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface)}
.lpdh{padding:9px 12px;font-weight:700;background:var(--mallbg,var(--surface2));display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lpdt{width:100%;border-collapse:collapse;font-size:13px}.lpdt th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 12px;border-bottom:1px solid var(--line)}
.lpdt td{padding:7px 12px;border-bottom:1px dashed var(--line);vertical-align:top}.lpdt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lpdt tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line);background:var(--surface2)}
.lpsk{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}.lpsk b{color:var(--ink);font-weight:600}
.lpq{float:right;font-weight:700;font-variant-numeric:tabular-nums;margin-left:10px}
.sqx{padding:10px 12px;border-top:1px dashed var(--line);background:var(--mallbg,var(--surface2));display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:1px}
/* จุดส่งในแถว: เห็นครบทุกจุด */
.sl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;align-items:baseline;font-size:13px}
.sl + .sl{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.sl .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--info);font-size:12.5px;min-width:44px}
.sl .t.no{color:var(--muted);font-weight:500}
.sl .nm{font-weight:600}
.sl .sub{grid-column:2;color:var(--muted);font-size:12px}

function lpImport(d){const keys=new Set(),miss=new Set();let add=0,upd=0,rm=0,lost=0;
  (d.trucks||[]).forEach(t=>{const key=d.date+'#'+t.id;keys.add(key);
    const stops=t.stops.map(s=>{const id=DCST[s.dc];const b=id&&ST.find(x=>x.id===id);if(!b)miss.add(s.dc);
      return Object.assign(b?S(id):{id:null,n:s.dc+' '+s.n,km:null,pal:'',cs:'',at:''},{pal:String(s.pal),cs:String(s.cs),at:s.t||'',po:s.po||[],items:s.items||[],kg:s.kg||0});});
    const size=LPSZ[t.k]||'พ่วง',note='PO '+t.stops.flatMap(s=>s.po).join(', ')+' · ขึ้นของ '+t.load+' · ส่ง '+d.dateTH+' (Loading Planner คัน #'+t.id+')';
    const j=MJ.find(x=>x.lp===key);
    if(j){if(j.size!==size&&j.head){j.head='';j.driver='';lost++;}j.size=size;j.stops=stops;j.note=note;upd++;}
    else{MJ.push({id:'H'+(++MJN),size,stops,head:'',driver:'',note,lp:key});add++;}});
  MJ=MJ.filter(j=>{if(j.lp&&j.lp.indexOf(d.date+'#')===0&&!keys.has(j.lp)){rm++;return false;}return true;});
  const pn=(d.pending||[]).length;MP[d.date]={th:d.dateTH,list:d.pending||[]};   /* ส่งซ้ำ = แทนรายการ Pending ของวันส่งนั้นทั้งชุด */
  syncMall();JE=null;MSUB='jobs';renderAll();window.scrollTo({top:0});
  toast('รับจาก Loading Planner ส่ง '+d.dateTH+': งานใหม่ '+add+(upd?' · อัปเดต '+upd:'')+(rm?' · ถอน '+rm:'')+(pn?' · ⏳ Pending '+pn+' PO (รอจัดรถ)':'')+(lost?' · เปลี่ยนขนาด '+lost+' งาน ต้องใส่รถใหม่':'')+(miss.size?' · ⚠ ไม่พบสถานี '+[...miss].join(', '):'')+' · ใส่รถ+คนขับตามพี่ปุ๋ยแจ้ง แล้วกดแจกงาน');}

/* อ่านไฟล์: ทุกชีต · หาแถวหัวจากคำ (ลำดับ / นัดส่ง / SO / P/O / รายการสินค้า / จำนวน / สถานที่ส่ง) · แถวที่มีแต่สินค้า+จำนวน = รายการต่อของ PO ข้างบน */
function lpDate(v){if(v==null||v==='')return'';if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10);}
  if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const m=String(v).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
  const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:String(v).trim();}
function lpParse(wb){const rows=[],skip=[];
  wb.SheetNames.forEach(sn=>{const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});const col={};
    const K=[['seq',/^ลำดับ/],['date',/นัดส่ง|ว\/ด\/ป/],['so',/^เลขที่\s*SO|^SO\b/i],['po',/P\/O|^PO\b/i],['p',/รายการสินค้า|^สินค้า/],['q',/^จำนวน/],['dc',/สถานที่ส่ง|^คลัง|ปลายทาง/]];
    let hr=-1;for(let r=0;r<Math.min(A.length,10);r++){(A[r]||[]).forEach((c,ci)=>{const s=String(c).replace(/\s+/g,' ').trim();K.forEach(([k,re])=>{if(col[k]==null&&s&&re.test(s)){col[k]=ci;hr=Math.max(hr,r);}});});}
    if(col.po==null||col.p==null||col.q==null){skip.push(sn);return;}
    let cur=null;for(let r=hr+1;r<A.length;r++){const R=A[r]||[],g=k=>col[k]==null?'':R[col[k]];
      const po=String(g('po')).trim(),p=String(g('p')).replace(/\s+/g,' ').trim(),q=g('q');
      if(po){cur={po,so:String(g('so')).trim(),seq:Number(g('seq'))||null,date:lpDate(g('date')),dc:String(g('dc')).replace(/\s+/g,' ').trim(),lines:[],sheet:sn,row:r+1};rows.push(cur);}
      else if(!p)cur=null;   /* แถวว่าง = จบ PO */
      if(cur&&p)cur.lines.push({p,q:typeof q==='number'?q:Number(String(q).replace(/,/g,''))});}});
  return {rows,skip};}
async function lpPick(file){if(LPX.busy)return;LPX.busy=true;const b=$('lpImp'),t0=b&&b.textContent;if(b){b.disabled=true;b.textContent='⏳ กำลังอ่านไฟล์…';}

function lpDaySum(rows,r){const bad=new Set(r.errors.map(x=>x.po)),good=(rows||[]).filter(x=>!bad.has(x.po));if(!good.length)return '';

    +'</tbody><tfoot><tr><td>รวม '+ds.length+' วัน</td><td class="n">'+good.length+'</td><td class="n">'+allDc.size+'</td><td class="n">'+lpQn(T)+'</td></tr></tfoot></table></div>'

function sync(){if(!ED)return;const p=ED.p;

let WITHJOB=true,IMG='',RCV=null;
/* เขียว = พร้อมใช้งาน มีคนขับ · เหลือง = พร้อม แต่ไม่มีคนขับ · แดง = ซ่อม · เทา = งดวิ่ง / หางสำรอง */
const DOT={job:'#16A34A',wait:'#16A34A',nod:'#EAB308',rep:'#DC2626',off:'#9CA3AF',tail:'#9CA3AF'};
function stTxt(v,k,p){return k==='rep'?(p.reason||'ซ่อม'):k==='off'?'งดวิ่ง'+(p.reason?' · '+p.reason:''):k==='tail'?'หางสำรอง':k==='nod'?'พร้อม · ไม่มีคนขับ':k==='job'?'ออกงาน'+(otOnly(p)?' · '+p.ot:''):'พร้อม · รอมีงาน';}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function dot(x,cx,cy,r,col,hollow){x.beginPath();x.arc(cx,cy,r+4,0,Math.PI*2);x.fillStyle=col+'2E';x.fill();
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(hollow){x.lineWidth=3;x.strokeStyle=col;x.stroke();}else{x.fillStyle=col;x.fill();}}
async function drawReport(){
  try{await document.fonts.load('700 22px "IBM Plex Sans Thai"');await document.fonts.load('700 30px "Anuphan"');}catch(e){}

  /* หัว */

  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle='#E9CF6E';x.font=F('600',20);x.fillText('SSB Smart Supply · Packing',PAD,56);
  x.fillStyle='#FFFFFF';x.font=F('700',40,'"Anuphan", "IBM Plex Sans Thai", sans-serif');x.fillText('สรุปสถานะรถ PK ประจำวัน',PAD,108);
  x.fillStyle='#CFE3D6';x.font=F('500',22);x.fillText(dateTH($('pdate').value),PAD,146);

  const tw=(W-PAD*2-3*14)/4;

    x.fillStyle='#5D6E63';x.font=F('600',17);x.textAlign='left';x.fillText(l,X+(i?46:20),Y+36);

  });

  let y=HEAD+KP;const brk=[y];
  groups.forEach(g=>{const vs=VEH.filter(v=>v.g===g),h=GH+vs.length*RH;
    x.fillStyle='#FFFFFF';rrect(x,PAD,y,W-PAD*2,h,18);x.fill();
    x.save();rrect(x,PAD,y,W-PAD*2,h,18);x.clip();
    x.fillStyle='#F4F7F4';x.fillRect(PAD,y,W-PAD*2,GH);
    x.fillStyle='#14261C';x.font=F('700',21,'"Anuphan", "IBM Plex Sans Thai", sans-serif');x.textAlign='left';x.textBaseline='middle';x.fillText(g,PAD+22,y+GH/2);
    const gr=vs.filter(v=>['job','wait'].includes(kind(v))).length,gn=vs.filter(v=>kind(v)==='nod').length,gp=vs.filter(v=>kind(v)==='rep').length;
    x.font=F('500',16);x.fillStyle='#5D6E63';x.textAlign='right';
    x.fillText(vs.length+' คัน · พร้อม '+gr+(gn?' · ไม่มีคนขับ '+gn:'')+(gp?' · ซ่อม '+gp:''),W-PAD-22,y+GH/2);
    let ry=y+GH;
    vs.forEach((v,i)=>{const p=PLAN[v.head],k=kind(v),d=drvOf(p.driver);
      if(i){x.strokeStyle='#E3EAE5';x.lineWidth=1;x.beginPath();x.moveTo(PAD+20,ry);x.lineTo(W-PAD-20,ry);x.stroke();}

  y+=4;const leg=[['#16A34A','พร้อมใช้งาน มีคนขับ',0],['#EAB308','พร้อม ไม่มีคนขับ',0],['#DC2626','ซ่อม',0],['#9CA3AF','หางสำรอง / งดวิ่ง',1]];

  cv._brk=brk;RCV=cv;IMG=cv.toDataURL('image/png');return IMG;
}
function fitText(x,t,cx,cy,max,align){align=align||'center';x.textAlign=align;let s=t;
  while(x.measureText(s).width>max&&s.length>4)s=s.slice(0,-2);if(s!==t)s=s.slice(0,-1)+'…';x.fillText(s,cx,cy);}

    return {no:v.tail?'':i+1,plate:v.plate.split(',').map(s=>s.trim()).filter(Boolean).join(' / '),shape:[BRAND[v.head],v.shape].filter(Boolean).join(' · '),k,
      reason:(k==='rep'||k==='off')?String(p.reason||'').trim():'',drv:v.tail?'':d?d.name:'',first:S[0]?S[0].n:(otOnly(p)?'งานอื่นๆ · '+otLabel(p):''),at:S[0]?(S[0].at||''):'',n:S.length};})})).filter(G=>G.rows.length);
  const dd=ok?String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+dt.getFullYear():'';

const rsName=(D,ext)=>'สถานะรถPK_'+D.iso.replace(/-/g,'')+'.'+ext;
async function rsPdf(cv){await mxLoad('jspdf');const {jsPDF}=window.jspdf;
  /* รูปเป็นแนวตั้ง → A4 แนวตั้ง · ยาวเกินหน้า = ตัดที่รอยต่อระหว่างแถว */
  const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'}),PW=595.28,PH=841.89,M=22,sc=(PW-M*2)/cv.width,maxH=(PH-M*2-14)/sc;
  const cuts=[0];let from=0;const b=cv._brk||[];
  while(cv.height-from>maxH){let c=b.filter(v=>v>from+40&&v-from<=maxH).pop();if(!c)c=from+maxH;cuts.push(c);from=c;}cuts.push(cv.height);
  for(let i=0;i<cuts.length-1;i++){const h=cuts[i+1]-cuts[i],pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;
    const px=pc.getContext('2d');px.fillStyle='#EEF3EF';px.fillRect(0,0,pc.width,h);px.drawImage(cv,0,cuts[i],cv.width,h,0,0,cv.width,h);
    if(i)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',M,M,cv.width*sc,h*sc);
    pdf.setFontSize(9);pdf.setTextColor(140);pdf.text((i+1)+' / '+(cuts.length-1),PW-M,PH-10,{align:'right'});}
  return new Blob([pdf.output('arraybuffer')],{type:'application/octet-stream'});}   /* octet-stream: แอป LINE ไม่เปิด PDF ค้างแทนดาวน์โหลด */

async function rsGo(kind,btn){const D=rsSheet();if(!D.rows.length){toast('ไม่มีรถให้ออกรายงาน');return;}
