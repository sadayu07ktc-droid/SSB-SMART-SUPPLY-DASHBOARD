<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ตารางงานคนขับ — SSB</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --card:#FFFFFF; --sunken:#F3F6F3; --ink:#152019; --muted:#5D6B62; --faint:#8A968D;
  --line:#DCE4DE; --line-soft:#E9EEEA; --green:#1B4332; --green2:#2D6A4F; --gold:#B7892A;
  --sans:"Noto Sans Thai","Sarabun","Segoe UI",sans-serif; --num:"Space Grotesk",ui-monospace,monospace;
  /* สถานะงาน */
  --st-wait:#B7892A; --st-wait-bg:#FBF1DC; --st-confirm:#2F6FD6; --st-confirm-bg:#E6EFFB;
  --st-assign:#6D5AE0; --st-assign-bg:#EDEAFB; --st-run:#1E7A4C; --st-run-bg:#E3F3EA;
  --st-done:#14532D; --st-done-bg:#DCEBE1; --st-cancel:#C0392B; --st-cancel-bg:#FBE7E4;
  --st-nodrv:#E11D48; --st-nodrv-bg:#FCE7EC;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --card:#141D18; --sunken:#1A241E; --ink:#E7EEE9; --muted:#9AA79E; --faint:#748076;
  --line:#24302A; --line-soft:#1E2822; --green:#0F2A20; --green2:#2D6A4F; --gold:#E7CE86;
  --st-wait-bg:#2A2313; --st-confirm-bg:#12233A; --st-assign-bg:#1C1836; --st-run-bg:#15281E;
  --st-done-bg:#12281B; --st-cancel-bg:#2E1714; --st-nodrv-bg:#2E121C;
}}
:root[data-theme="dark"]{
  --bg:#0D1411; --card:#141D18; --sunken:#1A241E; --ink:#E7EEE9; --muted:#9AA79E; --faint:#748076;
  --line:#24302A; --line-soft:#1E2822; --green:#0F2A20; --green2:#2D6A4F; --gold:#E7CE86;
  --st-wait-bg:#2A2313; --st-confirm-bg:#12233A; --st-assign-bg:#1C1836; --st-run-bg:#15281E;
  --st-done-bg:#12281B; --st-cancel-bg:#2E1714; --st-nodrv-bg:#2E121C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:16px 16px 40px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer}
.badge{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:19px;font-weight:800}.top p{margin:0;font-size:12px;color:var(--muted)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.nav{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.nav button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.nav .lbl{padding:0 8px;font-size:13px;font-weight:700;min-width:150px;text-align:center}
.tgl{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.tgl button{border:0;background:transparent;font-size:15px;padding:5px 8px;border-radius:8px;cursor:pointer;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;font-size:11.5px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 13px;min-width:96px}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-family:var(--num);font-weight:700;font-size:19px}.stat .v small{font-size:12px;color:var(--faint);font-weight:500}
/* board */
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 210px)}
.grid{display:grid;min-width:max-content}
.gh{position:sticky;top:0;z-index:5;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;padding:9px 8px;text-align:center;color:var(--muted)}
.gh.today{color:var(--green2);background:var(--st-run-bg)}
.gh small{display:block;font-weight:500;font-size:10.5px;color:var(--faint)}
.dcell{position:sticky;left:0;z-index:6;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);padding:8px 10px;min-width:186px;display:flex;align-items:center;gap:9px}
.gh.dcell{z-index:8}
.av{width:34px;height:34px;border-radius:9px;background:var(--sunken);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green2);flex:none}
.dn{min-width:0}.dn b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.dn .pl{font-family:var(--num);font-size:11px;color:var(--muted)}
.freechip{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:auto;flex:none}
.freechip.free{background:var(--sunken);color:var(--faint)}
.freechip.busy{background:var(--st-run-bg);color:var(--st-run)}
.cell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:5px;min-height:52px;display:flex;flex-direction:column;gap:4px}
.cell.today{background:color-mix(in srgb,var(--st-run-bg) 45%,transparent)}
.cell.rowbusy{}
.job{border-radius:8px;padding:5px 7px;cursor:pointer;border-left:3px solid;transition:transform .12s,box-shadow .12s;font-size:11.5px}
.job:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(20,40,25,.4)}
.job .jt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.job .jtime{font-family:var(--num);font-weight:700;font-size:11.5px}
.job .jkm{font-family:var(--num);font-size:10.5px;font-weight:700;opacity:.9}
.job .jdest{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;margin-top:1px}
.job .jkmbar{height:3px;border-radius:2px;margin-top:4px;opacity:.85}
.empty-cell{color:var(--faint);font-size:11px;text-align:center;align-self:center;margin:auto;opacity:.5}
/* day gantt */
.gantt-track{position:relative;border-bottom:1px solid var(--line-soft);height:56px}
.gantt-hour{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-soft)}
.gantt-job{position:absolute;top:6px;height:44px;border-radius:8px;border-left:3px solid;padding:4px 7px;cursor:pointer;overflow:hidden;font-size:11px}
.gantt-job:hover{box-shadow:0 6px 16px -8px rgba(20,40,25,.5);z-index:3}
.msg{text-align:center;color:var(--muted);padding:50px 16px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.2s;z-index:40}.ov.on{opacity:1;visibility:visible}
.dr{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--card);box-shadow:-8px 0 30px rgba(0,0,0,.28);transform:translateX(105%);transition:.24s;z-index:41;overflow-y:auto}.dr.on{transform:translateX(0)}
.drh{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:18px 20px;position:relative}
.drh h3{margin:0;font-size:17px;font-weight:700}.drh .x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px}
.drb{padding:16px 20px 40px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.stpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
@media(max-width:640px){.dcell{min-width:150px}.dn b{max-width:90px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">กำลังโหลด...</div></div>
<div class="ov" id="ov" onclick="closeDr()"></div>
<aside class="dr" id="dr"></aside>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw4UvKuRrAQ_3Ldm8U0VJqfjfBQUSYaTEdrxkdXUVN98G68XseCquhDeXfMgU8cVYaY/exec';
const LIFF_ID='2010274217-Ot7vGhri';
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
let MY_UID='', VIEW='week', ANCHOR=new Date(), DATA=null, LOADING=false;
const _CB='&_v='+Date.now();

const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THDOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseIso(s){const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}

// ── สถานะ → สี/กลุ่ม ──
function stInfo(s){
  s=String(s||'').trim();
  if(s==='ยกเลิก') return {c:'--st-cancel',bg:'--st-cancel-bg',g:'cancel',lbl:'ยกเลิก'};
  if(s==='เสร็จงาน'||s==='จัดส่งสำเร็จ') return {c:'--st-done',bg:'--st-done-bg',g:'done',lbl:'เสร็จงาน'};
  if(s==='ไม่มีคนขับรับงาน'||s==='รอคนขับรับงาน') return {c:'--st-nodrv',bg:'--st-nodrv-bg',g:'nodrv',lbl:'รอคนขับ'};
  if(s==='เริ่มงานแล้ว'||s==='ถึงลูกค้า'||s==='ออกจากลูกค้า'||s==='ถึงลานวางกระบะ'||s==='ถึงลานขากลับ') return {c:'--st-run',bg:'--st-run-bg',g:'run',lbl:s};
  if(s==='รับงานแล้ว') return {c:'--st-assign',bg:'--st-assign-bg',g:'assign',lbl:'รับงานแล้ว'};
  if(s==='ยืนยันแล้ว') return {c:'--st-confirm',bg:'--st-confirm-bg',g:'confirm',lbl:'ยืนยันแล้ว'};
  return {c:'--st-wait',bg:'--st-wait-bg',g:'wait',lbl:s||'รอยืนยัน'};
}
const isActive=s=>{const g=stInfo(s).g;return g!=='cancel';};

function rangeFor(){
  if(VIEW==='day'){const d=new Date(ANCHOR);d.setHours(0,0,0,0);return {from:d,to:d,days:[d]};}
  if(VIEW==='month'){const y=ANCHOR.getFullYear(),m=ANCHOR.getMonth();const from=new Date(y,m,1),to=new Date(y,m+1,0);const days=[];for(let i=1;i<=to.getDate();i++)days.push(new Date(y,m,i));return {from,to,days};}
  const from=mondayOf(ANCHOR);const days=[];for(let i=0;i<7;i++)days.push(addDays(from,i));return {from,to:days[6],days};
}
function rangeLabel(){
  const {from,to}=rangeFor();
  if(VIEW==='day') return THDOW[from.getDay()]+'. '+from.getDate()+' '+THMON[from.getMonth()]+' '+(from.getFullYear()+543);
  if(VIEW==='month') return THMON[from.getMonth()]+' '+(from.getFullYear()+543);
  return from.getDate()+' '+THMON[from.getMonth()]+' – '+to.getDate()+' '+THMON[to.getMonth()]+' '+(to.getFullYear()+543);
}

async function load(){
  const {from,to}=rangeFor();
  LOADING=true; renderShell();
  try{
    const r=await fetch(GAS_URL+'?action=getScheduleBoard&userId='+encodeURIComponent(MY_UID)+'&from='+iso(from)+'&to='+iso(to)+_CB);
    const d=await r.json();
    if(d.denied){ $('#app').innerHTML='<div class="msg" style="color:var(--st-cancel)">ไม่มีสิทธิ์ (เฉพาะแอดมิน/ผู้บริหาร)</div>'; return; }
    if(!d.ok){ $('#app').innerHTML='<div class="msg">'+(d.error||'โหลดข้อมูลไม่ได้')+'</div>'; return; }
    DATA=d;
  }catch(e){ $('#app').innerHTML='<div class="msg" style="color:var(--st-cancel)">เชื่อมต่อไม่ได้ — ลองใหม่</div>'; return; }
  LOADING=false; render();
}

function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sch_theme',t)}catch(e){}}
function setView(v){ if(v===VIEW)return; VIEW=v; load(); }
function step(n){ if(VIEW==='day')ANCHOR=addDays(ANCHOR,n); else if(VIEW==='month')ANCHOR=new Date(ANCHOR.getFullYear(),ANCHOR.getMonth()+n,1); else ANCHOR=addDays(ANCHOR,n*7); load(); }
function goToday(){ ANCHOR=new Date(); load(); }

function headBar(){
  return `<div class="top">
    <button class="back" onclick="history.length>1?history.back():location.href='./'">←</button>
    <div class="badge">🗓️</div>
    <div><h1>ตารางงานคนขับ</h1><p>ใครว่าง–ใครมีงาน · เวลานัด + ระยะทาง</p></div>
    <div class="sp"></div>
    <div class="seg" id="viewSeg">
      <button data-v="day" ${VIEW==='day'?'class="on"':''} onclick="setView('day')">วัน</button>
      <button data-v="week" ${VIEW==='week'?'class="on"':''} onclick="setView('week')">สัปดาห์</button>
      <button data-v="month" ${VIEW==='month'?'class="on"':''} onclick="setView('month')">เดือน</button>
    </div>
    <div class="nav"><button onclick="step(-1)">‹</button><span class="lbl">${rangeLabel()}</span><button onclick="step(1)">›</button></div>
    <button class="back" title="วันนี้" onclick="goToday()" style="width:auto;padding:0 12px;font-size:13px;font-weight:700">วันนี้</button>
    <div class="tgl"><button onclick="setTheme('light')">☀️</button><button onclick="setTheme('dark')">🌙</button></div>
  </div>`;
}
function legendBar(){
  const items=[['--st-wait','รอยืนยัน'],['--st-confirm','ยืนยันแล้ว'],['--st-assign','รับงานแล้ว'],['--st-run','กำลังวิ่ง'],['--st-done','เสร็จงาน'],['--st-nodrv','รอคนขับ'],['--st-cancel','ยกเลิก']];
  return '<div class="legend">'+items.map(([c,l])=>`<span class="lg"><i style="background:var(${c})"></i>${l}</span>`).join('')+'<span class="lg" style="color:var(--faint)">▬ ความยาวแถบล่าง = ระยะทาง (กม.)</span></div>';
}
function renderShell(){ $('#app').innerHTML=headBar()+legendBar()+'<div class="msg">กำลังโหลดข้อมูล...</div>'; }

function ordersByDriver(){
  const map={}, un=[];
  const byUid={}, byPlate={}, byName={};
  (DATA.drivers||[]).forEach(d=>{ if(d.uid)byUid[d.uid]=d; if(d.plate)byPlate[d.plate]=d; if(d.name)byName[d.name]=d; });
  (DATA.orders||[]).forEach(o=>{
    let d = (o.driverUid&&byUid[o.driverUid]) || (o.plate&&byPlate[o.plate]) || (o.driverName&&byName[o.driverName]);
    if(d){ (map[d.uid||d.name]=map[d.uid||d.name]||[]).push(o); }
    else if(o.driverName||o.plate||isActive(o.status)){ un.push(o); }
  });
  return {map,un};
}

function jobChip(o){
  const st=stInfo(o.status), km=Number(o.distanceKm)||0;
  const kmw=Math.max(6,Math.min(100,km/40*100));   // 40กม.=เต็มแถบ
  return `<div class="job" style="background:var(${st.bg});border-left-color:var(${st.c})" onclick="openJob('${o.orderId}')">
    <div class="jt"><span class="jtime" style="color:var(${st.c})">${o.time||'—'}</span>${km>0?`<span class="jkm" style="color:var(${st.c})">${fmt(km)} กม.</span>`:''}</div>
    <div class="jdest" title="${(o.dest||o.pickup||'').replace(/"/g,'&quot;')}">${o.dest||o.pickup||'(งาน)'}</div>
    ${km>0?`<div class="jkmbar" style="width:${kmw}%;background:var(${st.c})"></div>`:''}
  </div>`;
}

function render(){
  const {days}=rangeFor(), tIso=iso(new Date());
  const {map,un}=ordersByDriver();
  // summary
  const drivers=DATA.drivers||[];
  const busyUids=new Set(Object.keys(map).filter(k=>(map[k]||[]).some(o=>isActive(o.status))));
  const totalJobs=(DATA.orders||[]).filter(o=>isActive(o.status)).length;
  const totalKm=(DATA.orders||[]).reduce((s,o)=>s+(isActive(o.status)?(Number(o.distanceKm)||0):0),0);
  const summary=`<div class="summary">
    <div class="stat"><div class="k">คนขับทั้งหมด</div><div class="v">${drivers.length}<small> คน</small></div></div>
    <div class="stat"><div class="k">มีงาน</div><div class="v" style="color:var(--st-run)">${busyUids.size}<small> คน</small></div></div>
    <div class="stat"><div class="k">ว่าง</div><div class="v" style="color:var(--faint)">${Math.max(0,drivers.length-busyUids.size)}<small> คน</small></div></div>
    <div class="stat"><div class="k">งานในช่วงนี้</div><div class="v">${totalJobs}<small> งาน</small></div></div>
    <div class="stat"><div class="k">ระยะทางรวม</div><div class="v">${fmt(totalKm)}<small> กม.</small></div></div>
  </div>`;

  let boardHtml;
  if(VIEW==='day') boardHtml=renderDay(days[0],map,un,tIso);
  else boardHtml=renderGrid(days,map,un,tIso);

  $('#app').innerHTML=headBar()+legendBar()+summary+boardHtml;
  try{const s=localStorage.getItem('sch_theme');if(s)setTheme(s);}catch(e){}
}

// ── week / month = ตารางแถว(คนขับ) × คอลัมน์(วัน) ──
function renderGrid(days,map,un,tIso){
  const drivers=DATA.drivers||[];
  const colW = VIEW==='month' ? 92 : 150;
  const cols = `186px repeat(${days.length}, minmax(${colW}px, 1fr))`;
  let h='<div class="board"><div class="grid" style="grid-template-columns:'+cols+'">';
  // header row
  h+='<div class="gh dcell" style="justify-content:flex-start"><b style="font-size:12px">คนขับ / คัน</b></div>';
  days.forEach(d=>{const t=iso(d)===tIso;h+=`<div class="gh${t?' today':''}">${THDOW[d.getDay()]} ${d.getDate()}<small>${THMON[d.getMonth()]}</small></div>`;});
  // unassigned row (ถ้ามี)
  if(un.length){
    h+=`<div class="dcell" style="background:var(--st-nodrv-bg)"><div class="av" style="background:var(--st-nodrv-bg);color:var(--st-nodrv)">!</div><div class="dn"><b>ยังไม่มอบหมาย</b><span class="pl">${un.length} งาน</span></div></div>`;
    days.forEach(d=>{const dd=iso(d);const jobs=un.filter(o=>o.date===dd);const t=dd===tIso;h+=`<div class="cell${t?' today':''}">${jobs.map(jobChip).join('')||'<span class="empty-cell">·</span>'}</div>`;});
  }
  // driver rows
  drivers.forEach(dr=>{
    const jobs=map[dr.uid||dr.name]||[];
    const busy=jobs.some(o=>isActive(o.status));
    h+=`<div class="dcell"><div class="av">${(dr.name||'?').slice(0,1)}</div><div class="dn"><b title="${(dr.name||'').replace(/"/g,'&quot;')}">${dr.name}</b><span class="pl">${dr.plate||'—'}${dr.vehicleType?' · '+dr.vehicleType:''}</span></div><span class="freechip ${busy?'busy':'free'}">${busy?'มีงาน':'ว่าง'}</span></div>`;
    days.forEach(d=>{const dd=iso(d);const dj=jobs.filter(o=>o.date===dd).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const t=dd===tIso;h+=`<div class="cell${t?' today':''}">${dj.map(jobChip).join('')||'<span class="empty-cell">ว่าง</span>'}</div>`;});
  });
  h+='</div></div>';
  return h;
}

// ── day = แกนเวลา (Gantt) ──
function renderDay(day,map,un,tIso){
  const drivers=DATA.drivers||[];
  const H0=5,H1=21;                 // 05:00–21:00
  const hours=H1-H0;
  const dd=iso(day);
  const rows=[];
  if(un.length){const j=un.filter(o=>o.date===dd);if(j.length)rows.push({dr:{name:'ยังไม่มอบหมาย',plate:j.length+' งาน',uid:'__un'},jobs:j,un:true});}
  drivers.forEach(dr=>{const jobs=(map[dr.uid||dr.name]||[]).filter(o=>o.date===dd);rows.push({dr,jobs});});
  const trackW=Math.max(760, hours*70);
  const cols=`186px ${trackW}px`;
  const x=t=>{const m=(t||'').match(/(\d{1,2}):(\d{2})/);if(!m)return null;const h=+m[1]+(+m[2])/60;return Math.max(0,Math.min(1,(h-H0)/hours))*trackW;};
  let h='<div class="board"><div class="grid" style="grid-template-columns:'+cols+'">';
  // header
  h+='<div class="gh dcell" style="justify-content:flex-start"><b style="font-size:12px">คนขับ / คัน</b></div>';
  h+='<div class="gh" style="position:relative;padding:0;height:30px">';
  for(let hh=H0;hh<=H1;hh++){const px=(hh-H0)/hours*trackW;h+=`<span style="position:absolute;left:${px}px;top:7px;transform:translateX(-50%);font-size:10px;color:var(--faint)">${String(hh).padStart(2,'0')}:00</span>`;}
  h+='</div>';
  rows.forEach(r=>{
    const busy=r.jobs.some(o=>isActive(o.status));
    h+=`<div class="dcell" ${r.un?'style="background:var(--st-nodrv-bg)"':''}><div class="av" ${r.un?'style="color:var(--st-nodrv)"':''}>${r.un?'!':(r.dr.name||'?').slice(0,1)}</div><div class="dn"><b>${r.dr.name}</b><span class="pl">${r.dr.plate||'—'}${r.dr.vehicleType?' · '+r.dr.vehicleType:''}</span></div>${r.un?'':`<span class="freechip ${busy?'busy':'free'}">${busy?'มีงาน':'ว่าง'}</span>`}</div>`;
    let track='<div class="gantt-track" style="width:'+trackW+'px">';
    for(let hh=H0;hh<=H1;hh++){track+=`<div class="gantt-hour" style="left:${(hh-H0)/hours*trackW}px"></div>`;}
    r.jobs.forEach((o,i)=>{
      const st=stInfo(o.status);let left=x(o.time);const noTime=left==null;if(noTime)left=6;
      const km=Number(o.distanceKm)||0;const w=Math.max(96,Math.min(220,80+km/40*140));
      const lane=i%1;  // simple: same row; overlaps handled by z-order/opacity
      track+=`<div class="gantt-job" style="left:${left}px;width:${w}px;background:var(${st.bg});border-left-color:var(${st.c})" onclick="openJob('${o.orderId}')">
        <div class="jt"><span class="jtime" style="color:var(${st.c})">${o.time||'ไม่ระบุ'}</span>${km>0?`<span class="jkm" style="color:var(${st.c})">${fmt(km)}กม.</span>`:''}</div>
        <div class="jdest">${o.dest||o.pickup||'(งาน)'}</div></div>`;
    });
    track+='</div>';
    h+=track;
  });
  h+='</div></div>';
  return h;
}

function openJob(id){
  const o=(DATA.orders||[]).find(x=>x.orderId===id);if(!o)return;
  const st=stInfo(o.status), km=Number(o.distanceKm)||0;
  const dr=(DATA.drivers||[]).find(d=>d.uid===o.driverUid||d.plate===o.plate||d.name===o.driverName);
  $('#dr').innerHTML=`<div class="drh"><button class="x" onclick="closeDr()">✕</button>
      <div style="font-size:11.5px;opacity:.85">${o.orderId}</div><h3>${o.dest||o.pickup||'งาน'}</h3>
      <div style="margin-top:8px"><span class="stpill" style="background:rgba(255,255,255,.16);color:#fff">● ${st.lbl}</span></div></div>
    <div class="drb">
      <div class="kv"><span class="k">คนขับ</span><span class="v">${o.driverName||dr&&dr.name||'— ยังไม่มอบหมาย'}</span></div>
      <div class="kv"><span class="k">ทะเบียน</span><span class="v num">${o.plate||dr&&dr.plate||'—'}</span></div>
      <div class="kv"><span class="k">วันที่นัด</span><span class="v">${o.date}</span></div>
      <div class="kv"><span class="k">เวลานัด</span><span class="v num">${o.time||'—'}</span></div>
      <div class="kv"><span class="k">ประเภทงาน</span><span class="v">${o.jobType||'—'}</span></div>
      <div class="kv"><span class="k">จุดรับ</span><span class="v">${o.pickup||'—'}</span></div>
      ${o.bins?`<div class="kv"><span class="k">จำนวนกระบะ</span><span class="v num">${o.bins}</span></div>`:''}
      <div class="kv"><span class="k">ระยะทาง</span><span class="v num" style="color:var(${st.c})">${km>0?fmt(km)+' กม.':'—'}</span></div>
      ${o.startTime?`<div class="kv"><span class="k">เริ่มงานจริง</span><span class="v num">${o.startTime}</span></div>`:''}
      ${o.doneTime?`<div class="kv"><span class="k">เสร็จงานจริง</span><span class="v num">${o.doneTime}</span></div>`:''}
    </div>`;
  $('#dr').classList.add('on');$('#ov').classList.add('on');
}
function closeDr(){$('#dr').classList.remove('on');$('#ov').classList.remove('on');}

(async function init(){
  const q=new URLSearchParams(location.search).get('uid');
  if(q){ MY_UID=q; }
  else{
    try{ await liff.init({liffId:LIFF_ID}); if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;} const p=await liff.getProfile(); MY_UID=p.userId||''; }
    catch(e){ $('#app').innerHTML='<div class="msg" style="color:var(--st-cancel)">เข้าระบบ LINE ไม่สำเร็จ</div>'; return; }
  }
  try{const s=localStorage.getItem('sch_theme');if(s)setTheme(s);}catch(e){}
  load();
})();
</script>
