<html lang="th">
<head>

<style>
  :root{--bg:#eef1f4;--card:#fff;--card2:#f6f8fa;--line:#e2e6ea;--line2:#cfd5db;--txt:#1a2530;--txt2:#6b7785;--primary:#1f8a52;--accent:#0d6efd;--warn:#b8860b;--danger:#c8352f;--gold1:#a77b12;--gold2:#d4a72c}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#182028;--card2:#1f2830;--line:#2a343d;--line2:#3a4650;--txt:#e6ebf0;--txt2:#8a97a3;--primary:#2ea567;--accent:#4a9bff;--warn:#e0b84a;--danger:#e5645d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;line-height:1.5;padding:16px 12px 40px}
  .wrap{max-width:1180px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;padding:2px 2px 14px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--txt2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .grow{flex:1}
  .btn{padding:10px 18px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .btn.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2))}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt2);font-weight:500}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0 4px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:11.5px;color:var(--txt2)}
  .kpi.bad b{color:var(--danger)} .kpi.warn b{color:var(--warn)}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  th{background:var(--card2);font-size:11.5px;color:var(--txt2);font-weight:600;white-space:nowrap;position:sticky;top:0}
  tr.skip td{opacity:.5} tr.del td{background:rgba(200,53,47,.07);text-decoration:line-through}
  tr.add td:first-child{box-shadow:inset 3px 0 var(--primary)} tr.chg td:first-child{box-shadow:inset 3px 0 var(--warn)}
  td.cf{background:rgba(184,134,11,.13)}
  .how{font-size:10.5px;color:var(--txt2);display:block}
  .st-Waiting{color:var(--warn);border-color:var(--warn)} .st-Planned,.st-Loading{color:var(--accent);border-color:var(--accent)} .st-Delivered{color:var(--primary);border-color:var(--primary)} .st-ยกเลิก{color:var(--danger);border-color:var(--danger)}
  .dlg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
  .dlg-in{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .dlg-in.wide{max-width:760px;max-height:90vh;display:flex;flex-direction:column;padding:16px 16px 12px}
  .dq-list{overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  .dq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
  .dq-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .dq-h b{font-size:14px}
  .k-free{color:var(--primary);border-color:var(--primary)} .k-busy{color:var(--accent);border-color:var(--accent)} .k-repair{color:var(--warn);border-color:var(--warn)} .k-leave{color:var(--danger);border-color:var(--danger)}
  .dlg-in p{margin:8px 0 14px;font-size:13.5px;color:var(--txt2);white-space:pre-line}
  .stop+.stop{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  .store{font-size:11.5px;color:var(--txt);margin-top:3px} .store a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap} .store a:hover{text-decoration:underline}
  .miss{color:var(--danger);font-weight:600}
  .tag{display:inline-block;white-space:nowrap;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--txt2);margin:1px 2px 0 0}
  .tag.out{color:var(--warn);border-color:var(--warn)} .tag.bad{color:var(--danger);border-color:var(--danger)} .tag.ok{color:var(--primary);border-color:var(--primary)}
  select,input[list]{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line2);border-radius:7px;background:var(--card2);color:var(--txt);max-width:230px}
  .note{font-size:12px;color:var(--txt2);line-height:1.7}
  .msg{text-align:center;color:var(--txt2);padding:30px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:92vw}
  .toast.on{opacity:1}.toast.err{background:var(--danger)}
  .sticky{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 0 0;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button class="btn ghost" style="width:38px;height:38px;padding:0" onclick="history.length>1?history.back():location.href='./'" aria-label="กลับ">←</button>
    <div class="logo">📦</div>
    <div><h1>แจกงาน Packing</h1><div class="sub">อัปโหลดใบ "แจ้งงานคนขับและเด็กรถ ขนส่ง PK ประจำวัน" → ตรวจ → บันทึก → แจกงาน <span style="opacity:.6">· build 2026-10-30d</span></div></div>
  </div>
  <div id="body"><div class="msg">กำลังเข้าสู่ระบบ…</div></div>
</div>
<input type="file" id="file" accept=".xlsx,.xls" hidden>
<div class="toast" id="toast"></div>
<script>
const EDGE='https://abihhdjcrbvwlkzwvjio.supabase.co/functions/v1/pk-plan';
const LIFF_ID='2010274217-Ot7vGhri';
let MY_UID='', ME=null, PLAN=null, LK=null, UP=null, BUSY=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S=x=>String(x==null?'':x).replace(/\s+/g,' ').trim();
function toast(t,err){const e=$('toast');e.textContent=t;e.className='toast on'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>e.className='toast',3200);}
const thDate=iso=>{const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[3])+'/'+(+m[2])+'/'+(+m[1]+543):'—';};
async function get(a,extra){const r=await fetch(EDGE+'?action='+a+'&userId='+encodeURIComponent(MY_UID)+(extra||''));return r.json();}
async function post(b){const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({userId:MY_UID},b))});return r.json();}

/* ── อ่านไฟล์รายวัน (SheetJS) · คอลัมน์ A=0: ล้อ · ชื่อ · นามสกุล · ทะเบียน · ลูกค้า · เวลาลง · พาเลท · ลัง · ค่าลง · เด็กรถ · นัดเด็กรถ ──
   ⚙️ กติกาเดียวกับที่ทดสอบกับไฟล์ ก.ย. 69 (ตรง 403/439) · ห้ามใช้ \b กับภาษาไทย */
const PK_GROUPS=/^(4 ?ล้อ|6 ?ล้อ|10 ?ล้อ)/;   // เฉพาะรถ PK (คุณน้อง 27 ต.ค.) · ไม่เอา ขนส่งนอก / รถฝ่ายไร่
const NOJOB=/^(รอมีงาน|ออกเวร|รถสแปร์|สแปร์|แสปร์|ซ่อม|กลับจาก|ลา(\s|$|ป่วย|กิจ|พัก|บวช|คลอด)|หางผ้าใบสแปร์|หยุด|พักร้อน|เป็นเด็กรถ|แป็นเด็กรถ|เรียนงาน|ขาดงาน|ติดแอร์|ติดพัดลม|ติดฟิล์ม|ทำกระจก|ล้างรถ|ต่อภาษี|ต่อทะเบียน|ตรวจสภาพ|เช็คระยะ|ลงปูน|ซื้อของ|ลากหาง|ถ่ายน้ำมัน|เปลี่ยนน้ำมัน|เปลี่ยนยาง|ปะยาง|เข้าอู่|เข้าศูนย์|อัดจารบี|ล้างแอร์|เติมแอร์|\.+$|-+$)/;   // ถ่ายน้ำมันเครื่อง/ซ่อมบำรุงรถ = ไม่ใช่งาน (คุณน้อง 27 ต.ค.)
const DAY_JOB=/ดับเพลิง|ดับพลิง/;   // แสปร์ดับเพลิง = งานกดรับ ค่าแรงรายวัน (คุณน้อง 27 ต.ค.) · = pk-plan DAY_JOB
function parseSheet(aoa){
  let date='';
  for(const r of aoa.slice(0,4)){ const m=r.map(S).join(' ').match(/(\d{1,2})\.(\d{1,2})\.(25\d\d|20\d\d)/); if(m){ let y=+m[3]; if(y>2400)y-=543; date=y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2); break; } }
  const rows=[],off=[]; let g='',start=false,last=null,skipped=0;
  aoa.forEach((c,i)=>{
    const line=c.map(S).join(' ');
    if(/รายชื่อเด็กรถ/.test(line)){ start=null; return; }
    if(start===null) return;
    if(!start){ if(/ทะเบียนรถ/.test(line)&&/ลูกค้า/.test(line)) start=true; return; }
    if(S(c[0])) g=S(c[0]);
    const plate=S(c[3]), job=S(c[4]);
    if(!plate&&S(c[9])&&last){ last.helpers.push(S(c[9])); return; }
    last=null;
    if(!plate||!PK_GROUPS.test(g)||!job) return;
    if(!DAY_JOB.test(job)&&NOJOB.test(job)){ skipped++; off.push({row:i+1,name:S(S(c[1])+' '+S(c[2])).replace(/^\.+\s*/,''),plate,job}); return; }   // เก็บไว้โชว์คิวคนขับ (ลา/ซ่อม/รอมีงาน…)   // ไม่ใช่งาน (รอมีงาน/ซ่อม/ลา/ออกเวร/สแปร์/ซื้อของ…) = ตัดออกเลย (คุณน้อง 27 ต.ค.)
    last={row:i+1,group:g,name:S(S(c[1])+' '+S(c[2])).replace(/^\.+\s*/,''),plate,job,time:S(c[5]),pallet:S(c[6]),cases:S(c[7]),fee:S(c[8]),helpers:S(c[9])?[S(c[9])]:[],helperTime:S(c[10]),pick:true};
    rows.push(last);
  });
  return {date,rows,skipped,off};
}
function xlsxLib(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>no(new Error('โหลดตัวอ่าน Excel ไม่ได้'));document.head.appendChild(s);}); }
async function onFile(f){
  if(!f) return;
  try{
    const X=await xlsxLib(), wb=X.read(await f.arrayBuffer(),{type:'array'});
    const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    const p=parseSheet(aoa);
    if(!p.date) return toast('อ่านวันที่ไม่ได้ — แถวบนสุดต้องมีวันที่ เช่น "อังคาร 1.9.2569"',true);
    if(!p.rows.length) return toast('ไม่พบรถ PK ในไฟล์ — ใช้ไฟล์ "แจ้งงานคนขับและเด็กรถ ขนส่ง PK ประจำวัน"',true);
    UP={fileName:f.name,date:p.date,rows:p.rows,skipped:p.skipped,off:p.off,pv:null};
    await runPreview();
  }catch(e){ toast('อ่านไฟล์ไม่สำเร็จ: '+(e.message||e),true); }
}
async function runPreview(){
  if(!UP) return;
  const d=await post({action:'preview',date:UP.date,fileName:UP.fileName,rows:UP.rows});
  if(!d.ok){ toast('❌ '+(d.error||'ตรวจไฟล์ไม่สำเร็จ'),true); if(!UP.pv){UP=null;} return; }
  UP.pv=d; render();
}
function setRow(i,k,v){ const r=UP.rows[i]; if(!r) return; r[k]=v; clearTimeout(setRow._t); setRow._t=setTimeout(runPreview,250); }
async function saveUp(b){
  if(BUSY||!UP||!UP.pv) return; BUSY=true; b.disabled=true; b.textContent='กำลังบันทึก…';
  try{
    const d=await post({action:'commit',date:UP.date,fileName:UP.fileName,rows:UP.rows,off:UP.off||[]});
    if(!d.ok){ toast('❌ '+(d.error||'บันทึกไม่สำเร็จ'),true); if(d.table){UP.pv=d;render();} return; }
    const ln=d.line&&!d.line.error?' · ส่งการ์ด LINE: ใหม่ '+(d.line.sentNew||0)+' / แก้ '+(d.line.chg||0)+' / ยกเลิก '+(d.line.cx||0):'';
    toast('✅ บันทึกแพลน '+thDate(UP.date)+' '+d.revName+' แล้ว'+(d.remembered?' · จำการจับคู่ '+d.remembered+' รายการ':'')+ln);
    const date=UP.date; UP=null; await load(date);
  }catch(e){ toast('ไม่แน่ใจว่าบันทึกสำเร็จ — โหลดใหม่ให้ตรวจ',true); }
  finally{ BUSY=false; }
}

/* ── วาด ── */
const howTag=h=>h?'<span class="how">'+esc(h)+'</span>':'';
function drvCell(r,i,edit){
  const nm=r.driver_name?esc(r.driver_name)+(r.driver_active!==false?'':' <span class="tag bad" title="ยังไม่ได้เปิดใช้ LINE — จะไม่ได้การ์ดงาน">LINE ยังไม่เปิด</span>'):'<span class="miss">❌ หาไม่เจอ</span>';
  let h=nm+'<span class="how">ในไฟล์: '+esc(r.driver_raw||'—')+(r.driver_how?' · '+esc(r.driver_how):'')+'</span>';
  if(edit&&LK){ const cur=UP.rows[i].driverCode||'';
    h+='<select aria-label="เลือกคนขับ" onchange="setRow('+i+',\'driverCode\',this.value)"><option value="">'+(r.driver_code?'— เปลี่ยนคนขับ —':'— เลือกคนขับ —')+'</option>'
      +LK.drivers.filter(d=>d.group==='Packing'||d.code===cur||d.code===r.driver_code).map(d=>'<option value="'+esc(d.code)+'"'+(d.code===cur?' selected':'')+'>'+esc(d.name)+' · '+esc(d.group)+(d.active?'':' (LINE ยังไม่เปิด)')+'</option>').join('')+'</select>'; }
  return h;
}
// หลายจุดส่ง ("A + B + C") = 1 บรรทัดต่อจุด เลือกสถานีได้ทีละจุด · แถวเก่าไม่มี stops = จุดเดียว
const stopsOf=r=>Array.isArray(r.stops)?r.stops:(r.station_id||r.dest_text?[{name:r.dest_text,station_id:r.station_id,station_name:r.station_name,km:r.station_km,how:r.station_how}]:[]);
function stCell(r,i,edit){
  if(r.pay_mode==='day') return '<span class="tag out">ค่าแรงรายวัน</span><span class="how">ไม่มีปลายทาง · ไม่ต้องผูกค่ากลาง</span>';
  const ss=stopsOf(r), multi=ss.length>1;
  if(!ss.length) return '<span class="miss">ยังไม่ผูกค่ากลาง</span>';
  const LK_KM=(PLAN&&PLAN.longKm)||300, far=ss.some(s=>Number(s.km)>=LK_KM);
  return (far?'<span class="tag k-busy" title="ปลายทาง ≥ '+LK_KM+' กม. — นับเข้าคิวระยะไกล">🛣️ งานไกล</span>':'')+(multi?'<span class="tag ok">ส่ง '+ss.length+' จุด</span>':'')+ss.map((s,k)=>{
    let h='<div class="stop">'+(multi?'<b>'+(k+1)+'.</b> ':'')+(s.station_name?esc(s.station_name)+(s.km?' <span class="tag">'+esc(s.km)+' กม.</span>':''):'<span class="miss">'+(multi?esc(s.name)+' — ':'')+'ยังไม่ผูกค่ากลาง</span>')+howTag(s.how);
    if(!edit) h+=storeInfo(s);
    if(edit&&LK){ const cur=((UP.rows[i].stationIds||[])[k])||'';
      h+='<input list="stList" placeholder="พิมพ์ค้นสถานี…" aria-label="เลือกสถานีค่ากลาง จุดที่ '+(k+1)+'" value="'+esc(cur?((LK.stations.find(x=>String(x.id)===String(cur))||{}).name||''):'')+'" onchange="pickSt('+i+','+k+',this.value)">'; }
    return h+'</div>';
  }).join('');
}
// ทีมลง/เบอร์/ค่าลง/ค่าจอด รายร้าน (ไฟล์แอดมิน "เอกสารที่ต้องนำกลับ" · getPlan.stores) — แอดมินมอนิเตอร์โทรหาทีมลงได้
const telFmt=p=>p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p.length===9?p.slice(0,2)+'-'+p.slice(2,5)+'-'+p.slice(5):p;
function storeInfo(s){
  const st=s&&s.station_id&&PLAN&&PLAN.stores&&PLAN.stores[String(s.station_id)];
  if(!st||s.pickup||s.dist_only) return '';
  const fee=st.fees.map(f=>esc(f.fee)).join(' / '), park=st.parking.join(' / ');
  return '<div class="store">'+(st.team||st.phones.length?'📞 '+esc(st.team||'ทีมลง')+' '+st.phones.map(p=>'<a href="tel:'+esc(p)+'">'+esc(telFmt(p))+'</a>').join(' · '):'')
    +(fee||park?'<span class="how">'+(fee?'ค่าลง '+fee:'')+(park?(fee?' · ':'')+'จอด '+esc(park):'')+'</span>':'')+'</div>';
}
function pickSt(i,k,name){ const s=LK.stations.find(x=>x.name===name), r=UP.rows[i]; if(!r) return;
  const ids=(r.stationIds||[]).slice(); ids[k]=s?s.id:''; setRow(i,'stationIds',ids);
  if(name&&!s) toast('ไม่พบสถานีชื่อนี้ — เลือกจากรายการ',true); }
function qtyCell(r){
  const ss=stopsOf(r), unit=(v,u)=>esc(v)+(/^\d+$/.test(v)?' '+u:'');
  if(ss.length>1&&ss.some(s=>s.pallets||s.cases)) return ss.map((s,k)=>'<div class="stop"><b>'+(k+1)+'.</b> '+(s.pallets?unit(s.pallets,'เลท')+' ':'')+(s.cases?unit(s.cases,'ลัง'):'')+'</div>').join('');
  return (r.pallets?unit(r.pallets,'เลท'):'')+(r.cases?'<span class="how">'+unit(r.cases,'ลัง')+'</span>':'');
}
function helperCell(hs,time){
  if(!hs||!hs.length) return '<span class="how">ไม่มี</span>';
  return hs.map(h=>'<span class="tag'+(h.outside?' out':'')+'">'+esc(h.name)+(h.outside?' · นอก':'')+'</span>').join('')+(time?'<span class="how">นัด '+esc(time)+'</span>':'');
}
// CO / COA / PO = เอกสารที่คนขับต้องรับกลับ (คุณน้อง 30 ต.ค.) → ป้ายแยกจากงานเสริม (= pk-plan splitDocs)
const DOC_RE=/^(CO|COA|PO)$/i;
function splitDocs(t){ const s=S(t).replace(/[()]/g,' ');
  const docs=[...new Set(s.split(/\s*[+·,\/]\s*|\s+/).map(S).filter(p=>DOC_RE.test(p)).map(p=>p.toUpperCase()))];
  const rest=s.split(/\s*[+·,\/]\s*/).map(p=>S(p).split(' ').filter(w=>!DOC_RE.test(w)).join(' ')).filter(Boolean).join(' · ');
  return {docs,rest}; }
function extrasCell(extras,stops){
  const e=splitDocs(extras), docs=e.docs.slice();
  (Array.isArray(stops)?stops:[]).forEach(s=>splitDocs(s.task).docs.forEach(d=>{ if(docs.indexOf(d)<0) docs.push(d); }));
  return (docs.length?'<span class="tag out" title="คนขับต้องรับเอกสารกลับ">📄 รับเอกสารกลับ '+esc(docs.join(' · '))+'</span>':'')
    +(e.rest?'<span class="how">+ '+esc(e.rest)+'</span>':'');
}
const KIND={add:'ใหม่',chg:'แก้ไข',same:'เหมือนเดิม',del:'ตัดออก',skip:'ไม่สร้างงาน'};
function jobRows(list,edit){
  return list.map((r,i)=>{
    const cf=r.cf||[], c=k=>cf.indexOf(k)>=0?' class="cf"':'';
    const idx=edit?UP.rows.findIndex(x=>x.row===r.excel_row):-1;
    return '<tr class="'+esc(r.kind||'')+'">'
      +(edit?'<td>'+(r.kind==='del'?'':'<input type="checkbox" aria-label="สร้างงาน" '+(r.pick?'checked':'')+' onchange="setRow('+idx+',\'pick\',this.checked)">')+'</td>':'')
      +'<td>'+esc(r.truck_group||'')+'<span class="how">'+esc(r.plate||r.plate_raw)+'</span></td>'
      +'<td'+c('driver_code')+'>'+drvCell(r,idx,edit&&r.kind!=='del'&&r.pick)+'</td>'
      +'<td'+c('job_text')+'>'+esc(r.job_text)+extrasCell(r.extras,r.stops)+'</td>'
      +'<td'+c('stops')+'>'+stCell(r,idx,edit&&r.kind!=='del'&&r.pick)+'</td>'
      +'<td'+c('unload_time')+'>'+esc(r.unload_time||'—')+'</td>'
      +'<td'+(cf.indexOf('pallets')>=0||cf.indexOf('cases')>=0?' class="cf"':'')+'>'+qtyCell(r)+'</td>'
      +'<td'+c('unload_fee_text')+'>'+esc(r.unload_fee_text||'')+'</td>'
      +'<td'+c('helper_txt')+'>'+helperCell(r.helpers,r.helper_time)+'</td>'
      +'<td>'+(edit?'<span class="tag'+(r.kind==='add'?' ok':r.kind==='del'?' bad':'')+'">'+KIND[r.kind]+'</span>'+(r.txt?'<span class="how">'+esc(r.txt)+'</span>':''):savedStat(r))+'</td>'
      +'</tr>';
  }).join('');
}
// ช่องสถานะในแพลนที่บันทึกแล้ว · ขอรถไร่จากใบงานนี้ได้เลย (ไม่ต้องกรอก) → ไปคิว "📦 Packing ค้างจัดรถ" ของงานไร่
function savedStat(r){
  if(r.cancelled) return '<span class="tag bad">ตัดออก</span>';
  if(r.farm_req_id){ const q=((TR&&TR.requests)||[]).find(x=>x.request_id===r.farm_req_id);
    return '<span class="tag st-'+esc(q?q.status:'Waiting')+'">🚜 '+esc(q?(TR_LABEL[q.status]||q.status):'ขอรถไร่แล้ว')+'</span>'+(q&&q.driver_name?'<span class="how">'+esc(q.driver_name)+' '+esc(q.plate||'')+'</span>':'')
      +(q&&q.status==='Waiting'&&ME&&ME.canEdit?'<button class="btn ghost" style="padding:3px 9px;font-size:11.5px;margin-top:4px" onclick="trCancel(this,\''+esc(r.farm_req_id)+'\')">ยกเลิกขอรถไร่</button>':''); }
  const busy=['accepted','started','done'].indexOf(r.status)>=0;
  const lab=r.status==='sent'&&r.needs_ack?'แก้ไขแล้ว · รอกดรับใหม่':(STAT[r.status]||r.status);
  return '<span class="tag'+(busy?' ok':r.status==='sent'?' out':'')+'">'+esc(lab)+'</span>'
    +(r.order_id&&busy?'<span class="how">'+esc(r.order_id)+'</span>':'')
    +(!busy&&ME&&ME.canEdit?'<button class="btn ghost" style="padding:3px 9px;font-size:11.5px;margin-top:4px;white-space:nowrap" onclick="trJob(this,'+Number(r.id)+')">🚜 ขอรถไร่</button>':'');
}
const STAT={new:'ยังไม่แจก',sent:'แจกแล้ว · รอรับ',accepted:'รับงานแล้ว',started:'เริ่มงาน',done:'เสร็จ'};

  if(PLAN&&PLAN.plan){

/* ── 🚜 ขอรถไร่ → pk_requests (Waiting) → ไปโผล่ที่งานไร่: หน้าติดตามออเดอร์ ชิป "📦 Packing ค้างจัดรถ" → แอดมินไร่สร้างออเดอร์ + หาคนขับ ── */

const TR_LABEL={Waiting:'รอแอดมินไร่จัดรถ',Planned:'จัดรถแล้ว',Loading:'กำลังขึ้นของ',Delivered:'ส่งแล้ว','ยกเลิก':'ยกเลิก'};

        +'<td><span class="tag st-'+esc(r.status)+'">'+esc(TR_LABEL[r.status]||r.status)+'</span>'+(r.driver_name?'<span class="how">'+esc(r.driver_name)+' '+esc(r.plate||'')+'</span>':'')+'</td>'

/* ── 👥 คิวคนขับ Packing: ว่าง / มีงาน / ลา·ซ่อม ของวันที่เลือก (จากแพลน + แถวลา/ซ่อม/รอมีงานในไฟล์ + ลาในระบบ) ── */
let DQ={date:'',data:null,f:'all',tab:'day',edit:null};
const DQ_F=[['all','ทั้งหมด',()=>true],['free','ว่าง',d=>d.kind==='free'],['busy','มีงาน',d=>d.kind==='busy'],['leave','ลา / ซ่อม',d=>d.kind==='leave'||d.kind==='repair'],['none','ไม่อยู่ในแพลน',d=>d.kind==='none'||d.kind==='other']];
function dqOpen(){
  const td=new Date(Date.now()+7*36e5).toISOString().slice(0,10);
  DQ.date=(PLAN&&PLAN.plan&&PLAN.plan.work_date)||td; DQ.f='all'; DQ.data=null;
  let w=$('dqDlg'); if(!w){ w=document.createElement('div'); w.className='dlg'; w.id='dqDlg'; w.onclick=e=>{ if(e.target===w) dqClose(); }; document.body.appendChild(w); }

}
function dqClose(){ const w=$('dqDlg'); if(w) w.remove(); }
async function dqLoad(){
  const want=DQ.date; DQ.data=null; dqRender();
  try{ const d=await get('driverQueue','&date='+encodeURIComponent(want)); if(DQ.date!==want) return; DQ.data=d.ok?d:{error:d.error||'โหลดไม่สำเร็จ'}; }

/* 🛣️ คิวระยะไกล — แยก 4/6/10 ล้อ · ยังไม่ได้งานไกลตั้งแต่วันจัดคิว อยู่หน้า (ตามลำดับที่แอดมินจัด) · ได้งานไกลแล้วต่อท้าย · เกณฑ์ กม. แก้ได้เฉพาะ DEV */

  ['4 ล้อ','6 ล้อ','10 ล้อ','พ่วง'].filter(c=>(L.classes[c]||[]).length).forEach(c=>{   // กลุ่มไม่มีคนขับ = ไม่โชว์ (เช่น 10 ล้อเดี่ยว)
    const rs=(DQ.edit&&DQ.edit.cls===c)?DQ.edit.list:(L.classes[c]||[]), ed=DQ.edit&&DQ.edit.cls===c;
    h+='<div class="dq"><div class="dq-h"><b>'+c+'</b><span class="tag">'+rs.length+' คน</span><span class="grow"></span>'
      +(d.canEdit&&rs.length?(ed?'<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="DQ.edit=null;dqRender()">ยกเลิก</button><button class="btn" style="padding:5px 12px;font-size:12.5px" onclick="lkSave(this)">บันทึกลำดับ</button>'
        :'<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="lkEdit(\''+c+'\')">✎ จัดลำดับ</button>'):'')+'</div>';
    h+=rs.length?rs.map((x,i)=>'<div class="row" style="margin-top:6px;gap:8px;flex-wrap:nowrap"><b style="min-width:26px;font-size:16px;font-variant-numeric:tabular-nums;color:'+(i===0&&!ed?'var(--primary)':'var(--txt2)')+'">'+(i+1)+'</b>'
        +'<div class="grow" style="min-width:0">'+esc(x.name)+' <span class="tag k-'+esc(x.kind)+'">'+esc(x.label)+'</span><span class="how">'+esc(x.plate||'')+' · '+(x.last?'งานไกลล่าสุด '+thDate(x.last.date)+' '+esc(x.last.dest)+(x.last.km?' ('+esc(x.last.km)+' กม.)':''):'ยังไม่ได้งานไกล'+(x.resetAt?' ตั้งแต่จัดคิว '+thDate(x.resetAt):''))+'</span></div>'
        +(ed?'<button class="btn ghost" style="padding:2px 9px" aria-label="ขึ้น" onclick="lkMove('+i+',-1)"'+(i?'':' disabled')+'>↑</button><button class="btn ghost" style="padding:2px 9px" aria-label="ลง" onclick="lkMove('+i+',1)"'+(i<rs.length-1?'':' disabled')+'>↓</button>':'')+'</div>').join('')
      :'<div class="how">ไม่มีคนขับกลุ่มนี้</div>';
    h+='</div>';
  });
  return h+'</div>';
}
function lkEdit(c){ DQ.edit={cls:c,list:((DQ.data.long.classes[c])||[]).slice()}; dqRender(); }
function lkMove(i,dir){ const l=DQ.edit.list, j=i+dir; if(j<0||j>=l.length) return; const t=l[i]; l[i]=l[j]; l[j]=t; dqRender(); }
async function lkSave(b){
  if(BUSY||!DQ.edit) return;
  if(!(await askYes('บันทึกลำดับคิวระยะไกล '+DQ.edit.cls,'ลำดับนี้เป็นจุดเริ่มใหม่ — นับงานไกลตั้งแต่วันนี้ ใครได้งานไกลหลังจากนี้จะไปต่อท้าย','บันทึกลำดับ'))) return;
  BUSY=true; b.disabled=true;
  try{ const d=await post({action:'saveLongOrder',cls:DQ.edit.cls,codes:DQ.edit.list.map(x=>x.code)});
    if(!d.ok){ toast('❌ '+(d.error||'บันทึกไม่สำเร็จ'),true); return; }
    toast('✅ บันทึกลำดับคิว '+DQ.edit.cls+' แล้ว'); DQ.edit=null; BUSY=false; await dqLoad(); }
  catch(e){ toast('บันทึกไม่สำเร็จ',true); }
  finally{ BUSY=false; }
}
async function lkSaveKm(b){
  const km=Number(($('lkKm')||{}).value); if(!(km>=50&&km<=2000)) return toast('เกณฑ์ต้องอยู่ระหว่าง 50–2000 กม.',true);
  if(BUSY) return; BUSY=true; b.disabled=true;
  try{ const d=await post({action:'setLongKm',km}); toast(d.ok?'✅ เกณฑ์ระยะไกล = '+d.km+' กม.':'❌ '+(d.error||'บันทึกไม่สำเร็จ'),!d.ok); if(d.ok){ if(PLAN) PLAN.longKm=d.km; BUSY=false; await dqLoad(); } }
  catch(e){ toast('บันทึกไม่สำเร็จ',true); }
  finally{ BUSY=false; }
}
/* ── 📲 แจกงาน → การ์ด LINE ถึงคนขับ (ส่งเฉพาะคนที่ลงทะเบียน LINE แล้ว) · กดซ้ำ = ส่งใบที่ยังไม่ได้ส่ง ── */
const todayTH=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,10);
function dispBar(pl,live){
  const left=live.filter(j=>j.status==='new'&&!j.farm_req_id), past=String(pl.work_date)<todayTH();
  const info=pl.dispatched_at?'📤 แจกแล้วโดย '+esc(pl.dispatched_by||'—')+' · '+new Date(pl.dispatched_at).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    +(left.length?' · ยังไม่ได้ส่ง '+left.length+' ใบ (คนขับยังไม่ลงทะเบียน LINE / งานเพิ่มใหม่)':' · ส่งครบแล้ว'):'ยังไม่แจกงาน — กดแจกงานแล้วคนขับได้การ์ดใน LINE · คนขับกดรับ → ระบบสร้างออเดอร์ให้';
  const lab=pl.dispatched_at?'📲 ส่งใบที่ยังไม่ได้ส่ง ('+left.length+')':'📲 แจกงานทั้งวัน ('+left.length+' ใบ)';
  const can=ME&&ME.canEdit&&left.length&&!past;
  return (PLAN.testMode?'<div class="note" style="margin-top:8px;color:var(--danger)">🧪 โหมดเทสระบบเปิดอยู่ — การ์ดคนขับติดป้าย "เทสระบบ ไม่ต้องออกรถ" (ยังไม่มีฟอร์มคนขับ Packing)</div>':'')
    +'<div class="sticky"><span class="note">'+info+(past?' · แพลนวันที่ผ่านมาแล้ว':'')+'</span><span class="grow"></span>'
    +(ME&&ME.canEdit?'<button class="btn" onclick="dispatchPlan(this)"'+(can?'':' disabled')+'>'+lab+'</button>':'')+'</div>';
}
async function dispatchPlan(b){
  if(BUSY||!PLAN||!PLAN.plan) return;
  const pl=PLAN.plan, live=(PLAN.jobs||[]).filter(j=>!j.cancelled&&j.status==='new'&&!j.farm_req_id);
  const drv=new Set(live.map(j=>j.driver_code||j.driver_raw)).size;
  if(!(await askYes(pl.dispatched_at?'📲 ส่งใบที่ยังไม่ได้ส่ง':'📲 แจกงานทั้งวัน','แพลน '+thDate(pl.work_date)+' · '+live.length+' ใบ · คนขับ '+drv+' คน\n\nระบบส่งการ์ดใน LINE เฉพาะคนขับที่ลงทะเบียนแล้ว · คนขับกดรับ → สร้างออเดอร์ให้เอง','แจกงาน'))) return;
  BUSY=true; b.disabled=true; b.textContent='กำลังแจกงาน…';
  try{
    const d=await post({action:'dispatch',planId:pl.id});
    if(!d.ok){ toast('❌ '+(d.error||'แจกงานไม่สำเร็จ'),true); return; }
    const w=(d.waitLine||[]).length;
    toast('✅ ส่งการ์ดแล้ว '+d.sent+' ใบ'+(w?' · ยังไม่ได้ส่ง '+w+' ใบ (คนขับยังไม่ลงทะเบียน LINE)':'')+(d.failed?' · ส่ง LINE ไม่สำเร็จ '+d.failed:''),!!d.failed);
    await load(pl.work_date);
  }catch(e){ toast('ไม่แน่ใจว่าแจกงานสำเร็จ — โหลดหน้าใหม่ให้ตรวจก่อนกดซ้ำ',true); }
  finally{ BUSY=false; }
}
// กล่องยืนยัน (แทน confirm() ของเบราว์เซอร์)
function askYes(title,msg,ok,danger){ return new Promise(res=>{
  const w=document.createElement("div"); w.className="dlg";
  w.innerHTML='<div class="dlg-in" role="dialog" aria-label="'+esc(title)+'"><b style="font-size:16px">'+esc(title)+'</b><p>'+esc(msg)+'</p><div class="row"><button class="btn ghost" data-a="0">ไม่ใช่</button><span class="grow"></span><button class="btn" data-a="1"'+(danger?' style="background:var(--danger)"':"")+'>'+esc(ok||"ยืนยัน")+'</button></div></div>';
  const done=v=>{ w.remove(); res(v); };
  w.onclick=e=>{ const a=e.target&&e.target.getAttribute&&e.target.getAttribute("data-a"); if(a!=null) done(a==="1"); else if(e.target===w) done(false); };
  document.body.appendChild(w);
}); }
// ขอรถไร่จากใบงาน — ระบบดึงวันที่/ปลายทางทุกจุด/จำนวน/เวลาลง/เด็กรถ/ค่าลง จากใบงานเอง (ไม่ต้องกรอก)
async function trJob(b,id){
  if(BUSY) return;
  const j=((PLAN&&PLAN.jobs)||[]).find(x=>Number(x.id)===Number(id)); if(!j) return;
  const dest=((Array.isArray(j.stops)&&j.stops.length)?j.stops.map(s=>s.station_name||s.name):[j.dest_text||j.job_text]).join(" + ");
  if(!(await askYes("🚜 ขอรถไร่","แทนรถ PK "+(j.plate||j.plate_raw||"")+(j.driver_name?" ("+j.driver_name+")":"")+"\n"+thDate(PLAN.plan.work_date)+" · "+dest+"\n\nคำขอจะไปที่งานไร่ (📦 Packing ค้างจัดรถ) · ใบงานนี้จะไม่แจกให้คนขับ PK","ส่งคำขอไปงานไร่"))) return;
  BUSY=true; b.disabled=true; b.textContent="กำลังส่ง…";
  try{
    const d=await post({action:"truckReqJob",jobId:id});
    if(!d.ok){ toast("❌ "+(d.error||"ส่งไม่สำเร็จ"),true); return; }
    toast("✅ ขอรถไร่แล้ว "+((d.request&&d.request.request_id)||"")+" — ไปที่งานไร่แล้ว");
    await Promise.all([trLoad(),load(PLAN.plan.work_date)]);
  }catch(e){ toast("ไม่แน่ใจว่าส่งสำเร็จ — โหลดหน้าใหม่ให้ตรวจก่อนกดซ้ำ",true); }
  finally{ BUSY=false; if(b.isConnected){ b.disabled=false; b.textContent="🚜 ขอรถไร่"; } }
}
async function trCancel(b,id){
  if(BUSY) return; if(!(await askYes("ยกเลิกขอรถไร่","คำขอ "+id+"\nใบงานจะกลับเป็นรถ PK","ยกเลิกคำขอ",true))) return;
  BUSY=true; b.disabled=true;
  try{ const d=await post({action:"truckReqCancel",requestId:id}); toast(d.ok?"ยกเลิกคำขอแล้ว":"❌ "+(d.error||"ยกเลิกไม่สำเร็จ"),!d.ok); await Promise.all([trLoad(),PLAN&&PLAN.plan?load(PLAN.plan.work_date):null]); }
  catch(e){ toast("ยกเลิกไม่สำเร็จ",true); }
  finally{ BUSY=false; }
}
async function load(date){
  const d=await get('getPlan',date?'&date='+encodeURIComponent(date):'');
  if(d.denied){ $('body').innerHTML='<div class="msg" style="color:var(--danger)">'+esc(d.error||'หน้านี้สำหรับแอดมิน Packing')+'</div>'; return; }
  if(!d.ok){ $('body').innerHTML='<div class="msg">'+esc(d.error||'โหลดไม่สำเร็จ')+' <button class="btn ghost" onclick="load()">↻ ลองใหม่</button></div>'; return; }
  PLAN=d; ME=d.me; render();
  if(!TR) trLoad();
  if(!LK&&ME.canEdit){ get('lookups').then(x=>{ if(x.ok){LK=x; if(UP&&UP.pv) render();} }).catch(()=>{}); }
}
$('file').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; onFile(f); };
(async function(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const p=await liff.getProfile(); MY_UID=p.userId||'';
    if(!MY_UID){$('body').innerHTML='<div class="msg">ไม่พบ LINE UID</div>';return;}
    let info=null; try{ info=await ssbAdminPinInfo(MY_UID); }catch(e){}
    const ok = info&&info.isDev ? await ssbPinGate(MY_UID) : await ssbAdminPin(MY_UID,{info,text:'เข้าหน้าแจกงาน Packing'});
    if(ok) load(); else $('body').innerHTML='<div class="msg">🔐 ต้องใส่ PIN ก่อนเข้าหน้านี้<br><button class="btn" style="margin-top:12px" onclick="location.reload()">ใส่ PIN อีกครั้ง</button></div>';
  }catch(e){$('body').innerHTML='<div class="msg">LIFF error: '+esc(e)+'</div>';}
})();
</script>
