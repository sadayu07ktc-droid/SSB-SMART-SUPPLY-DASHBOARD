<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดรับเข้าผลปาล์ม · SSB Smart Supply</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#eef0ea; --panel:#f8f8f4; --card:#ffffff; --line:#dfe3da; --line2:#cdd3c6;
    --ink:#17201b; --ink2:#5c6b60; --muted:#8a978c;
    --accent:#1e7a4d; --send:#1e7a4d; --buy:#c98a1e; --loss:#c0492f; --good:#1e7a4d;
    --sendSoft:rgba(30,122,77,.14); --buySoft:rgba(201,138,30,.14);--stock:#2f6ca8;--stockSoft:rgba(47,108,168,.14);
    --gpalm:#7c3aed;--gpalmSoft:rgba(124,58,237,.12);
    --shadow:0 1px 2px rgba(20,40,25,.05),0 8px 24px -12px rgba(20,40,25,.12); --r:16px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1512; --panel:#121b16; --card:#16211c; --line:#243029; --line2:#324034;
    --ink:#e7ece7; --ink2:#9fb0a3; --muted:#718476;
    --accent:#43b982; --send:#33a166; --buy:#bd8722; --loss:#e0705a; --good:#43b982;
    --sendSoft:rgba(51,161,102,.16); --buySoft:rgba(189,135,34,.15);--stock:#3d92c4;--stockSoft:rgba(61,146,196,.16);
    --gpalm:#a78bfa;--gpalmSoft:rgba(167,139,250,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="light"]{--bg:#eef0ea;--panel:#f8f8f4;--card:#fff;--line:#dfe3da;--line2:#cdd3c6;--ink:#17201b;--ink2:#5c6b60;--muted:#8a978c;--accent:#1e7a4d;--send:#1e7a4d;--buy:#c98a1e;--loss:#c0492f;--good:#1e7a4d;--sendSoft:rgba(30,122,77,.14);--buySoft:rgba(201,138,30,.14);--stock:#2f6ca8;--stockSoft:rgba(47,108,168,.14);--shadow:0 1px 2px rgba(20,40,25,.05),0 8px 24px -12px rgba(20,40,25,.12)}
  :root[data-theme="dark"]{--bg:#0e1512;--panel:#121b16;--card:#16211c;--line:#243029;--line2:#324034;--ink:#e7ece7;--ink2:#9fb0a3;--muted:#718476;--accent:#43b982;--send:#33a166;--buy:#bd8722;--loss:#e0705a;--good:#43b982;--sendSoft:rgba(51,161,102,.16);--buySoft:rgba(189,135,34,.15);--stock:#3d92c4;--stockSoft:rgba(61,146,196,.16);--gpalm:#a78bfa;--gpalmSoft:rgba(167,139,250,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",-apple-system,"Segoe UI",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:22px 18px 60px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--ink2)}
  .spacer{flex:1}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1}
  #themeSeg{margin-left:auto}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;cursor:pointer}
  .dr{display:inline-flex;align-items:center;gap:5px}
  .dr span{color:var(--muted);font-size:12px}
  input[type=date]{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
  input[type=date].on{border-color:var(--accent);color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lbl{font-size:11px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
  .kpi .dot{width:8px;height:8px;border-radius:3px;flex:none}
  .kpi .val{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.02em;line-height:1}
  .kpi .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
  .up{color:var(--good)} .down{color:var(--loss)}
  .kpi.warn{border-color:color-mix(in srgb,var(--loss) 45%,var(--line))}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:15px 18px 4px}
  .ptitle{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .pnote{font-size:11.5px;color:var(--muted)}
  .chartwrap{padding:6px 12px 14px}
  .legend{display:flex;gap:16px;padding:0 18px 4px;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
  .lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .rank{padding:8px 18px 16px;display:flex;flex-direction:column;gap:11px}
  .rrow{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:10px}
  .rname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{height:9px;background:var(--panel);border-radius:6px;overflow:hidden}
  .barfill{height:100%;border-radius:6px;background:var(--send)}
  .rval{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
  .chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .chip.ok{background:var(--sendSoft);color:var(--good)}
  .chip.bad{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
  .gchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--gpalmSoft);border:1px solid color-mix(in srgb,var(--gpalm) 32%,var(--line));border-radius:999px;padding:6px 12px;cursor:pointer;transition:.12s;font-family:inherit}
  .gchip:hover{border-color:var(--gpalm)}.gchip:active{transform:scale(.97)}
  .gchip b{color:var(--gpalm);font-variant-numeric:tabular-nums}
  .gchip .gtrip{font-size:10px;color:var(--muted);font-weight:600;background:var(--card);padding:1px 6px;border-radius:999px}
  .ins{padding:6px 16px 16px;display:flex;flex-direction:column;gap:9px}
  .icard{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .icard .em{font-size:17px;line-height:1.2;flex:none}
  .icard .tl{font-size:11px;color:var(--ink2);font-weight:600}
  .icard .bd{font-size:13px;font-weight:700;margin-top:1px}
  .icard .bd b{color:var(--accent)}
  .icard.alert{background:color-mix(in srgb,var(--loss) 8%,var(--panel));border-color:color-mix(in srgb,var(--loss) 30%,var(--line))}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);text-align:center}
  .msg{text-align:center;color:var(--ink2);padding:60px 20px;font-size:14px}
  #tt{position:fixed;pointer-events:none;z-index:30;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:12px;opacity:0;transition:opacity .1s;min-width:150px}
  #tt .d{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  #tt .r{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0}
  #tt .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
  #tt .r i{width:9px;height:9px;border-radius:3px}
  #tt .r b{font-weight:800}
  svg{display:block;width:100%;height:auto}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
  #ov.on{display:block}
  #dr{position:fixed;top:0;right:0;width:440px;max-width:94vw;height:100%;background:var(--card);box-shadow:-8px 0 30px rgba(0,0,0,.28);z-index:41;transform:translateX(105%);transition:transform .25s;overflow-y:auto}
  #dr.on{transform:translateX(0)}
  .drhead{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);z-index:2}
  .drhead b{font-size:15px;font-weight:800}
  .ordrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ordrow .id{font-size:13px;font-weight:700}
  .ordrow .meta{font-size:11.5px;color:var(--ink2)}
  .ordrow .w{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .ordrow .st{font-size:11px;font-weight:700;text-align:right}
  .rrow{cursor:pointer;border-radius:8px;transition:background .12s}
  .rrow:hover{background:var(--panel)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <button onclick="goBack()" style="border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;width:42px;height:42px;font-size:18px;cursor:pointer">←</button>
      <div class="logo">🌴</div>
      <div><h1>แดชบอร์ดรับเข้าผลปาล์ม</h1><div class="sub">SSB Smart Supply · ปาล์มเข้าโรงงาน · ลาน + สวน</div></div>
    </div>
    <div class="controls">
      <div class="seg" id="rangeSeg">
        <button data-r="1">วันนี้</button>
        <button data-r="7">7 วัน</button>
        <button data-r="30" class="on">30 วัน</button>
        <button data-r="90">90 วัน</button>
      </div>
      <div class="dr"><input type="date" id="fromD" title="ตั้งแต่"><span>–</span><input type="date" id="toD" title="ถึง"></div>
      <select id="rampSel"></select>
      <button id="bonusBtn" title="โบนัสหัวหน้าคนขับ" style="border:1px solid var(--buy);background:var(--buySoft);color:var(--buy);border-radius:11px;height:40px;padding:0 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap">🏆 โบนัส</button>
      <div class="seg" id="themeSeg" title="โหมดสว่าง / มืด">
        <button data-t="light">☀️</button>
        <button data-t="dark">🌙</button>
      </div>
    </div>
  </div>
  <div id="app"><div class="msg">กำลังเข้าสู่ระบบ…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="tt"></div>
<div id="ov" onclick="closeDrawer()"></div>
<aside id="dr"><div class="drhead"><b id="drTitle">ออเดอร์</b><button onclick="closeDrawer()" style="border:0;background:transparent;color:var(--ink2);font-size:19px;cursor:pointer">✕</button></div><div id="drBody" style="padding:14px 18px 40px"></div></aside>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw4UvKuRrAQ_3Ldm8U0VJqfjfBQUSYaTEdrxkdXUVN98G68XseCquhDeXfMgU8cVYaY/exec';
const LIFF_ID='2010274217-Ot7vGhri';
let MY_UID='';
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
function goBack(){if(history.length>1)history.back();else location.href='https://sadayu07ktc-droid.github.io/SSB-SMART-SUPPLY-DASHBOARD/';}

// ── ธีม (จำค่าใน localStorage) ──
function effTheme(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rampTheme',t);}catch(e){}
  $('#themeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(window._rendered)render();}
(function(){let sv=null;try{sv=localStorage.getItem('rampTheme');}catch(e){}applyTheme(sv||effTheme());})();
$('#themeSeg').onclick=e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.t);};
$('#bonusBtn').onclick=()=>{location.href='bonus.html'+(MY_UID?'?uid='+encodeURIComponent(MY_UID):'');};

// ── ข้อมูลจริง ──
let RECORDS=[], RAMPS=[], DATES=[], BY={}, ORD_BY_RAMP={};
let GARDEN_RECORDS=[], GARDENS=[];   // 🌳 ปาล์มจากสวน ส่งตรงโรงงาน (getGardenDaily)
let RANGE=30, SCOPE='all', CHARTTYPE='line', MODE='preset', FROM='', TO='';
const TON=1000; // kg → ตัน
const TON_PER_BIN=15; // ตัน/กระบะ · 2 กระบะ = 1 พ่วง (สั่งออเดอร์เป็นกระบะ)
function binsFor(ton){return Math.max(0,Math.ceil((ton||0)/TON_PER_BIN));}       // จำนวนกระบะ
function dispatchText(ton){const b=binsFor(ton);return `≈ ${b} กระบะ (${Math.ceil(b/2)} พ่วง)`;}
const toMs=d=>{const p=d.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);};

async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const p=await liff.getProfile(); MY_UID=p.userId||'';
    if(!MY_UID){$('#app').innerHTML='<div class="msg" style="color:var(--loss)">ไม่พบ LINE UID</div>';return;}
    const r=await fetch(GAS_URL+'?action=getRampDaily&userId='+encodeURIComponent(MY_UID));
    const d=await r.json();
    if(d.denied){$('#app').innerHTML='<div class="msg" style="color:var(--loss)">ไม่มีสิทธิ์ (เฉพาะแอดมิน/ผู้บริหาร)</div>';return;}
    if(!d.ok){$('#app').innerHTML='<div class="msg">'+(d.error||'โหลดข้อมูลไม่ได้')+'</div>';return;}
    RECORDS=d.records||[]; RAMPS=d.ramps||[];
    if(!RECORDS.length){$('#app').innerHTML='<div class="msg">ยังไม่มีข้อมูลลานปาล์มรายวัน</div>';return;}
    DATES=[...new Set(RECORDS.map(r=>r.date))].sort();
    BY={}; RAMPS.forEach(rn=>BY[rn]={}); RECORDS.forEach(rec=>{BY[rec.ramp][rec.date]=rec;});
    // ออเดอร์จริง (reconcile เที่ยว/รถนอก) — degrade ได้ถ้ายังไม่ deploy
    try{ const or=await fetch(GAS_URL+'?action=getRampOrders&userId='+encodeURIComponent(MY_UID)); const od=await or.json();
      if(od.ok){ ORD_BY_RAMP={}; (od.orders||[]).forEach(o=>{(ORD_BY_RAMP[o.ramp]=ORD_BY_RAMP[o.ramp]||[]).push(o);}); Object.keys(ORD_BY_RAMP).forEach(k=>ORD_BY_RAMP[k].sort((x,y)=>x.date<y.date?1:-1)); }
    }catch(e){}
    // 🌳 ปาล์มจากสวน ส่งตรงโรงงาน (degrade ได้ถ้ายังไม่ deploy endpoint)
    try{ const gr=await fetch(GAS_URL+'?action=getGardenDaily&userId='+encodeURIComponent(MY_UID)); const gd=await gr.json();
      if(gd.ok){ GARDEN_RECORDS=gd.records||[]; GARDENS=gd.gardens||[]; }
    }catch(e){}
    buildShell();
    window._rendered=true; render();
  }catch(e){$('#app').innerHTML='<div class="msg">ผิดพลาด: '+e+'</div>';}
}

function buildShell(){
  $('#app').innerHTML=`
    <div class="kpis" id="kpis"></div>
    <div class="panel">
      <div class="phead">
        <div><div class="eyebrow">แนวโน้มรายวัน</div><div class="ptitle" id="trendTitle">ซื้อเข้า เทียบ ส่งโรงงาน</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="seg" id="chartSeg" style="padding:2px"><button data-c="line" class="on">📈 เส้น</button><button data-c="bar">📊 แท่ง</button></div>
          <div class="pnote" id="trendNote"></div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="stockBanner" style="margin:2px 18px 8px;padding:9px 13px;border-radius:11px;background:var(--stockSoft);display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px"></div>
      <div class="chartwrap"><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="กราฟปาล์มซื้อเข้า ส่งโรงงาน ค้างลาน"></svg></div>
    </div>
    <div class="panel" id="gardenPanel" style="margin-top:16px">
      <div class="phead">
        <div><div class="eyebrow">สวนส่งตรงโรงงาน</div><div class="ptitle">🌳 ปาล์มจากสวน (ไม่ผ่านลาน)</div></div>
        <div class="pnote" id="gardenNote"></div>
      </div>
      <div id="gardenChips" style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 18px 12px"></div>
      <div class="legend"><span class="lg"><i style="background:var(--send)"></i>ลานทั้งหมด</span><span class="lg"><i style="background:var(--gpalm)"></i>สวนส่งตรง</span><span class="lg" style="color:var(--muted)">เปรียบเทียบ ส่งเข้าโรงงาน · ตัน/วัน</span></div>
      <div class="chartwrap"><svg id="cmpChart" viewBox="0 0 900 260" role="img" aria-label="เปรียบเทียบส่งโรงงาน ลาน เทียบ สวน"></svg></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="phead"><div><div class="eyebrow">ระบายเข้าโรงงาน</div><div class="ptitle">อันดับลาน · ส่งโรงงาน</div></div><div class="pnote">ตัน (ช่วงที่เลือก)</div></div>
        <div class="rank" id="rank"></div>
      </div>
      <div class="panel">
        <div class="phead"><div><div class="eyebrow">มุมผู้บริหาร</div><div class="ptitle">สิ่งที่ควรรู้</div></div></div>
        <div class="ins" id="ins"></div>
      </div>
    </div>`;
  const sel=$('#rampSel');
  sel.innerHTML=
    '<option value="all">🌐 ภาพรวมทุกลาน</option>'+
    '<option value="gardens">🌳 ภาพรวมทุกสวน</option>'+
    '<option value="everything">📊 ภาพรวมทั้งหมด (ลาน+สวน)</option>'+
    (RAMPS.length?('<optgroup label="🏭 แยกรายลาน">'+RAMPS.map(r=>`<option value="${r}">${r}</option>`).join('')+'</optgroup>'):'')+
    (GARDENS.length?('<optgroup label="🌳 แยกรายสวน">'+GARDENS.map((g,i)=>`<option value="g:${i}">${cleanName(g)}</option>`).join('')+'</optgroup>'):'');
  sel.onchange=e=>{SCOPE=e.target.value;render();};
  $('#rangeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#rangeSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RANGE=+b.dataset.r;MODE='preset';$('#fromD').classList.remove('on');$('#toD').classList.remove('on');render();};
  $('#chartSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;CHARTTYPE=b.dataset.c;render();};
  // ช่วงวันที่กำหนดเอง

// รวมช่วง window วันที่ (SCOPE) → rows รายวัน (หน่วยตัน)
function sliceDates(dates,ramps){
  return dates.map(dt=>{
    let o={day:toMs(dt),buy:0,send:0,stock:0,lost:0,trips:0,rawCull:0,rspo:0};
    ramps.forEach(rn=>{const r=BY[rn]&&BY[rn][dt];if(r){o.buy+=r.buy/TON;o.send+=r.send/TON;o.stock+=r.stock/TON;o.lost+=(r.lost+(r.roundLoss||0))/TON;o.trips+=r.trips;o.rawCull+=r.rawCull;o.rspo+=r.rspo/TON;}});
    return o;
  });
}
function curDates(){
  if(MODE==='custom'&&FROM&&TO)return DATES.filter(d=>d>=FROM&&d<=TO);
  return DATES.slice(-RANGE);
}
function prevDates(){
  const cur=curDates(); if(!cur.length)return [];
  const first=DATES.indexOf(cur[0]); return DATES.slice(Math.max(0,first-cur.length),first);
}
function rampsInScope(){return SCOPE==='all'?RAMPS:[SCOPE];}   // (คงไว้เผื่อเรียกเก่า)
function sum(rows,k){return rows.reduce((a,r)=>a+(r[k]||0),0);}
// ── สโคป: ลาน / สวน / ทั้งหมด / รายลาน / รายสวน ──
function cleanName(s){return String(s||'').replace(/\s*\n\s*/g,' · ').trim();}
function scopeSel(){
  if(SCOPE==='all')        return {ramps:RAMPS.slice(), gardens:[],             kind:'ramps',   label:'ทุกลาน'};
  if(SCOPE==='gardens')    return {ramps:[],            gardens:GARDENS.slice(), kind:'gardens', label:'ทุกสวน'};
  if(SCOPE==='everything') return {ramps:RAMPS.slice(), gardens:GARDENS.slice(), kind:'all',     label:'ทั้งหมด (ลาน+สวน)'};
  if(String(SCOPE).slice(0,2)==='g:'){const g=GARDENS[+String(SCOPE).slice(2)]||''; return {ramps:[], gardens:g?[g]:[], kind:'garden1', label:cleanName(g)};}
  return {ramps:[SCOPE], gardens:[], kind:'ramp1', label:SCOPE};
}
const hasR=s=>s.ramps.length>0, hasG=s=>s.gardens.length>0;
function gardenIdx(gardens){const set=new Set(gardens),idx={};if(set.size)GARDEN_RECORDS.forEach(r=>{if(!set.has(r.garden))return;const o=idx[r.date]||(idx[r.date]={send:0,trips:0});o.send+=r.send/TON;o.trips+=r.trips;});return idx;}
function gardenAggScope(gardens){const gset=new Set(gardens),dset=new Set(curDates());let trips=0,tons=0;if(gset.size)GARDEN_RECORDS.forEach(r=>{if(gset.has(r.garden)&&dset.has(r.date)){trips+=r.trips;tons+=r.send/TON;}});return {trips,tons};}
function gardenAggList(gardens,dates){const gset=new Set(gardens),dset=new Set(dates),m={};if(gset.size)GARDEN_RECORDS.forEach(r=>{if(!gset.has(r.garden)||!dset.has(r.date))return;const g=m[r.garden]||(m[r.garden]={garden:r.garden,tons:0,trips:0});g.tons+=r.send/TON;g.trips+=r.trips;});return Object.values(m).sort((a,b)=>b.tons-a.tons);}
// รวมรายวันตามสโคป (ลาน buy/stock/loss + สวน send/trips) · แยก rsend/gsend ไว้เทียบ
function unifiedRows(dates,s){s=s||scopeSel();const gi=gardenIdx(s.gardens);
  return dates.map(dt=>{let o={day:toMs(dt),buy:0,send:0,rsend:0,gsend:0,stock:0,lost:0,trips:0,rawCull:0,rspo:0};
    s.ramps.forEach(rn=>{const r=BY[rn]&&BY[rn][dt];if(r){o.buy+=r.buy/TON;o.rsend+=r.send/TON;o.stock+=r.stock/TON;o.lost+=(r.lost+(r.roundLoss||0))/TON;o.trips+=r.trips;o.rawCull+=r.rawCull;o.rspo+=r.rspo/TON;}});
    const g=gi[dt];if(g){o.gsend+=g.send;o.trips+=g.trips;}

// ── 🌳 สวนส่งตรงโรงงาน: ชิปต่อสวน + กราฟเปรียบเทียบ ลาน vs สวน ──

const W=900,H=300,PAD={l:44,r:54,t:16,b:26};
function smooth(pts){if(pts.length<2)return pts.length?`M${pts[0].x},${pts[0].y}`:'';let d=`M${pts[0].x},${pts[0].y}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;}return d;}

  data.forEach((d,i)=>{

    segs.forEach(([k,c])=>{const val=d[k]; if(val<=0){acc+=val;return;} const top=y(acc+val), bot=y(acc), h=Math.max(0,bot-top-2);

    let lbl=d.label; if(!perDay){lbl=(lbl.replace(/^ลาน\s?(ปาล์ม)?\s?/,'')||lbl);lbl=lbl.length>9?lbl.slice(0,8)+'…':lbl;}

      tt.innerHTML=isG

      tt.style.opacity='1';let tx=cx+14;if(tx+185>innerWidth)tx=cx-195;tt.style.left=tx+'px';tt.style.top=(cy-10)+'px';};
    el.addEventListener('mousemove',show);el.addEventListener('mouseleave',()=>tt.style.opacity='0');
    el.addEventListener('touchstart',show,{passive:true});el.addEventListener('touchend',()=>tt.style.opacity='0');
    el.style.cursor='pointer'; el.addEventListener('click',()=>{tt.style.opacity='0';const d=data[+el.dataset.i];
      if(s.kind==='garden1')openGardenDrawer(s.gardens[0]); else if(d.gname)openGardenDrawer(d.gname);
      else openRampDrawer(s.kind==='ramp1'?s.ramps[0]:d.full);});
  });
}
function drawChart(rows,showBuy){
  showBuy=showBuy!==false;   // สวน: ไม่มีซื้อเข้า → โชว์แค่เส้นส่งโรงงาน
  const svg=$('#chart');
  if(rows.length<2){svg.innerHTML='<text x="450" y="150" text-anchor="middle" font-size="13" fill="var(--muted)">ข้อมูลไม่พอวาดกราฟ</text>';return;}
  const max=Math.max(...rows.map(r=>Math.max(showBuy?r.buy:0,r.send)),1)*1.12;
  const x=i=>PAD.l+(W-PAD.l-PAD.r)*(i/(rows.length-1));
  const y=v=>PAD.t+(H-PAD.t-PAD.b)*(1-v/max);
  const buyP=rows.map((r,i)=>({x:x(i),y:y(r.buy)})),sendP=rows.map((r,i)=>({x:x(i),y:y(r.send)}));
  CH={rows,x,y,showBuy,dates:curDates()};
  let g='';const ticks=4;
  for(let t=0;t<=ticks;t++){const v=max*t/ticks,yy=y(v);g+=`<line x1="${PAD.l}" y1="${yy.toFixed(1)}" x2="${W-PAD.r}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${PAD.l-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;}
  const step=Math.max(1,Math.round(rows.length/6));
  for(let i=0;i<rows.length;i+=step){const dt=new Date(rows[i].day);g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${dt.getUTCDate()}/${dt.getUTCMonth()+1}</text>`;}
  const band=`${smooth(buyP)} ${sendP.slice().reverse().map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} Z`;
  const sendArea=`${smooth(sendP)} L${x(rows.length-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const eB=buyP[buyP.length-1],eS=sendP[sendP.length-1];
  const sendCol=showBuy?'var(--send)':'var(--gpalm)';   // โหมดสวน ใช้สีม่วงให้เข้ากับส่วนสวน
  svg.innerHTML=`<defs><linearGradient id="sfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${sendCol}" stop-opacity="0.20"/><stop offset="1" stop-color="${sendCol}" stop-opacity="0.02"/></linearGradient></defs>
    ${g}<path d="${sendArea}" fill="url(#sfill)"/>${showBuy?`<path d="${band}" fill="var(--buySoft)"/>`:''}
    ${showBuy?`<path d="${smooth(buyP)}" fill="none" stroke="var(--buy)" stroke-width="2.4" stroke-linecap="round"/>`:''}
    <path d="${smooth(sendP)}" fill="none" stroke="${sendCol}" stroke-width="2.6" stroke-linecap="round"/>
    ${showBuy?`<circle cx="${eB.x.toFixed(1)}" cy="${eB.y.toFixed(1)}" r="4" fill="var(--buy)" stroke="var(--card)" stroke-width="2"/>`:''}
    <circle cx="${eS.x.toFixed(1)}" cy="${eS.y.toFixed(1)}" r="4.5" fill="${sendCol}" stroke="var(--card)" stroke-width="2"/>
    <text x="${(eS.x+8).toFixed(1)}" y="${(eS.y+4).toFixed(1)}" font-size="11.5" font-weight="800" fill="${sendCol}">${fmt(rows[rows.length-1].send)}</text>
    ${showBuy?`<text x="${(eB.x+8).toFixed(1)}" y="${(eB.y+4).toFixed(1)}" font-size="11.5" font-weight="800" fill="var(--buy)">${fmt(rows[rows.length-1].buy)}</text>`:''}

    <rect id="hit" x="${PAD.l}" y="0" width="${W-PAD.l-PAD.r}" height="${H}" fill="transparent"/>`;
  bindHover(svg);

function bindHover(svg){
  const hit=svg.querySelector('#hit'),cross=svg.querySelector('#cross'),tt=$('#tt'),{rows,x,showBuy}=CH;
  function move(ev){const rect=svg.getBoundingClientRect();const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)/rect.width*W;let i=Math.round((px-PAD.l)/((W-PAD.l-PAD.r)/(rows.length-1)));i=Math.max(0,Math.min(rows.length-1,i));const r=rows[i],cx=x(i);cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('opacity','1');const dt=new Date(r.day);

      `<div class="r"><span><i style="background:${showBuy?'var(--send)':'var(--gpalm)'}"></i>ส่งโรงงาน</span><b class="num">${fmt(r.send)} ตัน</b></div>`+
      (showBuy?`<div class="r"><span style="color:var(--muted)">เข้าสต็อก</span><b class="num" style="color:var(--ink2)">${fmt(Math.max(0,r.buy-r.send))} ตัน</b></div>`:'');
    tt.style.opacity='1';let tx=ev.clientX+14;if(tx+170>innerWidth)tx=ev.clientX-184;tt.style.left=tx+'px';tt.style.top=((ev.touches?ev.touches[0].clientY:ev.clientY)-10)+'px';}
  function leave(){cross.setAttribute('opacity','0');tt.style.opacity='0';}
  hit.addEventListener('mousemove',move);hit.addEventListener('mouseleave',leave);hit.addEventListener('touchmove',move,{passive:true});hit.addEventListener('touchend',leave);
  hit.style.cursor='pointer';
  hit.addEventListener('click',ev=>{const rect=svg.getBoundingClientRect();const px=(ev.clientX-rect.left)/rect.width*W;let i=Math.round((px-PAD.l)/((W-PAD.l-PAD.r)/(rows.length-1)));i=Math.max(0,Math.min(rows.length-1,i));const dts=CH.dates||[];if(dts[i]){tt.style.opacity='0';openDayDrawer(dts[i]);}});
}
function rampAgg(ramp,dates){let send=0,buy=0,lost=0,stock=0,last=null,storedPct=0,ord='',taken=false,bins=0,drv='';dates.forEach(dt=>{const r=BY[ramp]&&BY[ramp][dt];if(r){send+=r.send/TON;buy+=r.buy/TON;lost+=(r.lost+(r.roundLoss||0))/TON;storedPct=Math.max(storedPct,r.roundLossPct||0,r.lossPct||0);if(r.orderId){ord=r.orderId;taken=!!r.taken;bins=r.bins||0;drv=r.ordDriver||'';}last=r;}});if(last)stock=last.stock/TON;
  let lossPct=buy?lost/buy*100:0, hasLoss=lost>0.0001; if(!hasLoss&&storedPct>0){lossPct=storedPct;hasLoss=true;}
  return {name:ramp,send,buy,lost,stock,lossPct,hasLoss,ord,taken,bins,drv};}
// ออเดอร์จริงของลานในช่วงที่เลือก (reconcile รถบริษัท vs รถนอก)
function rampOrdersInRange(ramp){const dts=curDates();if(!dts.length)return [];const a=dts[0],b=dts[dts.length-1];return (ORD_BY_RAMP[ramp]||[]).filter(o=>o.date>=a&&o.date<=b);}
function rampOrderStats(ramp){const os=rampOrdersInRange(ramp);const tons=os.reduce((s,o)=>s+(o.weight||0),0)/TON;return {count:os.length,tons:tons,orders:os,last:os[0]||null};}
// ออเดอร์สำหรับ drawer = อยู่ในช่วง (จบงาน) + งานใหม่/ค้างที่ยังไม่จบ (แม้ pickup วันหน้า)
function rampDrawerOrders(ramp){const dts=curDates();if(!dts.length)return ORD_BY_RAMP[ramp]||[];const a=dts[0],b=dts[dts.length-1];return (ORD_BY_RAMP[ramp]||[]).filter(o=>(o.date>=a&&o.date<=b)||(!o.done&&o.date>=a));}
function sumTile(k,v,c){return `<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px"><div style="font-size:10.5px;color:var(--ink2);font-weight:600">${k}</div><div style="font-size:14px;font-weight:800;color:${c};margin-top:2px">${v}</div></div>`;}
function closeDrawer(){$('#ov').classList.remove('on');$('#dr').classList.remove('on');}
// 🗓️ วันที่แบบไทย ชัดเจน + วันในสัปดาห์ (yyyy-mm-dd → "ส. 26 ก.ค. 2026")
const _THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const _THDOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
function billDate(iso){const p=String(iso||'').split('-');if(p.length<3)return iso||'-';const y=+p[0],m=+p[1],d=+p[2];const dt=new Date(y,m-1,d);const dow=isNaN(dt)?'':_THDOW[dt.getDay()]+'. ';return dow+d+' '+(_THMON[m-1]||'')+' '+y;}
// 🧾 การ์ดบิลรายวันของลาน — จิ้มเพื่อกางรายละเอียดแบบ Flex ในไลน์
function toggleBill(id,el){const d=document.getElementById(id);if(!d)return;const open=d.style.display==='none';d.style.display=open?'block':'none';const c=el.querySelector('.bcaret');if(c)c.textContent=open?'▾':'▸';}
function billCard(r,ramp){
  const id='bill_'+String(r.date).replace(/-/g,'');
  const buy=r.buy/TON,send=r.send/TON,stock=r.stock/TON,lost=(r.lost+(r.roundLoss||0))/TON;

  const cell=(lbl,val,c)=>`<div style="text-align:center"><div style="font-size:10px;color:var(--ink2)">${lbl}</div><div class="num" style="font-size:14.5px;font-weight:800;color:${c}">${val}</div></div>`;
  return `<div style="margin-bottom:8px">

        <div style="font-weight:800;font-size:13px"><span class="bcaret" style="color:var(--muted);margin-right:5px">▸</span>🗓️ ${billDate(r.date)}</div>
        ${lost>0.01?`<span style="font-size:10px;font-weight:700;color:var(--loss);background:var(--panel);padding:2px 8px;border-radius:999px">หาย ${fmt(lost,2)} ต · ${fmt(lp,1)}%</span>`:'<span style="font-size:10px;color:var(--muted)">ยังไม่ปิดยอด</span>'}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">

        ${cell('ค้างลาน',fmt(stock)+' ต','var(--stock)')}

  </div>`;
}
// 🧾 รายละเอียดบิล = เลย์เอาต์เหมือน Flex "รายงานผลปาล์มประจำวัน" (หน่วย กก.)
function billDetailFlex(r,ramp){
  const kg=v=>fmt(v||0)+' กก.';
  const carry=r.carryOver||0, bA=r.buyA||0, bB=r.buyB||0, bC=r.buyCompany||0, buy=r.buy||0;
  const sendF=r.sendFactory||0, sendB=r.sendBorai||0, send=r.send||0, tripsF=r.tripsFactory||0, tripsB=r.tripsBorai||0;
  const remain=r.stock||0, totalIn=carry+buy;
  const line=(l,v,strong)=>`<div style="display:flex;justify-content:space-between;padding:5px 2px;font-size:12.5px;${strong?'border-top:1px solid var(--line)':''}"><span style="color:var(--ink2)">${l}</span><span class="num" style="font-weight:${strong?800:600};color:var(--ink)">${v}</span></div>`;
  const sec=t=>`<div style="background:var(--sendSoft);color:var(--send);font-weight:800;font-size:11.5px;letter-spacing:.02em;padding:5px 9px;border-radius:7px;margin:9px 0 3px">${t}</div>`;
  return `<div style="border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)">
    <div style="background:#1c3b2e;color:#fff;padding:12px 14px">
      <div style="font-size:11.5px;opacity:.85">🏭 รายงานผลปาล์มประจำวัน</div>
      <div style="font-weight:800;font-size:15px;line-height:1.3">${ramp}</div>
      <div style="font-size:11.5px;opacity:.82">${billDate(r.date)}</div>
    </div>
    <div style="padding:8px 14px 12px">
      ${sec('รับเข้า')}
      ${line('ค้างลาน (ยกมา)',kg(carry))}
      ${bA?line('ซื้อ A',kg(bA)):''}
      ${bB?line('ซื้อ B',kg(bB)):''}
      ${bC?line('ซื้อบริษัท',kg(bC)):''}
      ${line('ซื้อรวม',kg(buy))}
      ${line('รวม (ค้าง+ซื้อ)',kg(totalIn),1)}
      ${sec('ส่งออก')}
      ${line('ส่งโรงงาน (หนองใหญ่)',kg(sendF))}
      ${sendB?line('ส่งบ่อไร่',kg(sendB)):''}
      ${line('เที่ยว (โรงงาน)',fmt(tripsF)+(tripsB?(' + บ่อไร่ '+fmt(tripsB)):'')+' เที่ยว')}
      ${line('ส่งรวม',kg(send),1)}
      ${sec('ปิดยอด')}
      ${line('คงค้าง',kg(remain),1)}
    </div>
  </div>`;
}
function openRampDrawer(ramp){
  const dts=curDates(), stats=rampOrderStats(ramp), agg=rampAgg(ramp,dts);
  const sendTons=agg.send, ordTons=stats.tons, extTons=Math.max(0,sendTons-ordTons);
  $('#drTitle').textContent=ramp;
  let h=`<div style="font-size:12px;color:var(--ink2);margin-bottom:12px">${dts[0]||'-'} → ${dts[dts.length-1]||'-'}</div>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">${sumTile('ส่งโรงงาน',fmt(sendTons)+' ตัน','var(--send)')}${sumTile('ออเดอร์บริษัท',stats.count+' เที่ยว · '+fmt(ordTons)+' ต','var(--good)')}${sumTile('รถนอก (ประเมิน)',fmt(extTons)+' ต · ~'+binsFor(extTons)+' กระบะ','var(--buy)')}${sumTile('ค้างลาน',dispatchText(agg.stock),'var(--stock)')}</div>`;
  const list=rampDrawerOrders(ramp);
  const ordRow=o=>{const dd=o.date?o.date.slice(5).replace('-','/'):'';const tm=o.time?' '+o.time+' น.':'';const bb=o.done?['✓ จบงาน','var(--good)']:(o.taken?['🚚 '+(o.driver||'รับแล้ว'),'var(--send)']:['⏳ รอคนขับรับ','var(--loss)']);return `<div class="ordrow"><div><div class="id">${o.orderId}</div><div class="meta">เข้ารับ ${dd}${tm} · ${o.driver||'—'}${o.plate?' · '+o.plate:''}</div></div><div><div class="w">${o.weight?fmt(o.weight/TON,1)+' ต':'—'}</div><div class="st" style="color:${bb[1]}">${bb[0]}</div></div></div>`;};
  const doneL=list.filter(o=>o.done).sort((a,b)=>a.date<b.date?1:-1), newL=list.filter(o=>!o.done).sort((a,b)=>a.date<b.date?1:-1);
  const secHead=(txt,c,mt)=>`<div style="font-size:13.5px;font-weight:800;color:${c};margin:${mt}px 0 6px;padding:5px 0 5px 9px;border-left:3px solid ${c};background:${c==='var(--send)'?'var(--sendSoft)':'var(--panel)'};border-radius:0 6px 6px 0">${txt}</div>`;
  if(newL.length)h+=secHead('🆕 ออเดอร์ใหม่ / กำลังทำ ('+newL.length+')','var(--send)',2)+newL.map(ordRow).join('');
  if(doneL.length)h+=secHead('✓ ออเดอร์วันนี้ที่จบแล้ว ('+doneL.length+')','var(--ink2)',newL.length?16:2)+doneL.map(ordRow).join('');
  if(!list.length)h+='<div style="color:var(--muted);font-size:13px;padding:8px 0">ยังไม่มีออเดอร์แจ้งขอรถ — ส่งรถนอก หรือยังไม่ได้ขอรถ 🚛</div>';
  if(extTons>0.5)h+=`<div class="ordrow" style="border-bottom:0;margin-top:8px"><div><div class="id" style="color:var(--buy)">🚛 รถนอก</div><div class="meta">ส่วนที่ส่งเกินออเดอร์บริษัท</div></div><div><div class="w" style="color:var(--buy)">${fmt(extTons,1)} ต</div><div class="st" style="color:var(--buy)">~${binsFor(extTons)} กระบะ</div></div></div>`;
  // 🧾 บิลรายวันของลานนี้ (ล่าสุดก่อน) — เหมือนรายการบิลใน Flex แจ้งแอดมินรายวัน
  const bills=dts.map(dt=>BY[ramp]&&BY[ramp][dt]).filter(Boolean)
    .filter(r=>r.buy>0||r.send>0||r.stock>0||(r.lost+(r.roundLoss||0))>0)
    .sort((a,b)=>a.date<b.date?1:-1);
  if(bills.length)h+=secHead('🧾 บิลรายวัน ('+bills.length+' วัน · จิ้มดูรายละเอียด)','var(--accent)',16)+bills.map(r=>billCard(r,ramp)).join('');
  $('#drBody').innerHTML=h;
  $('#ov').classList.add('on');$('#dr').classList.add('on');
}
function drawRank(){
  const dts=curDates(), s=scopeSel();
  let items=[];
  if(hasR(s)) s.ramps.forEach(r=>{const a=rampAgg(r,dts);if(a.buy>0||a.send>0)items.push({name:a.name,send:a.send,isG:false,agg:a});});
  if(hasG(s)) gardenAggList(s.gardens,dts).forEach(g=>{if(g.tons>0)items.push({name:g.garden,send:g.tons,trips:g.trips,isG:true});});
  items.sort((a,b)=>b.send-a.send);
  const max=Math.max(...items.map(d=>d.send),1);
  $('#rank').innerHTML=items.map(d=>{
    if(d.isG){const gi=_reg(d.name);
      return `<div class="rrow" onclick="openGardenDrawer(_DRW[${gi}])"><div class="rname" style="color:var(--gpalm);font-weight:700">🌳 ${cleanName(d.name)}<div style="font-size:9.5px;font-weight:700;color:var(--gpalm);white-space:nowrap">ส่งตรงโรงงาน ${d.trips} เที่ยว · แตะดู</div></div><div class="bartrack"><div class="barfill" style="width:${(d.send/max*100).toFixed(1)}%;background:var(--gpalm)"></div></div><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="rval num">${fmt(d.send)}</span></div></div>`;
    }
    const a=d.agg,bad=a.hasLoss&&a.lossPct>1.5,hl=(s.kind==='ramp1'&&a.name===s.ramps[0])?'style="font-weight:800;color:var(--accent)"':'';
    const chip=a.hasLoss?`<span class="chip ${bad?'bad':'ok'}" title="น้ำหนักหาย (ตอนล้างลาน)">${fmt(a.lossPct,1)}%</span>`:`<span class="chip" style="background:var(--panel);color:var(--muted)" title="ยังไม่มีข้อมูลหาย — คิดตอนล้างลาน">—</span>`;
    const os=rampDrawerOrders(a.name),pend=os.filter(o=>!o.done).length,dn=os.length-pend;
    const ordLine=pend>0?`<div style="font-size:9.5px;font-weight:700;color:var(--send);white-space:nowrap">🔔 มีรถกำลังมา ${pend} · แตะดู</div>`:(dn>0?`<div style="font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap">✓ จบแล้ว ${dn} · แตะดู</div>`:(a.send>0?`<div style="font-size:9.5px;font-weight:700;color:var(--buy);white-space:nowrap">🚛 รถนอก · แตะดู</div>`:''));
    return `<div class="rrow" onclick="openRampDrawer('${a.name}')"><div class="rname" ${hl}>${a.name}${ordLine}</div><div class="bartrack"><div class="barfill" style="width:${(a.send/max*100).toFixed(1)}%"></div></div><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="rval num">${fmt(a.send)}</span>${chip}</div></div>`;
  }).join('')||'<div class="pnote" style="padding:10px 0">ไม่มีข้อมูลในช่วงนี้</div>';
}
function drawInsights(rows,tot,lossPct,rspoPct){
  const dts=curDates(),n=rows.length||1,s=scopeSel();
  const per=hasR(s)?s.ramps.map(r=>rampAgg(r,dts)).filter(d=>d.buy>0||d.send>0):[];
  const gper=hasG(s)?gardenAggList(s.gardens,dts):[];
  if(!per.length&&!gper.length){$('#ins').innerHTML='<div class="pnote" style="padding:10px 16px">ไม่มีข้อมูล</div>';return;}
  const ins=[];
  const bestR=per.slice().sort((a,b)=>b.send-a.send)[0], bestG=gper[0];
  const best=(bestG&&(!bestR||bestG.tons>bestR.send))?{name:'🌳 '+cleanName(bestG.garden),send:bestG.tons}:(bestR?{name:bestR.name,send:bestR.send}:null);
  if(best)ins.push({em:'🏭',tl:'ระบายเข้าโรงงานดีสุด',bd:`<b>${best.name}</b> ส่ง ${fmt(best.send)} ตัน`});
  if(per.length){
    const worstLoss=per.filter(d=>d.hasLoss).sort((a,b)=>b.lossPct-a.lossPct)[0];
    const topStock=per.slice().sort((a,b)=>b.stock-a.stock)[0];
    const bb=per.slice().sort((a,b)=>b.send-a.send)[0];
    const clearDays=(bb&&bb.send>0&&topStock)?topStock.stock/(bb.send/n):0;
    ins.push({alert:!!worstLoss&&worstLoss.lossPct>1.5,em:(worstLoss&&worstLoss.lossPct>1.5)?'⚠️':'🍃',tl:'น้ำหนักหายสูงสุด',bd:worstLoss?`<b>${worstLoss.name}</b> ${fmt(worstLoss.lossPct,2)}%${worstLoss.lossPct>1.5?' — ควรตรวจสาเหตุ':''}`:'ยังไม่มีข้อมูล (คิดตอนล้างลาน)'});
    if(topStock)ins.push({em:'📦',tl:'สต็อกค้างที่ลานเยอะสุด',bd:`<b>${topStock.name}</b> ${fmt(topStock.stock)} ตัน${clearDays?` (~${fmt(clearDays,1)} วันระบาย)`:''}`});
  }
  if(gper.length){
    const gT=gper.reduce((a,g)=>a+g.tons,0),gTr=gper.reduce((a,g)=>a+g.trips,0);
    ins.push({em:'🌳',tl:'สวนส่งตรงโรงงาน',bd:`<b>${gper.length}</b> สวน · ${fmt(gT)} ตัน · ${gTr} เที่ยว`});
    if(gper[0])ins.push({em:'🏆',tl:'สวนส่งมากสุด',bd:`<b>${cleanName(gper[0].garden)}</b> ${fmt(gper[0].tons)} ตัน`});
  }
  if(per.length){
    ins.push({em:'🌱',tl:'ปาล์ม RSPO',bd:`${fmt(rspoPct,1)}% ของยอดซื้อ · ${fmt(tot.tRspo)} ตัน`});
    ins.push({em:'🍂',tl:'ปาล์มดิบคัดทิ้ง',bd:`${fmt(tot.tRaw)} ทะลาย · เฉลี่ย ${fmt(tot.tRaw/n,0)}/วัน`});
  }
  ins.push({em:'📈',tl:'อัตราส่งเฉลี่ย',bd:`${fmt(tot.tSend/n)} ตัน/วัน${tot.tBuy?` · ${fmt(tot.tSend/tot.tBuy*100,0)}% ของที่ซื้อเข้า`:''}`});
  $('#ins').innerHTML=ins.map(i=>`<div class="icard ${i.alert?'alert':''}"><span class="em">${i.em}</span><div><div class="tl">${i.tl}</div><div class="bd">${i.bd}</div></div></div>`).join('');
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!localStorage.getItem('rampTheme')&&window._rendered)render();});
boot();
</script>
