<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดลานปาล์ม · SSB Smart Supply</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#eef0ea; --panel:#f8f8f4; --card:#ffffff; --line:#dfe3da; --line2:#cdd3c6;
    --ink:#17201b; --ink2:#5c6b60; --muted:#8a978c;
    --accent:#1e7a4d; --send:#1e7a4d; --buy:#c98a1e; --loss:#c0492f; --good:#1e7a4d;
    --sendSoft:rgba(30,122,77,.14); --buySoft:rgba(201,138,30,.14);--stock:#2f6ca8;--stockSoft:rgba(47,108,168,.14);
    --shadow:0 1px 2px rgba(20,40,25,.05),0 8px 24px -12px rgba(20,40,25,.12); --r:16px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1512; --panel:#121b16; --card:#16211c; --line:#243029; --line2:#324034;
    --ink:#e7ece7; --ink2:#9fb0a3; --muted:#718476;
    --accent:#43b982; --send:#33a166; --buy:#bd8722; --loss:#e0705a; --good:#43b982;
    --sendSoft:rgba(51,161,102,.16); --buySoft:rgba(189,135,34,.15);--stock:#3d92c4;--stockSoft:rgba(61,146,196,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="light"]{--bg:#eef0ea;--panel:#f8f8f4;--card:#fff;--line:#dfe3da;--line2:#cdd3c6;--ink:#17201b;--ink2:#5c6b60;--muted:#8a978c;--accent:#1e7a4d;--send:#1e7a4d;--buy:#c98a1e;--loss:#c0492f;--good:#1e7a4d;--sendSoft:rgba(30,122,77,.14);--buySoft:rgba(201,138,30,.14);--stock:#2f6ca8;--stockSoft:rgba(47,108,168,.14);--shadow:0 1px 2px rgba(20,40,25,.05),0 8px 24px -12px rgba(20,40,25,.12)}
  :root[data-theme="dark"]{--bg:#0e1512;--panel:#121b16;--card:#16211c;--line:#243029;--line2:#324034;--ink:#e7ece7;--ink2:#9fb0a3;--muted:#718476;--accent:#43b982;--send:#33a166;--buy:#bd8722;--loss:#e0705a;--good:#43b982;--sendSoft:rgba(51,161,102,.16);--buySoft:rgba(189,135,34,.15);--stock:#3d92c4;--stockSoft:rgba(61,146,196,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",-apple-system,"Segoe UI",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:22px 18px 60px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--ink2)}
  .spacer{flex:1}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;cursor:pointer}
  .dr{display:inline-flex;align-items:center;gap:5px}
  .dr span{color:var(--muted);font-size:12px}
  input[type=date]{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer}
  input[type=date].on{border-color:var(--accent);color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lbl{font-size:11px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
  .kpi .dot{width:8px;height:8px;border-radius:3px;flex:none}
  .kpi .val{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.02em;line-height:1}
  .kpi .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
  .kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
  .up{color:var(--good)} .down{color:var(--loss)}
  .kpi.warn{border-color:color-mix(in srgb,var(--loss) 45%,var(--line))}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:15px 18px 4px}
  .ptitle{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .pnote{font-size:11.5px;color:var(--muted)}
  .chartwrap{padding:6px 12px 14px}
  .legend{display:flex;gap:16px;padding:0 18px 4px;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
  .lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .rank{padding:8px 18px 16px;display:flex;flex-direction:column;gap:11px}
  .rrow{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:10px}
  .rname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{height:9px;background:var(--panel);border-radius:6px;overflow:hidden}
  .barfill{height:100%;border-radius:6px;background:var(--send)}
  .rval{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
  .chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .chip.ok{background:var(--sendSoft);color:var(--good)}
  .chip.bad{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
  .ins{padding:6px 16px 16px;display:flex;flex-direction:column;gap:9px}
  .icard{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .icard .em{font-size:17px;line-height:1.2;flex:none}
  .icard .tl{font-size:11px;color:var(--ink2);font-weight:600}
  .icard .bd{font-size:13px;font-weight:700;margin-top:1px}
  .icard .bd b{color:var(--accent)}
  .icard.alert{background:color-mix(in srgb,var(--loss) 8%,var(--panel));border-color:color-mix(in srgb,var(--loss) 30%,var(--line))}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);text-align:center}
  .msg{text-align:center;color:var(--ink2);padding:60px 20px;font-size:14px}
  #tt{position:fixed;pointer-events:none;z-index:30;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:12px;opacity:0;transition:opacity .1s;min-width:150px}
  #tt .d{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  #tt .r{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0}
  #tt .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
  #tt .r i{width:9px;height:9px;border-radius:3px}
  #tt .r b{font-weight:800}
  svg{display:block;width:100%;height:auto}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <button onclick="goBack()" style="border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;width:42px;height:42px;font-size:18px;cursor:pointer">←</button>
      <div class="logo">🌴</div>
      <div><h1>แดชบอร์ดลานปาล์ม</h1><div class="sub">SSB Smart Supply · ผลปาล์มรายวัน เข้า–ออก–ส่งโรงงาน</div></div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="seg" id="rangeSeg">
        <button data-r="1">วันนี้</button>
        <button data-r="7">7 วัน</button>
        <button data-r="30" class="on">30 วัน</button>
        <button data-r="90">90 วัน</button>
      </div>
      <div class="dr"><input type="date" id="fromD" title="ตั้งแต่"><span>–</span><input type="date" id="toD" title="ถึง"></div>
      <select id="rampSel"></select>
      <div class="seg" id="themeSeg" title="โหมดสว่าง / มืด">
        <button data-t="light">☀️</button>
        <button data-t="dark">🌙</button>
      </div>
    </div>
  </div>
  <div id="app"><div class="msg">กำลังเข้าสู่ระบบ…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="tt"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw4UvKuRrAQ_3Ldm8U0VJqfjfBQUSYaTEdrxkdXUVN98G68XseCquhDeXfMgU8cVYaY/exec';
const LIFF_ID='2010274217-Ot7vGhri';
let MY_UID='';
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
function goBack(){if(history.length>1)history.back();else location.href='https://sadayu07ktc-droid.github.io/SSB-SMART-SUPPLY-DASHBOARD/';}

// ── ธีม (จำค่าใน localStorage) ──
function effTheme(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('rampTheme',t);}catch(e){}
  $('#themeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(window._rendered)render();}
(function(){let sv=null;try{sv=localStorage.getItem('rampTheme');}catch(e){}applyTheme(sv||effTheme());})();
$('#themeSeg').onclick=e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.t);};

// ── ข้อมูลจริง ──
let RECORDS=[], RAMPS=[], DATES=[], BY={};
let RANGE=30, SCOPE='all', CHARTTYPE='line', MODE='preset', FROM='', TO='';
const TON=1000; // kg → ตัน
const TON_PER_BIN=15; // ตัน/กระบะ · 2 กระบะ = 1 พ่วง (สั่งออเดอร์เป็นกระบะ)
function binsFor(ton){return Math.max(0,Math.ceil((ton||0)/TON_PER_BIN));}       // จำนวนกระบะ
function dispatchText(ton){const b=binsFor(ton);return `≈ ${b} กระบะ (${Math.ceil(b/2)} พ่วง)`;}
const toMs=d=>{const p=d.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);};

async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    const p=await liff.getProfile(); MY_UID=p.userId||'';
    if(!MY_UID){$('#app').innerHTML='<div class="msg" style="color:var(--loss)">ไม่พบ LINE UID</div>';return;}
    const r=await fetch(GAS_URL+'?action=getRampDaily&userId='+encodeURIComponent(MY_UID));
    const d=await r.json();
    if(d.denied){$('#app').innerHTML='<div class="msg" style="color:var(--loss)">ไม่มีสิทธิ์ (เฉพาะแอดมิน/ผู้บริหาร)</div>';return;}
    if(!d.ok){$('#app').innerHTML='<div class="msg">'+(d.error||'โหลดข้อมูลไม่ได้')+'</div>';return;}
    RECORDS=d.records||[]; RAMPS=d.ramps||[];
    if(!RECORDS.length){$('#app').innerHTML='<div class="msg">ยังไม่มีข้อมูลลานปาล์มรายวัน</div>';return;}
    DATES=[...new Set(RECORDS.map(r=>r.date))].sort();
    BY={}; RAMPS.forEach(rn=>BY[rn]={}); RECORDS.forEach(rec=>{BY[rec.ramp][rec.date]=rec;});
    buildShell();
    window._rendered=true; render();
  }catch(e){$('#app').innerHTML='<div class="msg">ผิดพลาด: '+e+'</div>';}
}

function buildShell(){
  $('#app').innerHTML=`
    <div class="kpis" id="kpis"></div>
    <div class="panel">
      <div class="phead">
        <div><div class="eyebrow">แนวโน้มรายวัน</div><div class="ptitle" id="trendTitle">ซื้อเข้า เทียบ ส่งโรงงาน</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="seg" id="chartSeg" style="padding:2px"><button data-c="line" class="on">📈 เส้น</button><button data-c="bar">📊 แท่ง</button></div>
          <div class="pnote" id="trendNote"></div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="stockBanner" style="margin:2px 18px 8px;padding:9px 13px;border-radius:11px;background:var(--stockSoft);display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px"></div>
      <div class="chartwrap"><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="กราฟปาล์มซื้อเข้า ส่งโรงงาน ค้างลาน"></svg></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="phead"><div><div class="eyebrow">ระบายเข้าโรงงาน</div><div class="ptitle">อันดับลาน · ส่งโรงงาน</div></div><div class="pnote">ตัน (ช่วงที่เลือก)</div></div>
        <div class="rank" id="rank"></div>
      </div>
      <div class="panel">
        <div class="phead"><div><div class="eyebrow">มุมผู้บริหาร</div><div class="ptitle">สิ่งที่ควรรู้</div></div></div>
        <div class="ins" id="ins"></div>
      </div>
    </div>`;
  const sel=$('#rampSel');
  sel.innerHTML='<option value="all">🌐 ภาพรวมทุกลาน</option>'+RAMPS.map(r=>`<option value="${r}">${r}</option>`).join('');
  sel.onchange=e=>{SCOPE=e.target.value;render();};
  $('#rangeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#rangeSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RANGE=+b.dataset.r;MODE='preset';$('#fromD').classList.remove('on');$('#toD').classList.remove('on');render();};
  $('#chartSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;CHARTTYPE=b.dataset.c;render();};
  // ช่วงวันที่กำหนดเอง
  const dMin=DATES[0], dMax=DATES[DATES.length-1];
  ['fromD','toD'].forEach(id=>{$('#'+id).min=dMin;$('#'+id).max=dMax;});
  $('#fromD').value=DATES[Math.max(0,DATES.length-30)]; $('#toD').value=dMax;
  function applyCustom(){FROM=$('#fromD').value;TO=$('#toD').value;if(!FROM||!TO)return;if(FROM>TO){const t=FROM;FROM=TO;TO=t;$('#fromD').value=FROM;$('#toD').value=TO;}MODE='custom';$('#rangeSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));$('#fromD').classList.add('on');$('#toD').classList.add('on');render();}
  $('#fromD').onchange=applyCustom; $('#toD').onchange=applyCustom;
  $('#foot').textContent='ข้อมูลจริงจาก Log Ramp รายวัน · หน่วยตัน (แปลงจาก กก.) · '+DATES.length+' วันในระบบ';
}

// รวมช่วง window วันที่ (SCOPE) → rows รายวัน (หน่วยตัน)
function sliceDates(dates,ramps){
  return dates.map(dt=>{
    let o={day:toMs(dt),buy:0,send:0,stock:0,lost:0,trips:0,rawCull:0,rspo:0};
    ramps.forEach(rn=>{const r=BY[rn]&&BY[rn][dt];if(r){o.buy+=r.buy/TON;o.send+=r.send/TON;o.stock+=r.stock/TON;o.lost+=(r.lost+(r.roundLoss||0))/TON;o.trips+=r.trips;o.rawCull+=r.rawCull;o.rspo+=r.rspo/TON;}});
    return o;
  });
}
function curDates(){
  if(MODE==='custom'&&FROM&&TO)return DATES.filter(d=>d>=FROM&&d<=TO);
  return DATES.slice(-RANGE);
}
function prevDates(){
  const cur=curDates(); if(!cur.length)return [];
  const first=DATES.indexOf(cur[0]); return DATES.slice(Math.max(0,first-cur.length),first);
}
function rampsInScope(){return SCOPE==='all'?RAMPS:[SCOPE];}
function sum(rows,k){return rows.reduce((a,r)=>a+r[k],0);}

function render(){ try{
  $('#tt').style.opacity='0';   // กัน tooltip ค้างตอนสลับลาน
  const rows=sliceDates(curDates(),rampsInScope());
  const prev=sliceDates(prevDates(),rampsInScope());
  const tSend=sum(rows,'send'),tBuy=sum(rows,'buy'),tLost=sum(rows,'lost'),tTrips=sum(rows,'trips'),tRaw=sum(rows,'rawCull'),tRspo=sum(rows,'rspo');
  const stockEnd=rows.length?rows[rows.length-1].stock:0;
  const lossPct=tBuy?tLost/tBuy*100:0, kgTrip=tTrips?tSend/tTrips:0, rspoPct=tBuy?tRspo/tBuy*100:0;
  const dl=(c,p,goodUp=true)=>{if(!p)return '<span class="delta" style="color:var(--muted)">รวมช่วง</span>';const d=(c-p)/p*100,good=goodUp?d>=0:d<0;return `<span class="delta ${good?'up':'down'}">${d>=0?'▲':'▼'} ${fmt(Math.abs(d),1)}%<span style="color:var(--muted);font-weight:600"> vs ก่อนหน้า</span></span>`;};
  const kpi=[
    {lbl:'ส่งโรงงาน',dot:'var(--send)',val:fmt(tSend),u:'ตัน',d:dl(tSend,sum(prev,'send'))},
    {lbl:'ซื้อเข้า',dot:'var(--buy)',val:fmt(tBuy),u:'ตัน',d:dl(tBuy,sum(prev,'buy'))},
    {lbl:'สต็อกค้างที่ลาน',dot:'var(--stock)',val:fmt(stockEnd),u:'ตัน',d:`<span class="delta" style="color:var(--stock)">≈ ${binsFor(stockEnd)} กระบะที่ต้องรับ</span>`},
    {lbl:'น้ำหนักหาย',dot:'var(--loss)',val:tLost>0?fmt(lossPct,2):'—',u:tLost>0?'%':'',d:tLost>0?`<span class="delta down">${fmt(tLost)} ตัน</span>`:'<span class="delta" style="color:var(--muted)">รอปิดรอบล้างลาน</span>',warn:tLost>0&&lossPct>1.5},
    {lbl:'เที่ยวส่งโรงงาน',dot:'var(--accent)',val:fmt(tTrips),u:'เที่ยว',d:'<span class="delta" style="color:var(--muted)">รวมช่วง</span>'},
    {lbl:'เฉลี่ย/เที่ยว',dot:'var(--accent)',val:fmt(kgTrip,1),u:'ตัน',d:'<span class="delta" style="color:var(--muted)">ประสิทธิภาพขน</span>'},
  ];
  $('#kpis').innerHTML=kpi.map(k=>`<div class="kpi ${k.warn?'warn':''}"><div class="lbl"><span class="dot" style="background:${k.dot}"></span>${k.lbl}</div><div class="val num">${k.val}<small>${k.u}</small></div>${k.d}</div>`).join('');
  const useBar = CHARTTYPE==='bar' || rows.length<2;
  $('#trendTitle').textContent=(SCOPE==='all'?'ทุกลาน':SCOPE)+(useBar?' · สรุป ซื้อ/ส่ง/ค้างลาน':' · ซื้อเข้า เทียบ ส่งโรงงาน');
  $('#trendNote').textContent=(RANGE===1?'วันนี้':rows.length+' วันล่าสุด')+' · หน่วยตัน';
  $('#legend').innerHTML = useBar
    ? '<span class="lg"><i style="background:var(--buy)"></i>ซื้อเข้า</span><span class="lg"><i style="background:var(--send)"></i>ส่งโรงงาน</span><span class="lg"><i style="background:var(--stock)"></i>ค้างลาน</span>'
    : '<span class="lg"><i style="background:var(--buy)"></i>ซื้อเข้า</span><span class="lg"><i style="background:var(--send)"></i>ส่งโรงงาน</span><span class="lg" style="color:var(--muted)">พื้นที่ระหว่างเส้น = สะสมเข้าสต็อก</span>';
  $('#chartSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===(useBar?'bar':'line')));
  const canLine=rows.length>=2, lineBtn=$('#chartSeg').querySelector('button[data-c="line"]');
  lineBtn.style.opacity=canLine?'':'0.4'; lineBtn.style.pointerEvents=canLine?'':'none'; lineBtn.title=canLine?'':'กราฟเส้นต้องมีอย่างน้อย 2 วัน';
  $('#stockBanner').innerHTML = stockEnd>0
    ? `<span style="font-weight:700;color:var(--stock)">📦 ค้างลาน ${fmt(stockEnd)} ตัน</span><span style="font-weight:800;background:var(--stock);color:#fff;padding:2px 11px;border-radius:999px">${dispatchText(stockEnd)}</span><span style="color:var(--ink2)">ควรเรียกรถเข้ารับ · 15 ตัน/กระบะ · 2 กระบะ = 1 พ่วง</span>`
    : '<span style="color:var(--ink2)">✓ ไม่มีปาล์มค้างลาน</span>';
  if(useBar) drawBar(); else drawChart(rows);
  drawRank(); drawInsights(rows,{tSend,tBuy,tRaw,tRspo},lossPct,rspoPct);
}catch(e){console.error('render error',e);} }

const W=900,H=300,PAD={l:44,r:54,t:16,b:26};
function smooth(pts){if(pts.length<2)return pts.length?`M${pts[0].x},${pts[0].y}`:'';let d=`M${pts[0].x},${pts[0].y}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;}return d;}
let CH={};
// กราฟแท่ง stacked 3 สี (ซื้อ/ส่ง/ค้างลาน) · ทั้งหมด=1แท่ง/ลาน · เลือกลาน=1แท่ง/วัน
function drawBar(){
  const svg=$('#chart'), tt=$('#tt');
  const dts=curDates(), perDay=(SCOPE!=='all');
  let data;
  if(!perDay){
    data=RAMPS.map(r=>{const a=rampAgg(r,dts);return {full:a.name,label:a.name,buy:a.buy,send:a.send,stock:a.stock,ord:a.ord,taken:a.taken};})
      .filter(d=>d.buy>0||d.send>0||d.stock>0).sort((a,b)=>b.stock-a.stock);
  }else{
    data=dts.map(dt=>{const r=BY[SCOPE]&&BY[SCOPE][dt],dd=new Date(toMs(dt)),dl=dd.getUTCDate()+'/'+(dd.getUTCMonth()+1);
      return {full:SCOPE+' · '+dl,label:dl,buy:r?r.buy/TON:0,send:r?r.send/TON:0,stock:r?r.stock/TON:0,ord:r?r.orderId:'',taken:r?!!r.taken:false};})
      .filter(d=>d.buy>0||d.send>0||d.stock>0);
  }
  if(!data.length){svg.innerHTML='<text x="450" y="150" text-anchor="middle" font-size="13" fill="var(--muted)">ไม่มีข้อมูลในช่วงนี้</text>';tt.style.opacity='0';return;}
  const segs=[['buy','var(--buy)'],['send','var(--send)'],['stock','var(--stock)']];
  const max=Math.max(...data.map(d=>d.buy+d.send+d.stock),1)*1.16;
  const inner=W-PAD.l-PAD.r, n=data.length;
  const bw=Math.max(6,Math.min(84,inner/n*(n>14?0.74:0.6))), gap=(inner-n*bw)/(n+1);
  const y=v=>PAD.t+(H-PAD.t-PAD.b)*(1-v/max);
  const showNum=bw>=32, lblStep=Math.ceil(n/9);
  let g='';const ticks=4;
  for(let t=0;t<=ticks;t++){const v=max*t/ticks,yy=y(v);g+=`<line x1="${PAD.l}" y1="${yy.toFixed(1)}" x2="${W-PAD.r}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${PAD.l-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;}
  data.forEach((d,i)=>{
    const bx=PAD.l+gap+(bw+gap)*i, cx=bx+bw/2; let acc=0;
    segs.forEach(([k,c])=>{const val=d[k]; if(val<=0){acc+=val;return;} const top=y(acc+val), bot=y(acc), h=Math.max(0,bot-top-2);
      g+=`<rect x="${bx.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" fill="${c}"/>`; acc+=val;});
    if(showNum&&d.stock>0)g+=`<text x="${cx.toFixed(1)}" y="${(y(acc)-7).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--stock)">${fmt(d.stock)}</text>`;
    if(d.ord)g+=`<circle cx="${cx.toFixed(1)}" cy="${(y(acc)-(showNum?24:8)).toFixed(1)}" r="4" fill="${d.taken?'var(--good)':'var(--loss)'}"><title>${d.ord} — ${d.taken?'คนขับรับแล้ว':'ยังไม่รับ'}</title></circle>`;
    let lbl=d.label; if(!perDay){lbl=(lbl.replace(/^ลาน\s?(ปาล์ม)?\s?/,'')||lbl);lbl=lbl.length>9?lbl.slice(0,8)+'…':lbl;}
    if(perDay?(i%lblStep===0):true)g+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="${perDay?'10':'11'}" font-weight="600" fill="var(--ink2)">${lbl}</text>`;
    g+=`<rect class="bhit" data-i="${i}" x="${bx.toFixed(1)}" y="${PAD.t}" width="${bw.toFixed(1)}" height="${(H-PAD.b-PAD.t).toFixed(1)}" fill="transparent"/>`;
  });
  svg.innerHTML=g;
  svg.querySelectorAll('.bhit').forEach(el=>{
    const show=ev=>{const d=data[+el.dataset.i],cx=ev.touches?ev.touches[0].clientX:ev.clientX,cy=ev.touches?ev.touches[0].clientY:ev.clientY;
      tt.innerHTML=`<div class="d">${d.full}</div><div class="r"><span><i style="background:var(--buy)"></i>ซื้อเข้า</span><b class="num">${fmt(d.buy)} ตัน</b></div><div class="r"><span><i style="background:var(--send)"></i>ส่งโรงงาน</span><b class="num">${fmt(d.send)} ตัน</b></div><div class="r"><span><i style="background:var(--stock)"></i>ค้างลาน</span><b class="num">${fmt(d.stock)} ตัน</b></div><div class="r"><span style="color:var(--muted)">ต้องเรียกรับ</span><b class="num" style="color:var(--stock)">${dispatchText(d.stock)}</b></div>${d.ord?`<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:5px"><span style="color:var(--muted)">${d.ord}</span><b class="num" style="color:${d.taken?'var(--good)':'var(--loss)'}">${d.taken?'✓ คนขับรับแล้ว':'⏳ ยังไม่รับ'}</b></div>`:''}`;
      tt.style.opacity='1';let tx=cx+14;if(tx+185>innerWidth)tx=cx-195;tt.style.left=tx+'px';tt.style.top=(cy-10)+'px';};
    el.addEventListener('mousemove',show);el.addEventListener('mouseleave',()=>tt.style.opacity='0');
    el.addEventListener('touchstart',show,{passive:true});el.addEventListener('touchend',()=>tt.style.opacity='0');
  });
}
function drawChart(rows){
  const svg=$('#chart');
  if(rows.length<2){svg.innerHTML='<text x="450" y="150" text-anchor="middle" font-size="13" fill="var(--muted)">ข้อมูลไม่พอวาดกราฟ</text>';return;}
  const max=Math.max(...rows.map(r=>Math.max(r.buy,r.send)),1)*1.12;
  const x=i=>PAD.l+(W-PAD.l-PAD.r)*(i/(rows.length-1));
  const y=v=>PAD.t+(H-PAD.t-PAD.b)*(1-v/max);
  const buyP=rows.map((r,i)=>({x:x(i),y:y(r.buy)})),sendP=rows.map((r,i)=>({x:x(i),y:y(r.send)}));
  CH={rows,x,y};
  let g='';const ticks=4;
  for(let t=0;t<=ticks;t++){const v=max*t/ticks,yy=y(v);g+=`<line x1="${PAD.l}" y1="${yy.toFixed(1)}" x2="${W-PAD.r}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${PAD.l-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;}
  const step=Math.max(1,Math.round(rows.length/6));
  for(let i=0;i<rows.length;i+=step){const dt=new Date(rows[i].day);g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${dt.getUTCDate()}/${dt.getUTCMonth()+1}</text>`;}
  const band=`${smooth(buyP)} ${sendP.slice().reverse().map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} Z`;
  const sendArea=`${smooth(sendP)} L${x(rows.length-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const eB=buyP[buyP.length-1],eS=sendP[sendP.length-1];
  svg.innerHTML=`<defs><linearGradient id="sfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--send)" stop-opacity="0.20"/><stop offset="1" stop-color="var(--send)" stop-opacity="0.02"/></linearGradient></defs>
    ${g}<path d="${sendArea}" fill="url(#sfill)"/><path d="${band}" fill="var(--buySoft)"/>
    <path d="${smooth(buyP)}" fill="none" stroke="var(--buy)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="${smooth(sendP)}" fill="none" stroke="var(--send)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="${eB.x.toFixed(1)}" cy="${eB.y.toFixed(1)}" r="4" fill="var(--buy)" stroke="var(--card)" stroke-width="2"/>
    <circle cx="${eS.x.toFixed(1)}" cy="${eS.y.toFixed(1)}" r="4.5" fill="var(--send)" stroke="var(--card)" stroke-width="2"/>
    <text x="${(eS.x+8).toFixed(1)}" y="${(eS.y+4).toFixed(1)}" font-size="11.5" font-weight="800" fill="var(--send)">${fmt(rows[rows.length-1].send)}</text>
    <text x="${(eB.x+8).toFixed(1)}" y="${(eB.y+4).toFixed(1)}" font-size="11.5" font-weight="800" fill="var(--buy)">${fmt(rows[rows.length-1].buy)}</text>
    <line id="cross" x1="0" y1="${PAD.t}" x2="0" y2="${H-PAD.b}" stroke="var(--line2)" stroke-width="1" opacity="0"/>
    <rect id="hit" x="${PAD.l}" y="0" width="${W-PAD.l-PAD.r}" height="${H}" fill="transparent"/>`;
  bindHover(svg);
}
function bindHover(svg){
  const hit=svg.querySelector('#hit'),cross=svg.querySelector('#cross'),tt=$('#tt'),{rows,x}=CH;
  function move(ev){const rect=svg.getBoundingClientRect();const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)/rect.width*W;let i=Math.round((px-PAD.l)/((W-PAD.l-PAD.r)/(rows.length-1)));i=Math.max(0,Math.min(rows.length-1,i));const r=rows[i],cx=x(i);cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('opacity','1');const dt=new Date(r.day);
    tt.innerHTML=`<div class="d">${dt.getUTCDate()}/${dt.getUTCMonth()+1}/${(dt.getUTCFullYear()+543)%100}</div><div class="r"><span><i style="background:var(--buy)"></i>ซื้อเข้า</span><b class="num">${fmt(r.buy)} ตัน</b></div><div class="r"><span><i style="background:var(--send)"></i>ส่งโรงงาน</span><b class="num">${fmt(r.send)} ตัน</b></div><div class="r"><span style="color:var(--muted)">เข้าสต็อก</span><b class="num" style="color:var(--ink2)">${fmt(Math.max(0,r.buy-r.send))} ตัน</b></div>`;
    tt.style.opacity='1';let tx=ev.clientX+14;if(tx+170>innerWidth)tx=ev.clientX-184;tt.style.left=tx+'px';tt.style.top=((ev.touches?ev.touches[0].clientY:ev.clientY)-10)+'px';}
  function leave(){cross.setAttribute('opacity','0');tt.style.opacity='0';}
  hit.addEventListener('mousemove',move);hit.addEventListener('mouseleave',leave);hit.addEventListener('touchmove',move,{passive:true});hit.addEventListener('touchend',leave);
}
function rampAgg(ramp,dates){let send=0,buy=0,lost=0,stock=0,last=null,storedPct=0,ord='',taken=false,bins=0;dates.forEach(dt=>{const r=BY[ramp]&&BY[ramp][dt];if(r){send+=r.send/TON;buy+=r.buy/TON;lost+=(r.lost+(r.roundLoss||0))/TON;storedPct=Math.max(storedPct,r.roundLossPct||0,r.lossPct||0);if(r.orderId){ord=r.orderId;taken=!!r.taken;bins=r.bins||0;}last=r;}});if(last)stock=last.stock/TON;
  let lossPct=buy?lost/buy*100:0, hasLoss=lost>0.0001; if(!hasLoss&&storedPct>0){lossPct=storedPct;hasLoss=true;}
  return {name:ramp,send,buy,lost,stock,lossPct,hasLoss,ord,taken,bins};}
function drawRank(){
  const dts=curDates();
  const data=RAMPS.map(r=>rampAgg(r,dts)).filter(d=>d.buy>0||d.send>0).sort((a,b)=>b.send-a.send);
  const max=Math.max(...data.map(d=>d.send),1);
  $('#rank').innerHTML=data.map(d=>{const bad=d.hasLoss&&d.lossPct>1.5,hl=SCOPE!=='all'&&d.name===SCOPE?'style="font-weight:800;color:var(--accent)"':'';
    const chip=d.hasLoss?`<span class="chip ${bad?'bad':'ok'}" title="น้ำหนักหาย (ตอนล้างลาน)">${fmt(d.lossPct,1)}%</span>`:`<span class="chip" style="background:var(--panel);color:var(--muted)" title="ยังไม่มีข้อมูลหาย — คิดตอนล้างลาน">—</span>`;
    const ordLine=d.ord?`<div style="font-size:9.5px;font-weight:700;color:${d.taken?'var(--good)':'var(--loss)'};white-space:nowrap" title="${d.ord}">${d.taken?'✓ คนขับรับแล้ว':'⏳ ยังไม่รับงาน'}</div>`:'';
    return `<div class="rrow"><div class="rname" ${hl}>${d.name}${ordLine}</div><div class="bartrack"><div class="barfill" style="width:${(d.send/max*100).toFixed(1)}%"></div></div><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="rval num">${fmt(d.send)}</span>${chip}</div></div>`;}).join('')||'<div class="pnote" style="padding:10px 0">ไม่มีข้อมูลในช่วงนี้</div>';
}
function drawInsights(rows,tot,lossPct,rspoPct){
  const dts=curDates(),n=rows.length||1;
  const per=RAMPS.map(r=>rampAgg(r,dts)).filter(d=>d.buy>0||d.send>0);
  if(!per.length){$('#ins').innerHTML='<div class="pnote" style="padding:10px 16px">ไม่มีข้อมูล</div>';return;}
  const best=per.slice().sort((a,b)=>b.send-a.send)[0];
  const worstLoss=per.filter(d=>d.hasLoss).sort((a,b)=>b.lossPct-a.lossPct)[0];
  const topStock=per.slice().sort((a,b)=>b.stock-a.stock)[0];
  const clearDays=best.send>0?topStock.stock/(best.send/n):0;
  const ins=[
    {em:'🏭',tl:'ระบายเข้าโรงงานดีสุด',bd:`<b>${best.name}</b> ส่ง ${fmt(best.send)} ตัน`},
    {alert:!!worstLoss&&worstLoss.lossPct>1.5,em:(worstLoss&&worstLoss.lossPct>1.5)?'⚠️':'🍃',tl:'น้ำหนักหายสูงสุด',bd:worstLoss?`<b>${worstLoss.name}</b> ${fmt(worstLoss.lossPct,2)}%${worstLoss.lossPct>1.5?' — ควรตรวจสาเหตุ':''}`:'ยังไม่มีข้อมูล (คิดตอนล้างลาน)'},
    {em:'📦',tl:'สต็อกค้างที่ลานเยอะสุด',bd:`<b>${topStock.name}</b> ${fmt(topStock.stock)} ตัน${clearDays?` (~${fmt(clearDays,1)} วันระบาย)`:''}`},
    {em:'🌱',tl:'ปาล์ม RSPO',bd:`${fmt(rspoPct,1)}% ของยอดซื้อ · ${fmt(tot.tRspo)} ตัน`},
    {em:'🍂',tl:'ปาล์มดิบคัดทิ้ง',bd:`${fmt(tot.tRaw)} ทะลาย · เฉลี่ย ${fmt(tot.tRaw/n,0)}/วัน`},
    {em:'📈',tl:'อัตราส่งเฉลี่ย',bd:`${fmt(tot.tSend/n)} ตัน/วัน · ${fmt(tot.tBuy?tot.tSend/tot.tBuy*100:0,0)}% ของที่ซื้อเข้า`},
  ];
  $('#ins').innerHTML=ins.map(i=>`<div class="icard ${i.alert?'alert':''}"><span class="em">${i.em}</span><div><div class="tl">${i.tl}</div><div class="bd">${i.bd}</div></div></div>`).join('');
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!localStorage.getItem('rampTheme')&&window._rendered)render();});
boot();
</script>
