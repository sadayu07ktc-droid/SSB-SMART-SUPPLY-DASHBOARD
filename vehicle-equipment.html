<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>อุปกรณ์ติดรถ — SSB</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="ssb-read.js?v=20261016w"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 🧰 อุปกรณ์ติดรถ (แอดมิน) · 12 พ.ย. 2569 · ซ้าย = รายชื่อรถ · ขวา = รายคัน (อุปกรณ์ที่ถือ / เบิก-คืน / ประวัติเช็ค) หรือ สรุปอุปกรณ์
   ประหยัดโควตา: รายชื่อรถ = fmSheet (เบา) ครั้งเดียว · รายละเอียดโหลดเฉพาะตอนกดคัน (getVehicle) · ไม่มีรีเฟรชเอง */
:root{
  --bg:#EDF1EE; --card:#fff; --sunken:#F3F6F3; --ink:#152019; --muted:#5D6B62; --faint:#8A968D; --line:#DCE4DE;
  --green:#1B4332; --green2:#2D6A4F; --gold:#C9A227; --goldtint:#FBF1DC; --bad:#B91C1C; --badtint:#FEE2E2; --ok:#15803D; --oktint:#DCFCE7; --warn:#B45309; --warntint:#FEF3C7;
  --sans:"Noto Sans Thai","Sarabun","Segoe UI",sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
.top{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top a{color:#fff;text-decoration:none;opacity:.85;font-size:13px}
.top h1{font-size:17px;margin:0}
.top .sub{font-size:12px;opacity:.8}
.top .sp{flex:1}
.vw{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.vw button{border:0;border-radius:8px;padding:6px 12px;background:none;color:#fff;cursor:pointer;font-weight:600}
.vw button.on{background:#fff;color:var(--green)}
.wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px;padding:12px 16px 32px}
.wrap.full{grid-template-columns:1fr}
.wrap.full .side{display:none}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 90px);overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.srch{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.veh{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;cursor:pointer}
.veh:hover{background:var(--sunken)}
.veh.on{background:#E3EEE7;border-color:#B9D3C2}
.veh .pl{font-weight:700;font-size:14px}
.veh .dr{font-size:12px;color:var(--muted)}
.veh .mt{margin-left:auto;font-size:12px;white-space:nowrap}
.b{display:inline-block;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b.bad{background:var(--badtint);color:var(--bad)} .b.ok{background:var(--oktint);color:var(--ok)} .b.gold{background:var(--goldtint);color:#7A5A12} .b.gr{background:var(--sunken);color:var(--muted)} .b.warn{background:var(--warntint);color:var(--warn)}
.main{min-width:0}
.msg{padding:28px;text-align:center;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.vh{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.vh .pl{font-size:20px;font-weight:800}
.vh .pl small{font-size:13px;font-weight:600;color:var(--muted)}
.vh .info{font-size:13px;color:var(--muted)}
.vh .sp{flex:1}
.kp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kp div{background:var(--sunken);border-radius:10px;padding:6px 12px;min-width:96px}
.kp b{display:block;font-size:18px}
.kp span{font-size:12px;color:var(--muted)}
.kp .bad b{color:var(--bad)} .kp .ok b{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--sunken);font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.short td{background:#FFF7F7}
table.t .nm{font-weight:600}
table.t .sm{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--bad);font-weight:700} .zero{color:var(--muted);font-weight:700}
.btn{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--green);color:#fff}
.btn.gh{background:var(--sunken);border:1px solid var(--line)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
a.lk{color:var(--green2);font-weight:600}
/* ฟอร์มเบิก-คืน */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.fg label,.lnh{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.fg input,.fg select,.ln input,.ln select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff}
.ln{display:grid;grid-template-columns:minmax(160px,2fr) 80px minmax(110px,1fr) minmax(120px,1fr) 30px;gap:6px;align-items:end;margin-bottom:6px}
.ln .x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:4px}
.ln .hold{font-size:11.5px;color:var(--muted);grid-column:1/-1;margin-top:-2px}
.note{font-size:12.5px;color:var(--muted)}
.err{background:var(--badtint);color:var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px}
/* แถบ 14 วัน */
.d14{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0 10px}
.d14 i{font-style:normal;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);min-width:30px}
.d14 i b{font-size:16px;line-height:1.3}
/* ลิ้นชัก */
.dim{position:fixed;inset:0;background:rgba(10,20,14,.4);z-index:50;display:none}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:51;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drw.open{transform:none} .dim.open{display:block}
.drw .hd{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.drw .hd h4{margin:0;font-size:16px;flex:1}
.drw .hd button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.drw .bd{padding:14px 16px;overflow:auto;flex:1}
.drw label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.drw input,.drw textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:9px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.toast.err{background:var(--bad)}
.ldr{display:flex;align-items:center;gap:10px;justify-content:center;padding:30px;color:var(--muted)}
.ldr i{width:20px;height:20px;border:3px solid #CFE0D5;border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 🔍 ฟอร์มสุ่มตรวจ แบบมือถือ (ปุ่มใหญ่เหมือนฟอร์มคนขับ) */
.af{padding:12px 14px;margin-bottom:8px}.af.af-ok{border-left:5px solid var(--ok)}.af.af-bad{border-left:5px solid var(--bad);background:#FFF9F9}
.af-h{display:flex;align-items:center;gap:8px;font-size:16px}.af-h b{flex:1;min-width:0}
.mr-n{flex:none;min-width:28px;height:28px;border-radius:8px;background:#E3EEE7;color:var(--green);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.af-u{font-size:12px;color:var(--muted)}.af-tick{color:var(--ok);font-weight:800;font-size:20px}.af-res{font-size:14px;white-space:nowrap}
.af-info{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 8px 36px}.af-info b{color:var(--ink)}
.af-st{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.af-b{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:28px;font-weight:700;color:var(--green);cursor:pointer;touch-action:manipulation}
.af-b:active{background:#E3EEE7}.af-b:disabled{opacity:.35}
.af-num{min-width:48px;text-align:center;font-size:28px;font-weight:800}.af-num.em{color:var(--faint)}
.af-q{display:flex;gap:6px;margin-left:auto}
.af-eq{min-height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunken);font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
.af-eq.on{background:var(--green);border-color:var(--green);color:#fff}
.af-cd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.af-sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.af-c{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer;touch-action:manipulation}
.af-c.on{background:var(--green);border-color:var(--green);color:#fff}.af-c.on.c-ชำรุด{background:var(--warn);border-color:var(--warn)}.af-c.on.c-หาย{background:var(--bad);border-color:var(--bad)}
.af-note,.af-odo{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font-size:16px;margin-top:8px;background:#fff}
.af-odo{font-size:20px;font-weight:700;margin-top:4px}
.af-bar{position:sticky;bottom:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:8px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px rgba(0,0,0,.08)}
.af-prog{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden;margin-bottom:8px}.af-prog i{display:block;height:100%;background:var(--ok);transition:width .2s}
.af-bt{display:flex;align-items:center;gap:8px}.af-bt span{flex:1;font-size:14px}.af-bt .btn{min-height:44px;padding:0 16px;font-size:15px}
@media (max-width:620px){ .wrap{padding:8px 8px 24px} .top{padding:8px 12px} .af-info{margin-left:0} .af-q{margin-left:0;width:100%} .af-q .af-eq{flex:1} .vw button{padding:6px 8px} }
/* ⚙️ ตั้งชุดที่ต้องมี */
.rq-tpl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;background:var(--goldtint);border-radius:10px;padding:8px 10px;font-size:13px}.rq-tpl span{flex:1;min-width:180px}
.rq-list{padding:6px 12px}
.rq-cat{font-size:12px;font-weight:700;color:var(--faint);margin:12px 0 2px}
.rq{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.rq:not(.on) b{color:var(--muted);font-weight:500}.rq.ch{border-left-color:var(--gold);background:#FFFBF0}
.rq-n{flex:1;min-width:0}.rq-n .sm{font-size:12px;color:var(--muted)}
.rq-st{display:flex;align-items:center;gap:6px}.rq .af-b{width:44px;height:44px;font-size:24px}.rq .af-num{min-width:40px;font-size:22px}
.rq-note{width:100%;max-width:340px;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px}
/* 📊 Excel รถทั้งหมด */
.xa-c{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-left:4px solid #1d6f42}.xa-t{flex:1;min-width:200px}
.xa-k{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.xa-k span{background:var(--sunken);border-radius:999px;padding:3px 10px;font-size:12.5px}
.xa-k .ok{background:var(--oktint);color:var(--ok)}.xa-k .bl{background:#e6f1fb;color:#185fa5}.xa-k .bad{background:var(--badtint);color:var(--bad)}
.xa-s{margin:10px 0;font-size:13px}.xa-s ul{margin:4px 0;padding-left:18px;max-height:260px;overflow:auto}.xa-s li{margin:2px 0}
.xa-s.ok>b{color:var(--ok)}.xa-s.bl>b{color:#185fa5}.xa-s.bad>b{color:var(--bad)}.xa-s summary{cursor:pointer;font-weight:700}
.xa-up{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--goldtint);font-size:13px}.xa-up span{flex:1}
/* 📊 ปุ่มรายงาน + popup 3 ขั้น */
.rbtn{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(201,162,39,.18);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.rbtn:hover{background:rgba(201,162,39,.32)} .rbtn svg{color:var(--gold)}
.rpm{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
.rpm.open{display:flex}
.rpb{background:#fff;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.rph{display:flex;gap:12px;align-items:center}.rph b{font-size:16px}.rph>div{flex:1;min-width:0}
.rpi{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:var(--gold);display:flex;align-items:center;justify-content:center}
.rpx{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 8px}
.rpl{font-size:11px;font-weight:700;color:var(--faint);margin:14px 0 6px;letter-spacing:.3px}
.rpk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.rpk.on{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.rpk:disabled{opacity:.45;cursor:default}
.rki{flex:none;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:flex;align-items:center;justify-content:center}
.rkt{flex:1;min-width:0}.rkt b{display:block;font-size:14px}.rkt span{font-size:12px;color:var(--muted)}
.rpk i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}.rpk.on i{border:5px solid var(--c)}
.rpr{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}.rpr>span{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--muted);padding-top:4px}.rpr>div{display:flex;gap:5px;flex-wrap:wrap}
.rpc{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.rpc.on{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border-color:var(--green)}
.rps{font-size:13px;background:var(--sunken);border-radius:10px;padding:8px 12px}
.rpf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpf button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;cursor:pointer}
.rpf button:hover{border-color:var(--green2)} .rpf button:disabled{opacity:.6;cursor:wait}
.rpf span{width:40px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.rpf b{font-size:14px}.rpf small{font-size:11px;color:var(--muted)}
@media (max-width:900px){ .wrap{grid-template-columns:1fr} .side{position:static;max-height:none} }
@media (max-width:620px){ .ln{grid-template-columns:1fr 70px 30px} .ln .s2{grid-column:1/-1} }
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← แดชบอร์ด</a>
  <div><h1>🧰 อุปกรณ์ติดรถ</h1><div class="sub">เบิก / คืน · อุปกรณ์ที่ถือ · ประวัติรถรายคัน</div></div>
  <div class="sp"></div>
  <div class="vw" id="vw"><button data-v="veh" class="on">🚚 รายคัน</button><button data-v="sum">📦 สรุปอุปกรณ์</button><button data-v="aud">🔍 สุ่มตรวจ</button><button data-v="tpl">📋 ชุดมาตรฐาน</button></div>
  <button class="rbtn" id="bRep" title="ออกรายงาน Excel / PDF / JPEG"></button>
</div>
<div class="wrap" id="wrap">

    <input class="srch" id="q" placeholder="ค้นทะเบียน / ชื่อคนขับ">

</div>
<div class="rpm" id="rpm"><div class="rpb" id="rpb"></div></div>
<div class="dim" id="dim"></div>
<div class="drw" id="drw"><div class="hd"><h4 id="dT"></h4><button id="dX" aria-label="ปิด">×</button></div><div class="bd" id="dB"></div></div>

<script>
const EDGE = 'https://abihhdjcrbvwlkzwvjio.supabase.co/functions/v1/vehicle-equipment';
const LIFF_ID = '2010274217-Ot7vGhri';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const bkk = () => new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
const dTxt = (d) => d ? +d.slice(8, 10) + ' ' + TH_MS[+d.slice(5, 7) - 1] + ' ' + String(+d.slice(0, 4) + 543).slice(2) : '–';
const nf = (n) => Number(n || 0).toLocaleString('th-TH');
const GICON = { 'ไร่': '🌴', 'Bulk': '🛢️', 'Packing': '📦' };
const TYPES = [['เบิก', '➕ เบิก'], ['คืน', '↩️ คืน'], ['เปลี่ยน', '⇄ เปลี่ยน'], ['ชำรุด', '⚠️ ชำรุด'], ['สูญหาย', '❌ สูญหาย']];
const RR = { worn: '🔧 เสีย/หมดสภาพ', transfer: '📦 ย้ายคัน/เก็บเข้าคลัง' };

async function saveForm() {

  lines.forEach((l, k) => { if (!(Number(l.qty) > 0)) errs.push('แถว ' + (k + 1) + ': จำนวนต้องมากกว่า 0'); if (T !== 'เบิก' && Number(l.qty) > held(l.code)) errs.push('แถว ' + (k + 1) + ': เกินยอดที่ถืออยู่ (' + held(l.code) + ')'); });
  if (T === 'คืน' && !F.reason) errs.push('เลือกเหตุผลที่คืน');
  if (errs.length) { F.errs = errs; renderVTab(); return; }

  let r; try {
    r = await api({ action: 'saveMoves', vehicleId: V.vehicle.id, type: T, date: F.date, docNo: F.doc, receiverName: T === 'เบิก' ? F.recv : '', note: F.note, returnReason: T === 'คืน' ? F.reason : '',

  } catch (e) { r = { error: 'เน็ตมีปัญหา ยังไม่แน่ใจว่าบันทึกหรือยัง — โหลดคันนี้ใหม่ดูก่อนกดซ้ำ' }; }

}

    const done = [], fail = [];
    for (const s of p.saves) {   // ทีละชุด · PIN ผิดครั้งแรก = หยุด
      $('tpGo').textContent = '⏳ บันทึก ' + (done.length + fail.length + 1) + '/' + p.saves.length + '…';
      let r; try { r = await api({ action: 'saveTemplate', group: s.g, headKind: s.k || null, items: s.items, pin }, true); } catch (e) { r = { error: 'เน็ตมีปัญหา' }; }
      if (r.ok) done.push(s); else { fail.push({ s, msg: r.pinBad ? 'PIN ไม่ถูกต้อง' : (r.error || 'ไม่สำเร็จ') + (r.errors ? ': ' + r.errors.join(', ') : '') }); if (r.pinBad || !done.length) break; }
    }
    TP.busy = false;
    if (!done.length) { $('tpGo').disabled = false; $('tpGo').textContent = 'ยืนยันบันทึก ' + p.saves.length + ' ชุด'; $('tpPin').value = ''; $('tpErr').innerHTML = '<div class="err">' + esc(fail[0] ? fail[0].msg : 'ไม่สำเร็จ') + '</div>'; return; }
    closeDrw(); RQ = null;
    toast('บันทึกชุดมาตรฐานแล้ว ' + done.length + ' ชุด' + (fail.length ? ' · ไม่สำเร็จ ' + fail.length + ' ชุด: ' + fail.map((f) => f.s.g + ' · ' + (f.s.k || 'ตั้งต้น') + ' (' + f.msg + ')').join(', ') : ''), fail.length > 0);
    loadTpl({ grp: TP.grp, kind: TP.kind });
  };
  $('dim').classList.add('open'); $('drw').classList.add('open');
}

// ── events ──
$('vw').onclick = (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
$('grp').onclick = (e) => { const b = e.target.closest('[data-g]'); if (!b) return; GRP = b.dataset.g; document.querySelectorAll('#grp .chip').forEach((x) => x.classList.toggle('on', x === b)); renderList(); };
$('q').oninput = () => LIST && renderList();
$('vlist').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) openVeh(+b.dataset.id); };
$('dX').onclick = closeDrw; $('dim').onclick = closeDrw;
$('main').addEventListener('click', (e) => {
  const t = e.target, c = (s) => t.closest(s);
  if (c('[data-sg]')) { GRP = c('[data-sg]').dataset.sg; loadSum(); return; }
  if (c('#vtabs button')) { VTAB = c('#vtabs button').dataset.t; renderVTab(); return; }
  if (c('[data-q]')) { const [ty, code, n] = c('[data-q]').dataset.q.split('|'); F = newForm(ty, code, Math.max(1, +n || 1)); VTAB = 'mv'; renderVTab(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (c('[data-ty]')) { const ty = c('[data-ty]').dataset.ty; F.type = ty; F.errs = null; if (ty !== 'เบิก') F.lines.forEach((l) => { if (l.code && held(l.code) <= 0) l.code = ''; }); renderVTab(); return; }
  if (c('[data-rr]')) { F.reason = c('[data-rr]').dataset.rr; renderVTab(); return; }
  if (c('#fAdd')) { F.lines.push({ code: '', qty: 1, serial: '', exp: '', old: '' }); renderVTab(); return; }
  if (c('[data-del]')) { F.lines.splice(+c('[data-del]').dataset.del, 1); renderVTab(); return; }
  if (c('#fSave')) { saveForm(); return; }
  if (c('[data-rev]')) { openRev(c('[data-rev]').dataset.rev); return; }
  // 🔍 สุ่มตรวจ
  if (c('[data-ag]')) { GRP = c('[data-ag]').dataset.ag; loadAud(AUD && AUD.plan.week); return; }
  if (c('[data-aw]')) { loadAud(c('[data-aw]').dataset.aw); return; }
  if (c('#aPick')) { c('#aPick').disabled = true; audAct({ action: 'pickAudits', group: GRP, week: AUD.plan.week }, (r) => '🎲 สุ่มได้ ' + ((r.picked || []).length) + ' คัน'); return; }
  if (c('#aShuf')) { if (!confirm('สุ่มใหม่เฉพาะคันที่ระบบสุ่มและยังไม่ได้ตรวจ?')) return; audAct({ action: 'pickAudits', group: GRP, week: AUD.plan.week, reshuffle: true }, () => '🔀 สุ่มใหม่แล้ว'); return; }
  if (c('#aAdd')) { const vid = $('aAddV').value; if (!vid) { toast('เลือกรถก่อน', true); return; } audAct({ action: 'addAudit', vehicleId: +vid, week: AUD.plan.week }, () => '＋ เพิ่มเข้าแผนแล้ว'); return; }
  if (c('[data-askip]')) { const why = prompt('เหตุผลที่ข้ามคันนี้ (เช่น รถเข้าซ่อม / คนขับลา)'); if (!why || !why.trim()) return; audAct({ action: 'skipAudit', auditId: c('[data-askip]').dataset.askip, reason: why.trim() }, () => 'ข้ามแล้ว'); return; }
  if (c('[data-aud]')) { const [vid, aid] = c('[data-aud]').dataset.aud.split('|'); openAudit(+vid, aid); window.scrollTo({ top: 0 }); return; }
  if (c('#afBack')) { loadAud(AUD && AUD.plan.week); return; }
  if (c('#afPrint')) { printFm16(); return; }
  if (c('#afSave')) { saveAF(); return; }
  if (VIEW === 'aud' && AF && afTap(t)) return;
  if (VIEW === 'tpl' && TP && tpTap(t)) return;
  if (VIEW === 'veh' && VTAB === 'set' && RQ && rqTap(t)) return;
  if (c('[data-adj]')) { openAdj(c('[data-adj]').dataset.adj); return; }
});
$('main').addEventListener('input', (e) => {   // ⚙️ หมายเหตุชุดที่ต้องมี (ไม่วาดแถวใหม่ กันโฟกัสหลุด)
  const t = e.target; if (!RQ || t.dataset.rqn == null) return; const k = t.dataset.rqn; RQ.note[k] = t.value;
  const el = $('rq-' + k); if (el) el.classList.toggle('ch', rqChanged(k)); if ($('rqBar')) $('rqBar').innerHTML = rqBar();
});
$('main').addEventListener('input', (e) => {   // ฟอร์มสุ่มตรวจ (แยกจากฟอร์มเบิก-คืน)
  const t = e.target; if (VIEW !== 'aud' || !AF) return;
  if (t.dataset.af) { const [code, k] = t.dataset.af.split('|'); AF.lines[code][k] = t.value; if ($('afBar')) $('afBar').innerHTML = afBar(); const el = $('af-' + code), r = AF.sh.rows.find((x) => x.item_code === code); if (el && r) el.classList.toggle('af-ok', afDone(r)); return; }
  if (t.id === 'afOdo') AF.odo = t.value.replace(/D/g, ''); else if (t.id === 'afNote') AF.note = t.value;
});
$('main').addEventListener('input', (e) => {
  const t = e.target; if (!F || VIEW === 'aud') return;
  if (t.dataset.l != null) { F.lines[+t.dataset.l][t.dataset.k] = t.value; if (t.dataset.k === 'code') renderVTab(); return; }
  if (t.id === 'fDate') F.date = t.value; else if (t.id === 'fDoc') F.doc = t.value; else if (t.id === 'fRecv') F.recv = t.value; else if (t.id === 'fNote') F.note = t.value;
});

(async function init() {
  const q = new URLSearchParams(location.search);
  if (q.get('uid')) UID = q.get('uid');
  else {
    try { await liff.init({ liffId: LIFF_ID }); if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; } const p = await liff.getProfile(); UID = p.userId || ''; }
    catch (e) { $('vlist').innerHTML = '<div class="msg">เข้าระบบ LINE ไม่สำเร็จ</div>'; return; }
  }
  await loadList();
  if (q.get('view') === 'aud') setView('aud');
  if (q.get('view') === 'tpl') setView('tpl');
  else if (q.get('vehicle')) openVeh(+q.get('vehicle'));
})();
</script>
</body>
